.empty { color: var(--muted); }

rt { font-size: .55em; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.noruby rt { display: none; }
.qtext, .choice .tx, .exp { line-height: 2.05; }
.sessrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; margin-bottom: 8px; }
.sessrow #sess { margin: 0; }
.rtoggle { font-size: .9rem; padding: 6px 0; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

#tgroup { display: flex; flex-wrap: wrap; gap: 6px; }

table { border-collapse: collapse; width: 100%; font-size: .88rem; font-variant-numeric: tabular-nums; background: var(--paper); }
th, td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; white-space: nowrap; }

{"cat":"症例","sub":"症例","type":"single","q":"32歳女性。かぜをひき、うすい水様の痰を伴う咳、透明な鼻水、くしゃみがあり、背中がゾクゾクする。最も適した処方はどれか。","choices":["麻杏甘石湯","麻杏薏甘湯","小青竜湯","越婢加朮湯","葛根湯加川芎辛夷"],"answer":[2],"exp":"うすい（水様）痰・鼻汁＝小青竜湯。『傷寒論』「心下有水気」。粘稠痰・口渇なら麻杏甘石湯。","level":1},
{"cat":"症例","sub":"症例","type":"single","q":"生後3か月の乳児。かぜで鼻がつまり、母乳がうまく飲めない（哺乳困難）。添付文書の効能に「乳児の鼻閉塞、哺乳困難」が記載されている処方はどれか。","choices":["小青竜湯","葛根湯加川芎辛夷","麻黄附子細辛湯","麻黄湯","麻杏甘石湯"],"answer":[3],"exp":"麻黄湯（ツムラ27）の効能：感冒、インフルエンザ（初期）、関節リウマチ、喘息、乳児の鼻閉塞、哺乳困難。重箱の隅で出やすい。","level":3},
{"cat":"症例","sub":"症例","type":"single","q":"50歳女性。腎炎で顔や足がむくみ、尿量が少ない。汗をかきやすく、口渇がある。最も適した処方はどれか。","choices":["麻黄附子細辛湯","麻杏薏甘湯","葛根湯","越婢加朮湯","麻黄湯"],"answer":[3],"exp":"越婢加朮湯の効能：浮腫と汗が出て小便不利のあるものの腎炎、ネフローゼ、脚気、関節リウマチ、夜尿症、湿疹。","level":2},
{"cat":"症例","sub":"症例","type":"single","q":"74歳女性。冷え症で体力が低下している。冬になるとかぜをひきやすく、発熱は軽いのに寒気と全身倦怠感が強い。のどにチクチクした痛みもある。最も適した処方はどれか。","choices":["麻黄湯","麻黄附子細辛湯","越婢加朮湯","葛根湯","麻杏甘石湯"],"answer":[1],"exp":"熱感が乏しく悪寒・倦怠・冷えが強い＝少陰病の感冒＝麻黄附子細辛湯。麻黄湯は体力充実した太陽病実証向けで、高齢虚弱者には不向き。","level":2},
{"cat":"症例","sub":"症例","type":"single","q":"26歳女性。産後2週間。片側乳房が発赤腫脹し、悪寒・発熱・頭痛があるが汗は出ていない。発症初期。葛根湯の効能にも含まれる疾患として、最も適した処方はどれか。","choices":["葛根湯","麻杏薏甘湯","小青竜湯","麻黄附子細辛湯","麻杏甘石湯"],"answer":[0],"exp":"葛根湯の効能には炎症性疾患（結膜炎・角膜炎・中耳炎・扁桃腺炎・乳腺炎・リンパ腺炎）の初期も含まれる。","level":3},
{"cat":"症例","sub":"症例","type":"single","q":"体力中等度以上の35歳男性。かぜの初期で、悪寒・発熱・頭痛があり汗は出ていない。項背部のこわばりは特になく、全身の節々の痛みと腰痛が強い。葛根湯と迷うが、より適した処方はどれか。","choices":["葛根湯","麻黄湯","桂枝湯","麻黄附子細辛湯","小青竜湯"],"answer":[1],"exp":"同じ無汗の太陽病実証でも、項背強→葛根湯、身体痛・腰痛・関節痛（骨節疼痛）が目立つ→麻黄湯。","level":2},
{"cat":"症例","sub":"症例","type":"single","q":"体力虚弱な40歳女性。かぜをひき、悪風・発熱・頭痛があるが、じわっと自然に汗が出ている。脈は浮弱。最も適した処方はどれか。","choices":["麻黄湯","葛根湯","桂枝湯","麻黄附子細辛湯","小青竜湯"],"answer":[2],"exp":"自汗（自然発汗あり）・脈浮弱の太陽病虚証＝桂枝湯。麻黄湯・葛根湯は無汗・脈浮緊の実証。","level":1},
{"cat":"症例","sub":"症例","type":"single","q":"体力充実した30歳男性。かぜの初期で、悪寒・発熱・頭痛・関節痛があり、汗は出ていない。脈は浮緊。最も適した処方はどれか。","choices":["桂枝湯","麻黄湯","小建中湯","桂枝加朮附湯","麻黄附子細辛湯"],"answer":[1],"exp":"無汗・脈浮緊・関節痛＝麻黄湯。桂枝湯は自汗・脈浮弱の虚証。","level":1},
{"cat":"症例","sub":"症例","type":"single","q":"5歳女児。喘息発作で咳が止まらず、ゼーゼーいう。顔が赤く、汗をかき、しきりに水を欲しがる。最も適した処方はどれか。","choices":["小青竜湯","麻黄附子細辛湯","麻杏甘石湯","麻杏薏甘湯","葛根湯加川芎辛夷"],"answer":[2],"exp":"熱感・発汗・口渇を伴う咳嗽・喘鳴＝麻杏甘石湯。石膏の清熱・止渇作用がポイント。","level":1},
{"cat":"症例","sub":"症例","type":"single","q":"38歳男性。アレルギー性鼻炎ではなく、鼻閉が主訴で鼻汁はあまり出ない。頭が重く、副鼻腔炎の既往がある。最も適した処方はどれか。","choices":["小青竜湯","葛根湯加川芎辛夷","麻杏甘石湯","麻黄湯","越婢加朮湯"],"answer":[1],"exp":"水様性鼻汁中心→小青竜湯、鼻閉・副鼻腔炎中心→葛根湯加川芎辛夷、と使い分ける。","level":2},
{"cat":"症例","sub":"症例","type":"single","q":"55歳女性。関節リウマチで手指・膝の関節が腫れ、熱感とむくみがある。汗をかきやすく尿量は少ない。最も適した処方はどれか。","choices":["麻杏薏甘湯","麻黄附子細辛湯","越婢加朮湯","葛根湯","麻黄湯"],"answer":[2],"exp":"関節の腫脹・熱感・浮腫・発汗・小便不利＝越婢加朮湯（効能に関節リウマチを含む）。","level":2},
{"cat":"症例","sub":"症例","type":"single","q":"20歳男性。滲出液の多いジュクジュクした湿疹があり、患部に熱感、浮腫傾向、口渇がある。麻黄剤の中から選ぶとき最も適した処方はどれか。","choices":["麻黄湯","麻杏薏甘湯","葛根湯","越婢加朮湯","小青竜湯"],"answer":[3],"exp":"越婢加朮湯の効能には湿疹が含まれる（分泌物の多い湿潤した湿疹）。石膏で清熱、朮で利水。","level":3},
{"cat":"症例","sub":"症例","type":"single","q":"68歳男性。肺気腫の既往はない。かぜのあと、うすい泡沫状の痰が多く出て咳が続き、鼻水も多い。冷えはあるが倦怠感はそれほどでもない。最も適した処方はどれか。","choices":["麻杏甘石湯","小青竜湯","越婢加朮湯","麻杏薏甘湯","葛根湯加川芎辛夷"],"answer":[1],"exp":"水様（泡沫状）の痰・鼻水＝小青竜湯。乾姜・細辛・五味子・半夏が水毒を温めてさばく。","level":2},
{"cat":"症例","sub":"症例","type":"single","q":"体力のある40歳男性。かぜの初期で悪寒・発熱・無汗・項背部のこわばりに加えて、鼻づまりもひどい。基本処方に辛夷と川芎を加えた処方を選ぶとすればどれか。","choices":["麻黄湯","葛根湯加川芎辛夷","小青竜湯","麻杏甘石湯","麻黄附子細辛湯"],"answer":[1],"exp":"葛根湯加川芎辛夷＝葛根湯＋川芎・辛夷。鼻閉の強いケースで用いる（日本で作られた本朝経験方）。","level":2},
{"cat":"症例","sub":"症例","type":"single","q":"33歳女性。雨の日や湿気の多い時期に悪化する筋肉痛・関節痛があり、夕方に痛みが増す。関節の腫れや熱感・むくみは目立たない。最も適した処方はどれか。","choices":["越婢加朮湯","麻杏薏甘湯","麻黄附子細辛湯","小青竜湯","麻杏甘石湯"],"answer":[1],"exp":"麻杏薏甘湯は『金匱要略』で「風湿」による身体疼痛・日晡所（夕方）に劇しくなる痛みに用いる。腫脹・熱感・浮腫が強ければ越婢加朮湯。","level":3},
{"cat":"症例","sub":"症例","type":"single","q":"体力充実した22歳男性。かぜのひき始めで悪寒・発熱・頭痛があり、汗をかいていない。首筋が張る。胃腸は丈夫。次のうち、この患者に用いるのが最も不適切な処方はどれか。","choices":["桂枝湯","葛根湯","麻黄湯","葛根湯加川芎辛夷","小青竜湯"],"answer":[0],"exp":"桂枝湯は自汗のある虚証向け。無汗の実証には麻黄を含む葛根湯・麻黄湯を用いる。※この問題は「不適切なもの」を選ぶ。","level":2},
{"cat":"症例","sub":"症例","type":"single","q":"82歳女性。心房細動と高血圧で治療中。かぜをひき悪寒・発熱・関節痛・無汗。麻黄湯の証にみえるが、まず注意すべき点として最も適切なのはどれか。","choices":["麻黄のエフェドリンにより動悸・頻脈・血圧上昇が起こりうる","甘草による低血糖が起こりうる","附子中毒が起こりうる","大黄による下痢が起こりうる","柴胡による間質性肺炎が起こりうる"],"answer":[0],"exp":"麻黄湯は麻黄5g（ツムラ）。高齢者・循環器疾患・高血圧の患者では交感神経刺激作用（動悸・頻脈・血圧上昇）に注意。麻黄湯には附子・大黄・柴胡は含まれない。","level":2},
{"cat":"症例","sub":"症例","type":"multi","q":"次の症状・所見のうち、葛根湯や麻黄湯（太陽病の実証）を示唆するものを（すべて選べ）","choices":["悪寒","無汗","脈浮緊","自汗","脈沈細"],"answer":[0,1,2],"exp":"太陽病実証：悪寒発熱・無汗・脈浮緊。自汗・脈浮弱は桂枝湯（虚証）、脈沈細は少陰病（麻黄附子細辛湯）。","level":1},
{"cat":"鑑別・使い分け","sub":"使い分け","type":"single","q":"麻黄附子細辛湯が対応する六病位はどれか。","choices":["太陽病","少陽病","陽明病","少陰病","厥陰病"],"answer":[3],"exp":"少陰病「脈微細、但欲寐（ただ寝んと欲す）」。悪寒が強く熱感に乏しく倦怠・冷え・脈沈細。","level":1},
{"cat":"鑑別・使い分け","sub":"使い分け","type":"single","q":"小青竜湯の証を表す『傷寒論』の表現として最も適切なのはどれか。","choices":["項背強几几","心下有水気","胸脇苦満","往来寒熱","汗出悪風"],"answer":[1],"exp":"「傷寒表不解、心下有水気」＝表証＋水毒。項背強几几は葛根湯、胸脇苦満・往来寒熱は柴胡剤、汗出悪風は桂枝湯。","level":3},
{"cat":"鑑別・使い分け","sub":"使い分け","type":"tf","q":"麻杏甘石湯や越婢加朮湯は「汗が出ている」状態にも用いられる麻黄剤である。","choices":["正しい","誤り"],"answer":[0],"exp":"麻黄に石膏を組み合わせると、発汗作用が抑えられ、清熱・止咳・利水の方向に働く。そのため汗の出ている者にも用いる。","level":2},
{"cat":"鑑別・使い分け","sub":"使い分け","type":"tf","q":"桂枝湯は無汗、麻黄湯は自汗のかぜに用いる。","choices":["正しい","誤り"],"answer":[1],"exp":"逆。桂枝湯＝自汗（虚証）、麻黄湯＝無汗（実証）。","level":1},
{"cat":"鑑別・使い分け","sub":"使い分け","type":"tf","q":"葛根湯加川芎辛夷は、日本で作られた「本朝経験方」に由来する処方である。","choices":["正しい","誤り"],"answer":[0],"exp":"葛根湯加川芎辛夷は『傷寒論』ではなく本朝経験方。葛根湯・麻黄湯・小青竜湯・麻黄附子細辛湯・麻杏甘石湯は『傷寒論』、越婢加朮湯・麻杏薏甘湯は『金匱要略』。","level":3},
{"cat":"鑑別・使い分け","sub":"使い分け","type":"single","q":"次の麻黄剤のうち、出典が『金匱要略』であるものはどれか。","choices":["葛根湯","麻黄湯","麻杏薏甘湯","小青竜湯","麻杏甘石湯"],"answer":[2],"exp":"越婢加朮湯・麻杏薏甘湯は『金匱要略』。他は『傷寒論』。","level":3},
{"cat":"鑑別・使い分け","sub":"適応","type":"multi","q":"小青竜湯（ツムラ）の効能・効果に含まれるものを（すべて選べ）","choices":["気管支喘息","アレルギー性鼻炎","感冒","蓄膿症","いぼ"],"answer":[0,1,2],"exp":"小青竜湯：水様の痰・水様鼻汁・鼻閉・くしゃみ・喘鳴・咳嗽・流涙があるものの気管支炎、気管支喘息、鼻炎、アレルギー性鼻炎、アレルギー性結膜炎、感冒。蓄膿症は葛根湯加川芎辛夷。","level":2},
{"cat":"鑑別・使い分け","sub":"適応","type":"single","q":"麻黄剤による治療で基本となる治法（太陽病の治法）はどれか。","choices":["発汗（汗法）","和解","瀉下（下法）","温補","駆瘀血"],"answer":[0],"exp":"太陽病＝表に邪→発汗で邪を追い出す（汗法）。少陽病＝和解（柴胡剤）、陽明病＝瀉下。","level":1},
{"cat":"鑑別・使い分け","sub":"適応","type":"tf","q":"葛根湯などの麻黄剤は、かぜの初期に服用し、発汗して症状が改善したら漫然と続けず中止するのが原則である。","choices":["正しい","誤り"],"answer":[0],"exp":"麻黄剤は発汗させる処方。汗が出て解熱したら中止。過度の発汗は体力を消耗させる。","level":1},
{"cat":"生薬","sub":"生薬","type":"single","q":"麻黄の薬用部位として正しいのはどれか。","choices":["根","地上茎","種子","葉","樹皮"],"answer":[1],"exp":"麻黄＝マオウ科 Ephedra sinica などの地上茎。なお麻黄の根（麻黄根）は止汗に用いられ、作用が逆。","level":1},
{"cat":"生薬","sub":"生薬","type":"single","q":"麻黄の基原植物が属する科はどれか。","choices":["マメ科","セリ科","マオウ科","シソ科","バラ科"],"answer":[2],"exp":"麻黄＝マオウ科。甘草・葛根はマメ科、柴胡はセリ科、黄芩はシソ科、杏仁はバラ科。","level":1},
{"cat":"生薬","sub":"生薬","type":"input","q":"麻黄の主要アルカロイドで、交感神経刺激作用を示す成分は何か（カタカナで）。","choices":[],"answer":["エフェドリン","えふぇどりん","ephedrine","l-エフェドリン"],"exp":"麻黄の主成分＝エフェドリン（ほかにプソイドエフェドリンなど）。1885年に長井長義が単離。","level":1},
{"cat":"生薬","sub":"生薬","type":"multi","q":"麻黄に含まれる成分を（すべて選べ）","choices":["エフェドリン","プソイドエフェドリン","グリチルリチン","アミグダリン","バイカリン"],"answer":[0,1],"exp":"エフェドリン・プソイドエフェドリンはエフェドリン系アルカロイド。グリチルリチン＝甘草、アミグダリン＝杏仁、バイカリン＝黄芩。","level":1},
{"cat":"生薬","sub":"生薬","type":"multi","q":"麻黄の主な薬効を（すべて選べ）","choices":["発汗","鎮咳（平喘）","利水","瀉下","補血"],"answer":[0,1,2],"exp":"麻黄の三作用：発汗（解表）・鎮咳平喘・利水。瀉下は大黄、補血は当帰・地黄など。","level":1},
{"cat":"副作用・注意","sub":"副作用・注意","type":"multi","q":"麻黄（エフェドリン）の交感神経刺激作用による副作用として考えられるものを（すべて選べ）","choices":["動悸・頻脈","血圧上昇","不眠","排尿障害","血圧低下"],"answer":[0,1,2,3],"exp":"麻黄の副作用：動悸・頻脈・血圧上昇・不眠・発汗過多・精神興奮・排尿障害・食欲不振や胃部不快感など。血圧は上がる方向。","level":1},
{"cat":"副作用・注意","sub":"副作用・注意","type":"multi","q":"麻黄を含む製剤の投与に注意が必要な患者を（すべて選べ）","choices":["高齢者・著しく体力の衰えている患者","狭心症・心筋梗塞など循環器系障害のある患者","重症高血圧の患者","前立腺肥大などによる排尿障害のある患者","甲状腺機能亢進症の患者"],"answer":[0,1,2,3,4],"exp":"すべて該当。麻黄含有製剤の添付文書で注意すべき患者として、病後の衰弱期・著しく体力の衰えた患者、胃腸の虚弱な患者、発汗傾向の著しい患者、循環器系障害、重症高血圧、高度の腎障害、排尿障害、甲状腺機能亢進症などが挙げられる。","level":2},

{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"32歳男性。体格がよく胃腸も丈夫。昨日の夕方から悪寒がして38.2℃の発熱と頭痛が出現した。首筋から肩・背中にかけてこわばって痛い。汗は出ていない。脈は浮緊。この患者に適した漢方薬はどれか。","choices":["小青竜湯","麻杏甘石湯","桂枝湯","麻黄附子細辛湯","葛根湯"],"answer":[4],"exp":"無汗＋項背部のこわばり（項背強）のかぜ初期＝葛根湯（太陽病・実証）。桂枝湯は自汗・脈浮弱の虚証、麻黄附子細辛湯は高齢者などの悪寒・微熱・倦怠・脈沈細、小青竜湯は水様の鼻汁・痰、麻杏甘石湯は咳・口渇・自汗が目標。","level":1},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"25歳女性。小柄で疲れやすく体力はない。昨日からさむけ（風にあたるとゾクッとする）と37.5℃の微熱、頭痛がある。肌はしっとりと汗ばんでいる。脈は浮弱。この患者に適した漢方薬はどれか。","choices":["小青竜湯","麻黄湯","桂枝湯","麻黄附子細辛湯","葛根湯"],"answer":[2],"exp":"体力虚弱・自汗（自然に汗が出る）・脈浮弱＝太陽病の虚証＝桂枝湯。葛根湯・麻黄湯は無汗・脈浮緊の実証用で、自汗のある虚証に使うと過度の発汗を招く。麻黄附子細辛湯は脈沈細で熱感に乏しい少陰病、小青竜湯は水様の鼻汁・痰が目標。","level":1},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"40歳男性。筋肉質で体力は充実している。インフルエンザ迅速検査陽性（発症から半日）。強い悪寒、39.8℃の高熱、頭痛のほか、全身の関節の痛みと腰痛が強い。汗は全く出ていない。脈は浮緊。この患者に適した漢方薬はどれか。","choices":["葛根湯","桂枝湯","麻黄湯","麻杏甘石湯","麻黄附子細辛湯"],"answer":[2],"exp":"無汗・脈浮緊＋関節痛・腰痛（身体の節々の痛み）＝麻黄湯。効能「悪寒、発熱、頭痛、腰痛、自然に汗の出ないものの感冒、インフルエンザ（初期のもの）」。葛根湯は項背のこわばりが目標、桂枝湯は自汗・脈浮弱、麻黄附子細辛湯は虚証の少陰病、麻杏甘石湯は咳・口渇・自汗。","level":1},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"8歳男児。ふだんは元気で活発。今朝から急に寒気を訴え、39℃の発熱、頭痛、手足の節々の痛みがある。インフルエンザと診断された。汗はかいておらず、皮膚は乾いて熱い。この患者に適した漢方薬はどれか。","choices":["麻杏甘石湯","麻黄湯","桂枝湯","葛根湯加川芎辛夷","小青竜湯"],"answer":[1],"exp":"体力のある者のインフルエンザ初期、悪寒・高熱・節々の痛み・無汗＝麻黄湯（小児にも用いられる）。桂枝湯は自汗の虚証、麻杏甘石湯は咳・口渇・発汗、小青竜湯は水様鼻汁・痰、葛根湯加川芎辛夷は鼻閉・副鼻腔炎。","level":2},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"生後2か月の乳児。かぜをひいて鼻がつまり、母乳をうまく飲めない（哺乳困難）。添付文書の効能・効果に「乳児の鼻閉塞、哺乳困難」が記載されている処方として、この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","葛根湯","麻黄湯","小青竜湯","葛根湯加川芎辛夷"],"answer":[2],"exp":"麻黄湯（ツムラ27）の効能：感冒、インフルエンザ（初期）、関節リウマチ、喘息、乳児の鼻閉塞、哺乳困難。鼻閉＝葛根湯加川芎辛夷と短絡しないこと（こちらは鼻づまり・蓄膿症・慢性鼻炎）。","level":2},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"28歳女性。体力は中等度以上。今朝からかぜのひき始めで、背中がゾクゾクし、後頭部から首・肩にかけてこわばる。発熱は37.8℃。汗はかいていない。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","越婢加朮湯","葛根湯","麻杏甘石湯","桂枝湯"],"answer":[2],"exp":"かぜの初期・無汗・項背部のこわばり＝葛根湯。桂枝湯は自汗のある虚証、麻黄附子細辛湯は高齢者・虚弱者の悪寒・微熱・倦怠（脈沈細）、麻杏甘石湯は咳・口渇・自汗、越婢加朮湯は浮腫・関節腫脹。","level":1},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"45歳男性。体力があり胃腸も丈夫。デスクワークで慢性的に首筋から肩がこる。汗はかきにくい。かぜではない。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","葛根湯","越婢加朮湯","薏苡仁湯","麻杏薏甘湯"],"answer":[1],"exp":"葛根湯の効能には感冒だけでなく「肩こり、上半身の神経痛、じんましん」も含まれる。葛根が項背部のこわばりを緩める。麻杏薏甘湯・薏苡仁湯は関節痛・筋肉痛、越婢加朮湯は浮腫と関節の腫脹熱感、麻黄附子細辛湯は虚証の感冒。","level":2},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"30歳女性。授乳中で産後3週間。片側の乳房が赤く張って痛み、悪寒・発熱・頭痛がある。汗は出ていない。体力はある。発症の初期である。この患者に適した漢方薬はどれか。","choices":["麻杏薏甘湯","麻黄附子細辛湯","葛根湯","桂枝湯","小青竜湯"],"answer":[2],"exp":"葛根湯の効能には炎症性疾患（結膜炎・角膜炎・中耳炎・扁桃腺炎・乳腺炎・リンパ腺炎）の初期が含まれる。悪寒・発熱・無汗の実証で初期なら葛根湯。桂枝湯は自汗の虚証、麻黄附子細辛湯は虚証の少陰病。","level":2},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"24歳男性。体力は充実。2日前から扁桃が腫れ、悪寒・発熱・頭痛があり首筋がこわばる。汗はかいていない。初期の段階である。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","葛根湯","麻杏甘石湯","小青竜湯","越婢加朮湯"],"answer":[1],"exp":"葛根湯の効能に「扁桃腺炎」など炎症性疾患の初期を含む。無汗・項背強・悪寒発熱の太陽病実証。麻黄附子細辛湯ものどの痛みに使われるが、それは高齢・虚弱で悪寒が強く熱感に乏しい（脈沈細）場合。","level":2},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"62歳女性。もともと胃腸が弱く、以前かぜ薬（麻黄を含む）で動悸と胃のむかつきが出たことがある。かぜをひき、軽い悪寒と微熱、頭痛があり、じわじわと汗をかいている。脈は浮弱。この患者に適した漢方薬はどれか。","choices":["越婢加朮湯","麻杏甘石湯","葛根湯","麻黄湯","桂枝湯"],"answer":[4],"exp":"自汗・脈浮弱の虚証で、麻黄に弱い（動悸・胃症状）患者＝麻黄を含まない桂枝湯。麻黄湯・葛根湯は無汗の実証用で、麻黄の副作用も懸念。麻杏甘石湯・越婢加朮湯も麻黄を含み、それぞれ咳・口渇、浮腫・関節腫脹が目標。","level":2},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"35歳男性。体力中等度以上。かぜの初期で悪寒・発熱・頭痛があり、汗は出ていない。首や肩のこわばりは特にないが、全身の節々が痛み、腰も痛い。脈は浮緊。この患者に適した漢方薬はどれか。","choices":["桂枝湯","麻黄湯","葛根湯","麻杏薏甘湯","葛根湯加川芎辛夷"],"answer":[1],"exp":"同じ無汗の太陽病実証でも、項背強→葛根湯、身体痛・腰痛・関節痛→麻黄湯。桂枝湯は自汗・脈浮弱、葛根湯加川芎辛夷は鼻閉、麻杏薏甘湯はかぜではない関節痛・筋肉痛（夕方増悪）。","level":2},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"38歳男性。体力充実。かぜの2日目。悪寒・発熱・頭痛があり汗は出ていない。脈は浮緊で力がある。咳が出て少しゼーゼーするが、痰はほとんどなく、口渇もない。この患者に適した漢方薬はどれか。","choices":["桂枝湯","麻杏甘石湯","小青竜湯","麻黄附子細辛湯","麻黄湯"],"answer":[4],"exp":"無汗・脈浮緊の表寒実証＋咳・喘鳴＝麻黄湯（麻黄＋杏仁で鎮咳平喘、効能に喘息を含む）。麻杏甘石湯は汗が出て口渇のある咳（石膏で清熱）、小青竜湯は水様の痰・鼻汁、桂枝湯は自汗、麻黄附子細辛湯は脈沈細の虚証。","level":3},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"体力虚弱な40歳女性。かぜをひき、悪風・発熱・頭痛があるが、じわっと自然に汗が出ている。項背のこわばりはない。脈は浮弱。この患者に適した漢方薬はどれか。","choices":["葛根湯","小青竜湯","麻杏薏甘湯","桂枝湯","麻黄湯"],"answer":[3],"exp":"自汗・脈浮弱＝太陽病中風＝桂枝湯。麻黄湯・葛根湯は無汗・脈浮緊の実証。麻杏薏甘湯は関節痛・筋肉痛、小青竜湯は水様鼻汁・痰。","level":1},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"27歳男性。陸上競技の選手で、来週ドーピング検査のある大会を控えている。かぜのひき始めで、悪風と微熱、頭痛があり、自然に少し汗をかいている。脈は浮弱。この患者に適した漢方薬はどれか。","choices":["麻黄湯","桂枝湯","葛根湯","麻杏甘石湯","小青竜湯"],"answer":[1],"exp":"自汗・脈浮弱＝桂枝湯の証。しかも麻黄を含まないためエフェドリンによるドーピング陽性の心配もない。葛根湯・麻黄湯・小青竜湯・麻杏甘石湯はいずれも麻黄（エフェドリン類＝競技会時禁止の興奮薬）を含む。","level":2},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"50歳男性。体力中等度以上。かぜの初期で悪寒・発熱・頭痛・無汗があり、首筋がこわばる。くしゃみや水様の鼻汁はなく、咳もない。過去に葛根湯でよくなった経験がある。この患者に適した漢方薬はどれか。","choices":["五虎湯","麻黄附子細辛湯","麻杏甘石湯","葛根湯","小青竜湯"],"answer":[3],"exp":"無汗・項背強の太陽病実証＝葛根湯。小青竜湯は水様鼻汁・痰、麻杏甘石湯・五虎湯は咳（石膏で清熱）、麻黄附子細辛湯は脈沈細・倦怠の少陰病。","level":3},
{"cat":"症例","sub":"かぜ初期（桂枝湯・葛根湯・麻黄湯）","type":"single","q":"33歳女性。体力中等度。かぜをひいて発熱・頭痛・悪風があり、汗ばんでいる。脈は浮で弱い。夫が「かぜには葛根湯」と言って葛根湯を飲ませようとしている。より適した漢方薬はどれか。","choices":["桂枝湯","小青竜湯","葛根湯","葛根湯加川芎辛夷","麻黄湯"],"answer":[0],"exp":"「かぜ＝葛根湯」ではない。自汗・脈浮弱なら桂枝湯。葛根湯・麻黄湯は無汗の実証で、自汗のある者に用いると発汗過多（汗法の禁）となる。","level":3},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"30歳女性。毎年2〜4月になると、くしゃみが連発し、水のような鼻汁が止まらず、目がかゆく涙が出る（スギ花粉症）。体力は中等度。この患者に適した漢方薬はどれか。","choices":["葛根湯","麻杏甘石湯","麻黄附子細辛湯","小青竜湯","葛根湯加川芎辛夷"],"answer":[3],"exp":"くしゃみ・水様性鼻汁・流涙＝小青竜湯（アレルギー性鼻炎・花粉症の代表）。葛根湯加川芎辛夷は鼻閉・副鼻腔炎、麻黄附子細辛湯は高齢者・冷え・倦怠・脈沈細、麻杏甘石湯は咳・口渇・自汗、葛根湯は項背強のかぜ。","level":1},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"45歳男性。慢性副鼻腔炎（蓄膿症）。鼻づまりが続き、黄色く粘った鼻汁が喉に落ちる（後鼻漏）。前頭部が重い。この患者に適した漢方薬はどれか。","choices":["葛根湯加川芎辛夷","麻黄附子細辛湯","麻黄湯","小青竜湯","五虎湯"],"answer":[0],"exp":"鼻閉・蓄膿症（副鼻腔炎）・慢性鼻炎＝葛根湯加川芎辛夷。辛夷が鼻閉を通じ、川芎が頭痛・頭重を除く。小青竜湯は水様鼻汁、麻黄附子細辛湯は冷え・倦怠の高齢者のかぜ、麻黄湯はかぜ・インフルエンザ初期、五虎湯は咳。","level":1},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"80歳女性。かぜをひいた。ゾクゾクとした寒気が強いが、体温は37.1℃程度。全身がだるくて横になっていたい。手足が冷たい。脈は沈細。この患者に適した漢方薬はどれか。","choices":["葛根湯","桂枝湯","麻杏甘石湯","麻黄附子細辛湯","麻黄湯"],"answer":[3],"exp":"高齢者の悪寒・微熱・全身倦怠・手足の冷え・脈沈細＝少陰病＝麻黄附子細辛湯（附子・細辛で温め、麻黄で表を開く）。麻黄湯・葛根湯は脈浮緊の実証、麻杏甘石湯は咳・口渇、桂枝湯は脈浮弱で自汗のある太陽病。","level":1},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"70歳男性。もともと低血圧で、かぜをひくと頭痛やめまいが出る。今回も微熱と悪寒、全身倦怠感があり、手足が冷えて痛む。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","越婢加朮湯","麻杏薏甘湯","麻黄湯","葛根湯"],"answer":[0],"exp":"麻黄附子細辛湯の効能：「悪寒、微熱、全身倦怠、低血圧で頭痛、めまいあり、四肢に疼痛冷感あるものの感冒、気管支炎」。葛根湯・麻黄湯は体力のある者の太陽病、越婢加朮湯は浮腫・関節腫脹熱感、麻杏薏甘湯は関節痛・筋肉痛。","level":2},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"74歳女性。冷え症で体力は低下している。冬になるとかぜをひきやすく、今回も発熱は軽いのに寒気と全身倦怠感が強い。のどにチクチクとした痛みがある。この患者に適した漢方薬はどれか。","choices":["葛根湯加川芎辛夷","麻黄附子細辛湯","葛根湯","麻杏甘石湯","小青竜湯"],"answer":[1],"exp":"熱感に乏しく悪寒・倦怠・冷えが強い、のどのチクチクした痛み＝麻黄附子細辛湯（少陰病のかぜ）。葛根湯加川芎辛夷は鼻閉、小青竜湯は水様鼻汁・痰、麻杏甘石湯は口渇・自汗の咳、葛根湯は体力のある者の無汗・項背強。","level":2},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"10歳女児。かぜが治った後も鼻づまりが続き、口で呼吸している。においがわかりにくく、鼻汁は粘って少ない。頭が重いという。この患者に適した漢方薬はどれか。","choices":["小青竜湯","麻杏甘石湯","麻黄附子細辛湯","葛根湯加川芎辛夷","麻黄湯"],"answer":[3],"exp":"鼻汁は少なく鼻閉が主体・頭重＝葛根湯加川芎辛夷。水様の鼻汁が多量なら小青竜湯。麻黄湯の鼻閉塞は乳児の哺乳困難、麻杏甘石湯は咳、麻黄附子細辛湯は冷え・倦怠の虚証のかぜ。","level":2},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"35歳男性。通年性アレルギー性鼻炎。くしゃみ・水様鼻汁に加え、薄くて泡のような痰を伴う咳が出る。口渇はない。この患者に適した漢方薬はどれか。","choices":["小青竜湯","神秘湯","麻杏甘石湯","越婢加朮湯","葛根湯加川芎辛夷"],"answer":[0],"exp":"水様の鼻汁・薄い（泡沫状の）痰＝水毒（心下有水気）＝小青竜湯。麻杏甘石湯は口渇・自汗で粘い痰、葛根湯加川芎辛夷は鼻閉・副鼻腔炎、越婢加朮湯は浮腫・関節腫脹、神秘湯は痰の少ない呼吸困難・抑うつ傾向。","level":1},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"27歳女性。春先になると目がかゆく涙が止まらず（アレルギー性結膜炎）、くしゃみと水っぽい鼻水も出る。この患者に適した漢方薬はどれか。","choices":["小青竜湯","葛根湯加川芎辛夷","五虎湯","麻黄附子細辛湯","麻杏薏甘湯"],"answer":[0],"exp":"小青竜湯の効能：水様の痰・水様鼻汁・鼻閉・くしゃみ・喘鳴・咳嗽・流涙があるものの気管支炎、気管支喘息、鼻炎、アレルギー性鼻炎、アレルギー性結膜炎、感冒。","level":2},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"52歳女性。体力中等度。かぜをひいて背中がゾクゾクし、透明な鼻水がだらだら出る。咳とともに薄い水様の痰が出る。口渇はない。この患者に適した漢方薬はどれか。","choices":["越婢加朮湯","葛根湯加川芎辛夷","麻杏薏甘湯","小青竜湯","麻杏甘石湯"],"answer":[3],"exp":"表証（ゾクゾク）＋水様鼻汁・薄い痰＝小青竜湯。麻杏甘石湯は口渇・自汗の咳、麻杏薏甘湯は関節痛・筋肉痛、越婢加朮湯は浮腫・関節腫脹、葛根湯加川芎辛夷は鼻閉・副鼻腔炎。","level":1},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"40歳男性。アレルギー性鼻炎で小青竜湯を服用してきたが、最近は鼻水よりも鼻づまりが主体となり、副鼻腔炎を合併して頭が重い。この患者に適した漢方薬はどれか。","choices":["小青竜湯","葛根湯加川芎辛夷","麻杏甘石湯","越婢加朮湯","麻黄附子細辛湯"],"answer":[1],"exp":"水様鼻汁中心→小青竜湯、鼻閉・副鼻腔炎中心→葛根湯加川芎辛夷と使い分ける。","level":2},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"76歳男性。気管支炎。微熱と悪寒があり、全身がだるい。痰は少ない。寒がりで手足が冷えている。脈は沈んで細い。この患者に適した漢方薬はどれか。","choices":["麻杏甘石湯","麻黄湯","麻黄附子細辛湯","葛根湯","五虎湯"],"answer":[2],"exp":"麻黄附子細辛湯の効能は感冒・気管支炎（悪寒・微熱・全身倦怠・四肢の冷え）。脈沈細＝少陰病。麻杏甘石湯・五虎湯は熱感・口渇のある咳、麻黄湯・葛根湯は脈浮緊の実証。","level":2},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"66歳女性。体力がない。かぜのひき始めで、熱はほとんどないが背中がゾクゾクと冷え、とにかく寝ていたい。のどが少しチクチクする。脈は沈細。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","葛根湯","桂枝湯","麻杏甘石湯","小青竜湯"],"answer":[0],"exp":"「但欲寐（ただ寝んと欲す）」・脈沈細＝少陰病＝麻黄附子細辛湯。桂枝湯は脈浮弱・自汗の太陽病中風で、脈は浮。葛根湯は脈浮緊の実証、小青竜湯は水様鼻汁・痰、麻杏甘石湯は口渇・自汗の咳。","level":2},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"72歳女性。冷え症で疲れやすい。数年前からくしゃみと水様の鼻汁が続く（アレルギー性鼻炎）。寒がりで顔色が悪く、倦怠感が強い。脈は沈細。体力中等度の者に用いる小青竜湯では効果が乏しかった。この患者に適した漢方薬はどれか。","choices":["越婢加朮湯","麻杏甘石湯","麻黄附子細辛湯","麻黄湯","葛根湯加川芎辛夷"],"answer":[2],"exp":"鼻炎症状でも、高齢・冷え・倦怠・脈沈細という少陰病の体質なら、附子・細辛で温める麻黄附子細辛湯が臨床的に用いられる（効能・効果の記載は感冒・気管支炎）。葛根湯加川芎辛夷は鼻閉・副鼻腔炎、麻黄湯は実証、越婢加朮湯・麻杏甘石湯は石膏で冷やす処方で冷え症には不向き。","level":3},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"4歳男児。かぜをひいてくしゃみと水っぽい鼻水が止まらず、咳とともにゼロゼロした薄い痰が出る。熱は高くなく、口渇もない。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","神秘湯","麻杏甘石湯","小青竜湯","葛根湯加川芎辛夷"],"answer":[3],"exp":"水様の鼻汁・薄い痰・くしゃみ＝小青竜湯。麻杏甘石湯は口渇・発汗のある咳、神秘湯は痰の少ない呼吸困難・抑うつ傾向、葛根湯加川芎辛夷は鼻閉、麻黄附子細辛湯は高齢者などの冷え・倦怠。","level":2},
{"cat":"症例","sub":"鼻症状・寒証（小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷）","type":"single","q":"42歳女性。慢性鼻炎で鼻閉が強く、夜は口を開けて寝ている。鼻汁は少ない。頭痛を伴う。この患者に適した漢方薬はどれか。","choices":["麻杏薏甘湯","小青竜湯","葛根湯加川芎辛夷","麻黄附子細辛湯","神秘湯"],"answer":[2],"exp":"鼻閉が主体の慢性鼻炎・頭痛＝葛根湯加川芎辛夷（辛夷：鼻閉、川芎：頭痛）。小青竜湯は水様鼻汁、麻黄附子細辛湯は冷え・倦怠の虚証のかぜ、神秘湯は喘息・気管支炎、麻杏薏甘湯は関節痛・筋肉痛。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"6歳男児。小児喘息。発作時には激しく咳き込み、顔が赤く汗をかいて、しきりに水を欲しがる。この患者に適した漢方薬はどれか。","choices":["葛根湯","麻黄附子細辛湯","麻杏甘石湯","小青竜湯","麻黄湯"],"answer":[2],"exp":"咳が強く口渇・自汗のある小児喘息＝麻杏甘石湯（効能：小児ぜんそく、気管支ぜんそく）。石膏が熱を冷まし口渇を止め、麻黄と組んで発汗を抑える。小青竜湯は水様の痰、麻黄附子細辛湯は冷え・倦怠、葛根湯・麻黄湯は無汗の太陽病。","level":1},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"50歳男性。気管支喘息。咳が激しく、痰は粘って切れにくい。口が渇き、汗をかきやすい。この患者に適した漢方薬はどれか。","choices":["五虎湯","葛根湯加川芎辛夷","小青竜湯","麻黄附子細辛湯","神秘湯"],"answer":[0],"exp":"五虎湯＝麻杏甘石湯＋桑白皮。効能「せき、気管支ぜんそく」。石膏で清熱し、桑白皮が鎮咳・去痰を強める。熱感・口渇・粘い痰の咳に。小青竜湯は水様の痰、神秘湯は痰の少ない呼吸困難・抑うつ傾向、麻黄附子細辛湯は冷え・倦怠、葛根湯加川芎辛夷は鼻閉。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"9歳男児。小児喘息。息苦しさ（呼吸困難）が主で、痰はあまり出ない。口渇や発汗は目立たない。神経質で、学校のことで落ち込むと発作が起きやすい。この患者に適した漢方薬はどれか。","choices":["小青竜湯","神秘湯","麻黄湯","麻杏甘石湯","麻黄附子細辛湯"],"answer":[1],"exp":"痰の少ない呼吸困難＋抑うつ傾向（気うつ）＝神秘湯。柴胡・厚朴・蘇葉・陳皮が気の巡りを改善する。効能：小児ぜんそく、気管支ぜんそく、気管支炎。小青竜湯は水様の痰、麻杏甘石湯は口渇・自汗、麻黄附子細辛湯は冷え・倦怠、麻黄湯はかぜ・インフルエンザ初期。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"45歳女性。気管支喘息。呼吸が苦しいが痰は少ない。気分がふさぎがちで不安感が強く、ストレスで症状が悪化する。この患者に適した漢方薬はどれか。","choices":["小青竜湯","神秘湯","五虎湯","麻杏薏甘湯","越婢加朮湯"],"answer":[1],"exp":"呼吸困難＋抑うつ・不安＝神秘湯（柴胡・厚朴・蘇葉で気を巡らす）。小青竜湯は水様の痰・鼻汁、五虎湯は口渇・熱感のある咳、越婢加朮湯は浮腫・関節腫脹、麻杏薏甘湯は関節痛・筋肉痛。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"30歳男性。かぜの後、咳が続いている。黄色く粘った痰が出て、のどが渇き、汗をかきやすい。悪寒はない。この患者に適した漢方薬はどれか。","choices":["麻杏甘石湯","葛根湯","麻黄附子細辛湯","小青竜湯","神秘湯"],"answer":[0],"exp":"熱感・口渇・自汗・粘稠な痰の咳＝麻杏甘石湯（石膏で清熱）。小青竜湯は薄い水様の痰（寒）、麻黄附子細辛湯は冷え・倦怠、神秘湯は痰の少ない呼吸困難・抑うつ、葛根湯は悪寒・無汗のかぜ初期。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"60歳男性。気管支喘息。冷えると悪化し、薄くて泡の多い水様の痰がたくさん出る。喘鳴があり、鼻水も多い。口渇はない。この患者に適した漢方薬はどれか。","choices":["小青竜湯","神秘湯","五虎湯","麻杏甘石湯","越婢加朮湯"],"answer":[0],"exp":"水様・泡沫状の痰が多い喘息＝小青竜湯（乾姜・細辛・五味子・半夏で水毒を温めてさばく）。麻杏甘石湯・五虎湯は熱・口渇のある咳（石膏）、神秘湯は痰の少ない呼吸困難、越婢加朮湯は浮腫・関節腫脹。","level":1},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"12歳女児。気管支炎の後、息苦しさとゼーゼーが続く。痰はほとんどない。母親によると、ストレスを感じると症状が悪化し、最近ふさぎこんでいる。この患者に適した漢方薬はどれか。","choices":["麻杏甘石湯","葛根湯","小青竜湯","麻黄附子細辛湯","神秘湯"],"answer":[4],"exp":"気管支炎・喘息で呼吸困難、痰が少ない、抑うつ傾向＝神秘湯。麻杏甘石湯は口渇・自汗、小青竜湯は水様の痰、葛根湯は無汗・項背強のかぜ、麻黄附子細辛湯は冷え・倦怠。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"5歳女児。喘息発作で咳が止まらず、ゼーゼーいう。顔が赤く、汗をかいていて、のどが渇いたと言って水をよく飲む。この患者に適した漢方薬はどれか。","choices":["麻杏甘石湯","葛根湯加川芎辛夷","小青竜湯","神秘湯","麻黄附子細辛湯"],"answer":[0],"exp":"熱感・発汗・口渇を伴う咳嗽・喘鳴＝麻杏甘石湯。『傷寒論』「汗出でて喘し、大熱なき者」。小青竜湯は水様の痰、神秘湯は痰の少ない呼吸困難・抑うつ、麻黄附子細辛湯は冷え、葛根湯加川芎辛夷は鼻閉。","level":1},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"38歳女性。咳がひどく、気管支喘息と診断されている。口渇と発汗があり、痰は粘って切れにくい。医師は「麻杏甘石湯に桑白皮を加えた処方」を選んだ。この患者に適した漢方薬はどれか。","choices":["神秘湯","越婢加朮湯","小青竜湯","麻黄附子細辛湯","五虎湯"],"answer":[4],"exp":"麻杏甘石湯（麻黄・杏仁・甘草・石膏）＋桑白皮＝五虎湯。せき、気管支ぜんそくに用いる。神秘湯は柴胡・厚朴・蘇葉などを含み抑うつ傾向の呼吸困難に。越婢加朮湯も石膏を含むが浮腫・関節腫脹が目標。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"55歳男性。気管支喘息。痰は少なく、呼吸困難が主訴。体力は中等度。仕事のストレスで気分が落ち込み、胸がつかえる感じがある。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","神秘湯","麻杏薏甘湯","五虎湯","小青竜湯"],"answer":[1],"exp":"痰の少ない呼吸困難＋抑うつ（気うつ）＝神秘湯。五虎湯は熱・口渇のある咳、小青竜湯は水様痰、麻黄附子細辛湯は冷え・倦怠、麻杏薏甘湯は関節痛・筋肉痛。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"7歳男児。小児喘息で発作を繰り返す。発作時は咳き込みが強く、汗をかき口渇がある。痰は黄色く粘る。水様の鼻水やくしゃみはない。この患者に適した漢方薬はどれか。","choices":["麻杏甘石湯","葛根湯加川芎辛夷","麻黄附子細辛湯","小青竜湯","麻黄湯"],"answer":[0],"exp":"小児喘息・口渇・自汗・粘稠痰＝麻杏甘石湯。小青竜湯は水様の痰・鼻汁・くしゃみで口渇なし。麻黄湯は無汗の表寒実証。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"8歳女児。気管支喘息。咳込みとともに薄く水っぽい痰が多量に出る。くしゃみと鼻水も多い。顔色は白っぽく、口渇はなく汗もかいていない。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","五虎湯","神秘湯","麻杏甘石湯","小青竜湯"],"answer":[4],"exp":"同じ小児の喘息でも、水様の痰・鼻汁・口渇なし（寒・水毒）→小青竜湯、口渇・自汗・粘い痰（熱）→麻杏甘石湯／五虎湯、痰少なく呼吸困難・抑うつ→神秘湯。","level":3},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"48歳男性。かぜをこじらせてから咳が1週間続く。咳込むと顔が赤くなり、口が渇いて冷たい水を飲みたがる。汗ばんでいる。痰は少量で粘る。医師は咳止めとして、効能に「せき」と記載のある処方を選んだ。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","小青竜湯","薏苡仁湯","葛根湯","五虎湯"],"answer":[4],"exp":"五虎湯の効能は「せき、気管支ぜんそく」。麻杏甘石湯に桑白皮を加え鎮咳を強化。熱感・口渇・自汗の咳。小青竜湯は水様の痰、麻黄附子細辛湯は冷え、葛根湯は悪寒無汗の初期、薏苡仁湯は関節痛。","level":3},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"35歳男性。感冒の初期を過ぎ、悪寒はなくなったが咳と喘鳴が強い。汗が出ていてのどが渇く。体温は37.4℃。この患者に適した漢方薬はどれか。","choices":["桂枝湯","麻黄附子細辛湯","麻杏甘石湯","麻黄湯","葛根湯"],"answer":[2],"exp":"悪寒がなく（表寒は去り）、汗が出て喘ぎ・口渇＝麻杏甘石湯（裏熱を石膏で冷ます）。麻黄湯・葛根湯は悪寒・無汗の表寒実証、麻黄附子細辛湯は冷え・倦怠の少陰病、桂枝湯は悪風・自汗の太陽病虚証で咳は主症状ではない。","level":2},
{"cat":"症例","sub":"咳・喘息（麻杏甘石湯・五虎湯・神秘湯・小青竜湯）","type":"single","q":"62歳女性。喘息様の呼吸困難が続くが、痰はほとんど出ない。体力は中等度。抑うつ傾向で、「胸がつまる感じがして気が晴れない」と訴える。くしゃみ・鼻水はない。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","神秘湯","越婢加朮湯","麻杏甘石湯","小青竜湯"],"answer":[1],"exp":"神秘湯は麻黄・杏仁に柴胡・厚朴・蘇葉・陳皮（気を巡らす生薬）を加えた処方。痰の少ない呼吸困難・抑うつ傾向が目標。","level":3},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"62歳女性。変形性膝関節症。膝が腫れて熱をもち、むくみやすく尿量が少ない。汗をかきやすく、口が渇く。この患者に適した漢方薬はどれか。","choices":["麻杏薏甘湯","越婢加朮湯","葛根湯","麻黄附子細辛湯","薏苡仁湯"],"answer":[1],"exp":"関節の腫脹・熱感＋浮腫・小便不利＋汗・口渇＝越婢加朮湯（麻黄＋石膏で清熱・止汗、蒼朮で利水）。麻杏薏甘湯は腫れ・熱感の乏しい関節痛・筋肉痛（夕方増悪）、薏苡仁湯は亜急性〜慢性の関節痛、麻黄附子細辛湯は冷え、葛根湯は肩こり・かぜ。","level":1},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"30歳男性。週末に慣れない運動をした翌日から全身の筋肉が痛み、特に夕方になると痛みが強くなる。関節の腫れや熱感、むくみはない。この患者に適した漢方薬はどれか。","choices":["越婢加朮湯","麻黄附子細辛湯","薏苡仁湯","麻杏薏甘湯","麻黄湯"],"answer":[3],"exp":"比較的急性の筋肉痛・関節痛で夕方（日晡所）に増悪＝麻杏薏甘湯。越婢加朮湯は腫脹・熱感・浮腫、薏苡仁湯は亜急性〜慢性、麻黄附子細辛湯は冷え・倦怠のかぜ、麻黄湯はかぜ・インフルエンザ初期の関節痛（悪寒・発熱・無汗を伴う）。","level":1},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"52歳女性。数か月前から両膝と手指の関節痛が続いている。関節の腫れは軽度で熱感は強くない。体力は中等度で胃腸は丈夫。急性期は過ぎ、痛みが長引いている。この患者に適した漢方薬はどれか。","choices":["越婢加朮湯","葛根湯","薏苡仁湯","麻杏薏甘湯","麻黄附子細辛湯"],"answer":[2],"exp":"亜急性〜慢性に移行した関節痛・筋肉痛＝薏苡仁湯（薏苡仁・蒼朮で湿をさばき、当帰・桂皮・芍薬で血行を改善、麻黄で鎮痛）。越婢加朮湯は腫脹・熱感・浮腫が強い時、麻杏薏甘湯は比較的急性で夕方に増悪。","level":2},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"47歳女性。関節リウマチ。手指や膝の関節が腫れて熱感があり、全身がむくんで尿量が少ない。汗をかきやすく、のどが渇く。この患者に適した漢方薬はどれか。","choices":["薏苡仁湯","麻黄附子細辛湯","越婢加朮湯","葛根湯加川芎辛夷","麻杏薏甘湯"],"answer":[2],"exp":"越婢加朮湯の効能：浮腫と汗が出て小便不利のあるものの腎炎、ネフローゼ、脚気、関節リウマチ、夜尿症、湿疹。腫脹・熱感・浮腫・汗・口渇がそろう。","level":1},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"40歳男性。梅雨の時期に雨にぬれてから、腰や肩の筋肉痛と関節痛が出た。発症して1週間ほどで、痛みは昼より夕方に強くなる。腫れや熱感、浮腫はない。この患者に適した漢方薬はどれか。","choices":["薏苡仁湯","麻杏薏甘湯","小青竜湯","越婢加朮湯","麻黄附子細辛湯"],"answer":[1],"exp":"風湿による身体疼痛で夕方（日晡所）に劇しくなる＝麻杏薏甘湯（『金匱要略』）。発症間もない（比較的急性）点も薏苡仁湯との区別点。越婢加朮湯は腫脹・熱感・浮腫を伴う時。","level":2},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"58歳男性。膝の関節痛が半年ほど続く。腫れや熱感はほとんどなく、胃腸は丈夫で体力は中等度。痛みは長引いているが、冷えで悪化するということもない。この患者に適した漢方薬はどれか。","choices":["薏苡仁湯","麻黄附子細辛湯","五虎湯","麻杏薏甘湯","越婢加朮湯"],"answer":[0],"exp":"慢性化した関節痛（亜急性〜慢性）＝薏苡仁湯。急性期・夕方増悪なら麻杏薏甘湯、腫脹・熱感・浮腫なら越婢加朮湯。","level":2},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"8歳男児。夜尿症がある。顔や足がむくみやすく尿量は少なめ。汗をかきやすく、口渇がある。体力はある。この患者に適した漢方薬はどれか。","choices":["麻杏薏甘湯","越婢加朮湯","麻黄附子細辛湯","葛根湯加川芎辛夷","薏苡仁湯"],"answer":[1],"exp":"越婢加朮湯の効能には夜尿症が含まれる（浮腫と汗が出て小便不利のあるもの）。薏苡仁湯・麻杏薏甘湯は関節痛・筋肉痛、麻黄附子細辛湯は虚証のかぜ、葛根湯加川芎辛夷は鼻閉。","level":2},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"21歳男性。滲出液が多くジュクジュクした湿疹が下肢にあり、患部に熱感と腫れがある。むくみやすく、口渇がある。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","小青竜湯","神秘湯","麻杏薏甘湯","越婢加朮湯"],"answer":[4],"exp":"越婢加朮湯の効能に湿疹を含む。熱感（石膏で清熱）と滲出液・浮腫（蒼朮・麻黄で利水）が目標。","level":2},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"50歳女性。ネフローゼ症候群。顔面や下肢の浮腫が強く、尿量が少ない。汗をかきやすく口渇がある。体力はある。この患者に適した漢方薬はどれか。","choices":["越婢加朮湯","麻黄湯","麻黄附子細辛湯","麻杏薏甘湯","薏苡仁湯"],"answer":[0],"exp":"浮腫と汗が出て小便不利のあるもののネフローゼ・腎炎＝越婢加朮湯。麻黄（越婢加朮湯は麻黄6gで最多）と蒼朮で利水、石膏で清熱・止汗。","level":2},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"36歳女性。2日前から急に腰と背中の筋肉が痛み出した。午後から夕方にかけて痛みが強くなる。汗はあまりかかない。関節の腫れやむくみ、口渇はない。体力は中等度。この患者に適した漢方薬はどれか。","choices":["葛根湯","越婢加朮湯","麻黄湯","薏苡仁湯","麻杏薏甘湯"],"answer":[4],"exp":"急性の筋肉痛・夕方に増悪＝麻杏薏甘湯。麻黄湯・葛根湯の身体痛はかぜ（悪寒・発熱）に伴うもの。越婢加朮湯は腫脹・熱感・浮腫・口渇、薏苡仁湯は慢性期。","level":3},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"65歳女性。関節リウマチで数年来、手指・手首の関節痛とこわばりがある。腫れは軽度で熱感は乏しく、むくみもない。急性増悪期ではない。体力は中等度。この患者に適した漢方薬はどれか。","choices":["薏苡仁湯","麻杏薏甘湯","小青竜湯","麻杏甘石湯","越婢加朮湯"],"answer":[0],"exp":"慢性期・腫脹熱感の乏しい関節痛＝薏苡仁湯。リウマチでも腫脹・熱感・浮腫が強い時期は越婢加朮湯、比較的急性で夕方増悪する痛みは麻杏薏甘湯。","level":3},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"44歳男性。痛風ではない。右膝が急に赤く腫れて熱をもち、触ると痛い。全身がむくんで尿量が減り、汗が多く口渇がある。体力は充実。この患者に適した漢方薬はどれか。","choices":["桂枝湯","越婢加朮湯","麻黄附子細辛湯","麻杏薏甘湯","薏苡仁湯"],"answer":[1],"exp":"関節の発赤・腫脹・熱感（熱）＋浮腫・小便不利（水）＋汗・口渇＝越婢加朮湯。石膏で熱を冷まし、麻黄・蒼朮で水をさばく。","level":3},
{"cat":"症例","sub":"関節痛・浮腫（越婢加朮湯・麻杏薏甘湯・薏苡仁湯）","type":"single","q":"26歳女性。手指にいぼが数個あり、最近は運動後の筋肉痛が長く残り、夕方に痛みが強くなる。関節の腫れやむくみはない。この患者に適した漢方薬はどれか。","choices":["小青竜湯","越婢加朮湯","麻杏薏甘湯","葛根湯加川芎辛夷","麻杏甘石湯"],"answer":[2],"exp":"麻杏薏甘湯（麻黄・杏仁・薏苡仁・甘草）は関節痛・神経痛・筋肉痛に用い、一般用ではいぼ・手足のあれも効能に含む。主薬の薏苡仁（ハトムギの種子）はいぼに用いられる生薬。名前の似た麻杏甘石湯（石膏を含み咳に用いる）と混同しないこと。","level":2},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"34歳男性。体力は充実している。かぜのひき始めで、悪寒・発熱・頭痛・無汗・項背部のこわばりに加えて、鼻づまりがひどい。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","越婢加朮湯","葛根湯加川芎辛夷","小青竜湯","麻杏甘石湯"],"answer":[2],"exp":"葛根湯の証（無汗・項背強）＋鼻閉＝葛根湯加川芎辛夷（葛根湯＋川芎・辛夷）。小青竜湯は水様鼻汁、麻黄附子細辛湯は虚証・脈沈細。","level":2},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"29歳女性。かぜで発熱し、悪寒・頭痛・無汗。脈は浮緊。さらに咳とともに薄い水様の痰が出て、くしゃみ・鼻水も多い。この患者に適した漢方薬はどれか。","choices":["麻杏甘石湯","神秘湯","小青竜湯","麻黄附子細辛湯","越婢加朮湯"],"answer":[2],"exp":"表寒（悪寒・無汗・脈浮）＋水様の痰・鼻汁（心下有水気）＝小青竜湯。麻杏甘石湯・越婢加朮湯は石膏で清熱する処方で口渇・自汗が目標。神秘湯は痰の少ない呼吸困難・抑うつ、麻黄附子細辛湯は脈沈細。","level":2},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"78歳男性。前立腺肥大と高血圧で治療中。かぜをひいて寒気が強いが熱は37.0℃、全身がだるく、脈は沈細。どの麻黄剤も麻黄を含むので注意は必要だが、証として最も適したものはどれか。","choices":["越婢加朮湯","麻杏甘石湯","麻黄湯","麻黄附子細辛湯","葛根湯"],"answer":[3],"exp":"悪寒・微熱・倦怠・脈沈細＝少陰病＝麻黄附子細辛湯。ただし麻黄（エフェドリン）は排尿障害（前立腺肥大）や血圧上昇の原因となるため、高齢者・高血圧・排尿障害のある患者では少量・短期間で慎重に使い、症状の変化を観察する。","level":3},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"20歳女性。花粉症の時期にくしゃみと水様鼻汁があり、昼間の眠気が出にくい薬を希望している。体力中等度。この患者に適した漢方薬はどれか。","choices":["麻杏甘石湯","麻杏薏甘湯","越婢加朮湯","小青竜湯","葛根湯加川芎辛夷"],"answer":[3],"exp":"くしゃみ・水様鼻汁のアレルギー性鼻炎＝小青竜湯。眠気を起こす抗ヒスタミン作用はない（むしろ麻黄で交感神経刺激＝不眠・動悸に注意）。","level":2},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"55歳女性。腎炎があり、顔や足がむくんで尿量が少ない。汗をかきやすく、口渇がある。この患者に適した漢方薬はどれか。","choices":["麻黄湯","葛根湯","越婢加朮湯","麻杏薏甘湯","麻黄附子細辛湯"],"answer":[2],"exp":"浮腫と汗が出て小便不利＝越婢加朮湯（効能：腎炎、ネフローゼなど）。","level":1},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"6歳女児。かぜをひいて2日目。悪寒はなく、咳込みが強く汗をかき、のどが渇いて水をほしがる。喘鳴がある。鼻水やくしゃみはほとんどない。この患者に適した漢方薬はどれか。","choices":["小青竜湯","麻杏甘石湯","麻黄湯","桂枝湯","葛根湯"],"answer":[1],"exp":"悪寒がなく、汗出て喘・口渇＝麻杏甘石湯。麻黄湯・葛根湯は悪寒・無汗、小青竜湯は水様鼻汁・痰、桂枝湯は悪風・自汗で咳が主症状ではない。","level":2},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"45歳男性。体格がよく、かぜをひいて悪寒・39℃の発熱・頭痛があり、汗が全く出ない。全身の節々が痛くてじっとしていられない。脈は浮緊。患者は「いつも葛根湯を飲んでいる」と言う。より適した漢方薬はどれか。","choices":["麻黄湯","桂枝湯","麻杏甘石湯","麻黄附子細辛湯","葛根湯"],"answer":[0],"exp":"麻黄湯は麻黄5g・桂皮4g（ツムラ）で葛根湯（麻黄3g・桂皮2g）より発汗力が強い。高熱・無汗・身体痛（関節痛・腰痛）が強い実証に。葛根湯の目標は項背強。","level":3},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"69歳女性。手足が冷え、疲れやすい。かぜのひき始めに微熱と強い悪寒、頭痛、めまいがある。血圧は低め。脈は沈で弱い。この患者に適した漢方薬はどれか。","choices":["麻黄附子細辛湯","桂枝湯","麻黄湯","葛根湯","小青竜湯"],"answer":[0],"exp":"低血圧で頭痛・めまい、悪寒・微熱・倦怠・四肢の冷え＝麻黄附子細辛湯。桂枝湯も虚証のかぜに用いるが脈は浮（浮弱）で、自汗が目標。脈沈は少陰病。","level":3},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"42歳男性。1週間ほど前から両肩・腰・太ももの筋肉痛がある。夕方になると痛みが増す。かぜの症状（悪寒・発熱）はない。むくみ・口渇もない。この患者に適した漢方薬はどれか。","choices":["小青竜湯","麻黄湯","越婢加朮湯","葛根湯","麻杏薏甘湯"],"answer":[4],"exp":"かぜ症状のない比較的急性の筋肉痛・夕方増悪＝麻杏薏甘湯。麻黄湯の関節痛・腰痛は悪寒・発熱・無汗を伴うかぜ・インフルエンザ初期のもの。","level":2},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"31歳女性。顔がむくみ、まぶたが腫れぼったい。尿量が少なく、汗をかきやすく口が渇く。関節も腫れて熱感がある。体力はある。この患者に適した漢方薬はどれか。","choices":["越婢加朮湯","小青竜湯","神秘湯","麻杏薏甘湯","麻黄附子細辛湯"],"answer":[0],"exp":"浮腫・小便不利・汗・口渇・関節の腫脹熱感＝越婢加朮湯。小青竜湯の水は鼻汁・痰として現れる。","level":2},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"57歳男性。体力は中等度。慢性的な咳と痰で、痰は白く泡状で量が多い。寒い日に悪化する。口渇・発汗はない。抑うつ傾向もない。この患者に適した漢方薬はどれか。","choices":["麻杏甘石湯","越婢加朮湯","小青竜湯","五虎湯","神秘湯"],"answer":[2],"exp":"白く泡状・多量の痰、寒冷で悪化、口渇なし＝寒・水毒＝小青竜湯。五虎湯・麻杏甘石湯・越婢加朮湯は石膏で冷やす処方（熱・口渇向け）、神秘湯は痰が少なく抑うつ傾向。","level":3},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"36歳男性。体力中等度以上。かぜの初期で悪寒・発熱・頭痛があり、汗はかいていない。首から背中が板のようにこわばる。この患者に適した漢方薬はどれか。","choices":["葛根湯","薏苡仁湯","麻杏甘石湯","神秘湯","麻黄附子細辛湯"],"answer":[0],"exp":"『傷寒論』「太陽病、項背強几几、無汗悪風、葛根湯主之」。項背強＋無汗＝葛根湯。","level":1},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"3歳男児。かぜで鼻がつまり、透明な水様の鼻汁がたくさん出て、くしゃみを繰り返す。熱は37.3℃。この患者に適した漢方薬はどれか。","choices":["小青竜湯","麻黄附子細辛湯","越婢加朮湯","葛根湯加川芎辛夷","麻杏薏甘湯"],"answer":[0],"exp":"水様鼻汁・くしゃみ（鼻閉もあり得る）の感冒・鼻炎＝小青竜湯（効能に鼻閉も含む）。葛根湯加川芎辛夷は鼻汁が少なく鼻閉主体・副鼻腔炎。","level":2},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"27歳男性。体力充実。インフルエンザ初期で悪寒・高熱・無汗・関節痛があったため麻黄湯を服用したところ、全身にじっとり汗をかいて熱が下がり、楽になった。今後の対応として最も適切なものはどれか。","choices":["麻黄湯をさらに増量して汗を出し続ける","麻黄湯の服用を中止し、安静と水分補給をする","汗が出たので葛根湯を追加する","汗が出たので越婢加朮湯に切り替える","麻黄湯を1か月間続けて再発を予防する"],"answer":[1],"exp":"麻黄剤は発汗させて邪を除く汗法の処方。発汗して解熱・症状改善したら中止する（過度の発汗は体力を消耗し、脱水を招く）。漫然と長期服用しない。","level":3},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"16歳女性。かぜをひいて2日目。悪風と微熱、頭痛があり、汗をかいている。胃腸が弱く食欲がない。脈は浮弱。この患者に適した漢方薬はどれか。","choices":["葛根湯","五虎湯","麻杏甘石湯","桂枝湯","麻黄湯"],"answer":[3],"exp":"自汗・脈浮弱、胃腸虚弱＝桂枝湯。麻黄剤は胃腸虚弱者で食欲不振・胃部不快感を起こしやすく、自汗の虚証に用いると発汗過多となる。","level":2},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"71歳女性。かぜをひいて3日。悪寒と微熱、強い倦怠感がある。加えて、薄い水様の鼻汁とくしゃみがあり、手足が冷たい。脈は沈細。この患者に適した漢方薬はどれか。","choices":["麻黄湯","葛根湯","麻杏甘石湯","葛根湯加川芎辛夷","麻黄附子細辛湯"],"answer":[4],"exp":"水様鼻汁があっても、高齢・倦怠・冷え・脈沈細（少陰病）を優先して麻黄附子細辛湯（細辛は水様鼻汁にも働く）。麻黄湯・葛根湯は脈浮緊の実証で高齢虚弱者には過剰な発汗となる。","level":3},
{"cat":"症例","sub":"総合（麻黄剤の総まとめ）","type":"single","q":"37歳男性。体力中等度以上。夏場に急に膝が腫れて熱っぽくなり、足もむくんで靴がきつい。汗が多く、のどが渇く。この患者に適した漢方薬はどれか。","choices":["葛根湯","薏苡仁湯","麻杏薏甘湯","越婢加朮湯","麻黄湯"],"answer":[3],"exp":"腫脹・熱感・浮腫・汗・口渇＝越婢加朮湯。麻杏薏甘湯・薏苡仁湯は腫脹・熱感・浮腫の乏しい関節痛・筋肉痛。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"multi","q":"次の麻黄剤のうち、石膏を含むものをすべて選べ。","choices":["麻杏薏甘湯","麻黄湯","麻杏甘石湯","小青竜湯","越婢加朮湯","五虎湯"],"answer":[2,4,5],"exp":"石膏を含む麻黄剤＝麻杏甘石湯（10g）・五虎湯（10g）・越婢加朮湯（8g）（ツムラ）。石膏は清熱・止渇の生薬で、麻黄と組むと発汗作用が抑えられる。麻杏薏甘湯は石膏ではなく薏苡仁、麻黄湯・小青竜湯は桂皮を含む発汗型。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"multi","q":"次の麻黄剤のうち、杏仁を含むものをすべて選べ。","choices":["麻杏薏甘湯","麻杏甘石湯","神秘湯","五虎湯","越婢加朮湯","葛根湯","麻黄湯"],"answer":[0,1,2,3,6],"exp":"杏仁（鎮咳）を含む＝麻黄湯・麻杏甘石湯・麻杏薏甘湯・五虎湯・神秘湯。葛根湯・越婢加朮湯・小青竜湯・麻黄附子細辛湯・薏苡仁湯・葛根湯加川芎辛夷は杏仁を含まない。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"multi","q":"次の麻黄剤のうち、桂皮を含むものをすべて選べ。","choices":["小青竜湯","越婢加朮湯","薏苡仁湯","麻黄附子細辛湯","麻黄湯","麻杏甘石湯","葛根湯"],"answer":[0,2,4,6],"exp":"桂皮を含む麻黄剤＝葛根湯・葛根湯加川芎辛夷・麻黄湯・小青竜湯・薏苡仁湯。麻黄＋桂皮は発汗作用を強める組み合わせ。石膏剤（麻杏甘石湯・越婢加朮湯）と麻黄附子細辛湯は桂皮を含まない。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"single","q":"11の麻黄剤（ツムラ）のうち、甘草を含まないものはどれか。","choices":["葛根湯","麻黄湯","麻黄附子細辛湯","越婢加朮湯","麻杏甘石湯"],"answer":[2],"exp":"麻黄附子細辛湯は麻黄・細辛・附子の3味のみで甘草を含まない。他の10処方はすべて甘草を含む（偽アルドステロン症の注意）。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"single","q":"麻黄剤のうち、附子を含む処方はどれか。","choices":["麻黄附子細辛湯","麻黄湯","葛根湯","薏苡仁湯","小青竜湯"],"answer":[0],"exp":"附子（トリカブトの塊根を加工）を含むのは麻黄附子細辛湯のみ。附子・細辛で温めて少陰病の寒を除く。小青竜湯は細辛を含むが附子は含まない。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"multi","q":"次の麻黄剤のうち、細辛を含むものをすべて選べ。","choices":["葛根湯加川芎辛夷","麻黄附子細辛湯","神秘湯","小青竜湯","五虎湯","麻黄湯"],"answer":[1,3],"exp":"細辛を含む＝小青竜湯・麻黄附子細辛湯。細辛は温める生薬で、水様の鼻汁・痰にも働く。葛根湯加川芎辛夷の「辛」は辛夷で、細辛ではない。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"multi","q":"次の麻黄剤のうち、薏苡仁を含むものをすべて選べ。","choices":["薏苡仁湯","麻杏甘石湯","越婢加朮湯","五虎湯","神秘湯","麻杏薏甘湯"],"answer":[0,5],"exp":"薏苡仁（ハトムギの種子）を含む＝麻杏薏甘湯（10g）・薏苡仁湯（8g）。ともに関節痛・筋肉痛に用いる（利水・鎮痛）。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"multi","q":"次の麻黄剤のうち、蒼朮を含むものをすべて選べ。","choices":["葛根湯","薏苡仁湯","麻杏薏甘湯","越婢加朮湯","小青竜湯","麻杏甘石湯"],"answer":[1,3],"exp":"蒼朮（利水）を含む＝越婢加朮湯（越婢湯に「朮」を加えたもの）・薏苡仁湯。麻黄＋朮で湿（水）をさばき、浮腫や関節の腫れ・痛みに働く。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"multi","q":"次の麻黄剤のうち、芍薬を含むものをすべて選べ。","choices":["小青竜湯","薏苡仁湯","葛根湯","葛根湯加川芎辛夷","越婢加朮湯","麻杏甘石湯","麻黄湯"],"answer":[0,1,2,3],"exp":"芍薬を含む＝葛根湯・葛根湯加川芎辛夷・小青竜湯・薏苡仁湯。麻黄湯は桂枝湯から芍薬・生姜・大棗を除き麻黄・杏仁を加えた形で、芍薬を含まない。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"single","q":"柴胡・厚朴・蘇葉・陳皮を含み、抑うつ傾向のある喘息・気管支炎に用いる麻黄剤はどれか。","choices":["五虎湯","小青竜湯","神秘湯","麻黄附子細辛湯","麻杏甘石湯"],"answer":[2],"exp":"神秘湯（ツムラ85）＝麻黄・杏仁・厚朴・陳皮・甘草・柴胡・蘇葉。柴胡・厚朴・蘇葉・陳皮は気の巡りを良くする（理気）生薬で、抑うつ傾向に対応。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"single","q":"麻杏甘石湯に桑白皮を加えた構成の処方はどれか。","choices":["神秘湯","小青竜湯","麻杏薏甘湯","越婢加朮湯","五虎湯"],"answer":[4],"exp":"五虎湯＝石膏・杏仁・麻黄・桑白皮・甘草。桑白皮（クワの根皮）が鎮咳・去痰作用を補強。効能はせき、気管支ぜんそく。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"single","q":"半夏・乾姜・五味子・細辛を含む麻黄剤はどれか。","choices":["麻黄附子細辛湯","葛根湯加川芎辛夷","神秘湯","五虎湯","小青竜湯"],"answer":[4],"exp":"小青竜湯＝麻黄・桂皮・芍薬・甘草・半夏・乾姜・五味子・細辛の8味。乾姜・細辛・半夏・五味子が冷えた水（水様の痰・鼻汁）をさばく。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"single","q":"当帰を含む麻黄剤はどれか。","choices":["越婢加朮湯","麻杏薏甘湯","葛根湯","神秘湯","薏苡仁湯"],"answer":[4],"exp":"薏苡仁湯＝薏苡仁・蒼朮・当帰・麻黄・桂皮・芍薬・甘草。当帰・芍薬で血を補い巡らせるため、慢性化した関節痛・筋肉痛に向く。麻杏薏甘湯は麻黄・杏仁・薏苡仁・甘草の4味。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"single","q":"ツムラ製剤で1日量あたりの麻黄の配合量が最も多い麻黄剤はどれか。","choices":["麻黄湯","麻黄附子細辛湯","葛根湯","小青竜湯","越婢加朮湯"],"answer":[4],"exp":"越婢加朮湯は麻黄6g（最多）。麻黄湯・神秘湯5g、麻黄附子細辛湯・麻杏甘石湯・麻杏薏甘湯・薏苡仁湯・五虎湯4g、葛根湯・葛根湯加川芎辛夷・小青竜湯3g。越婢加朮湯は石膏8gと組むので発汗よりも利水・清熱に働く。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"tf","q":"葛根湯は、桂枝湯に葛根と麻黄を加えた構成である。","choices":["正しい","誤り"],"answer":[0],"exp":"葛根湯＝桂枝湯（桂皮・芍薬・大棗・甘草・生姜）＋葛根・麻黄。桂枝湯が骨格なので桂枝湯との鑑別（汗の有無）が重要になる。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"tf","q":"葛根湯加川芎辛夷は、葛根湯に川芎と辛夷を加えた処方である。","choices":["正しい","誤り"],"answer":[0],"exp":"葛根湯＋川芎（頭痛・頭重）・辛夷（鼻閉）。鼻づまり・蓄膿症・慢性鼻炎に用いる。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"tf","q":"麻杏甘石湯と麻杏薏甘湯の違いは、石膏の代わりに薏苡仁が入っている点で、前者は咳、後者は関節痛・筋肉痛に用いる。","choices":["正しい","誤り"],"answer":[0],"exp":"麻杏甘石湯＝麻黄・杏仁・甘草・石膏（咳・喘息）、麻杏薏甘湯＝麻黄・杏仁・薏苡仁・甘草（関節痛・神経痛・筋肉痛）。名前の1文字違いで用途が大きく異なる。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"tf","q":"麻黄湯は、麻黄・杏仁・桂皮・甘草の4味からなる。","choices":["正しい","誤り"],"answer":[0],"exp":"麻黄湯（ツムラ27）＝杏仁5・麻黄5・桂皮4・甘草1.5g。麻黄＋桂皮で強い発汗、麻黄＋杏仁で鎮咳平喘。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"tf","q":"越婢加朮湯は桂皮を含むため、発汗作用が非常に強い。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。越婢加朮湯は石膏・麻黄・蒼朮・大棗・甘草・生姜で、桂皮を含まない。麻黄＋石膏で発汗はむしろ抑えられ、清熱・利水に働く（汗が出ている者に用いる）。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"input","q":"麻杏甘石湯の「石」が表す生薬名を漢字で答えよ。","choices":[],"answer":["石膏","せっこう"],"exp":"麻杏甘石湯＝麻黄・杏仁・甘草・石膏。石膏（含水硫酸カルシウムを主成分とする鉱物生薬）は清熱・止渇。","level":1},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"input","q":"麻杏薏甘湯の「薏」が表す生薬名を漢字で答えよ。","choices":[],"answer":["薏苡仁","よくいにん"],"exp":"麻杏薏甘湯＝麻黄・杏仁・薏苡仁・甘草。薏苡仁はハトムギの種子で、利水・鎮痛（いぼにも用いられる）。","level":2},
{"cat":"鑑別・使い分け","sub":"構成生薬で比較","type":"input","q":"五虎湯が麻杏甘石湯に加えている生薬名を漢字で答えよ。","choices":[],"answer":["桑白皮","そうはくひ"],"exp":"五虎湯＝麻杏甘石湯＋桑白皮。桑白皮はクワの根皮で、鎮咳・去痰に働く。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"multi","q":"汗が出ている（自汗のある）患者にも用いられる麻黄剤をすべて選べ。","choices":["麻黄湯","五虎湯","小青竜湯","葛根湯","越婢加朮湯","麻杏甘石湯"],"answer":[1,4,5],"exp":"麻黄に石膏を組み合わせると発汗作用が抑えられ、清熱の方向に働くため、汗の出ている者にも使える（麻杏甘石湯：「汗出でて喘」、越婢加朮湯：「浮腫と汗が出て小便不利」）。麻黄湯・葛根湯・小青竜湯は麻黄＋桂皮で発汗させる処方で、無汗が原則。","level":1},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"multi","q":"「自然発汗がない（無汗）」ことが使用目標となる処方をすべて選べ。","choices":["葛根湯","麻杏甘石湯","桂枝湯","越婢加朮湯","麻黄湯"],"answer":[0,4],"exp":"葛根湯（自然発汗がなく頭痛・発熱・悪寒・肩こり）・麻黄湯（自然に汗の出ないもの）は無汗の太陽病実証。桂枝湯は自汗、麻杏甘石湯・越婢加朮湯は汗が出ている者にも用いる。","level":1},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"脈候と処方の組合せとして正しいのはどれか。","choices":["葛根湯 ― 脈沈細","麻黄附子細辛湯 ― 脈浮緊","桂枝湯 ― 脈浮緊","麻黄湯 ― 脈浮緊","麻黄湯 ― 脈沈細"],"answer":[3],"exp":"麻黄湯・葛根湯＝脈浮緊（太陽病実証）、桂枝湯＝脈浮弱（浮緩、太陽病虚証）、麻黄附子細辛湯＝脈沈細（少陰病）。","level":1},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"『傷寒論』の太陽病で、「汗が出て脈浮緩（浮弱）」の中風と、「無汗で脈浮緊、身体痛」の傷寒がある。後者に用いる代表処方はどれか。","choices":["麻杏甘石湯","越婢加朮湯","麻黄附子細辛湯","桂枝湯","麻黄湯"],"answer":[4],"exp":"太陽病中風（自汗・脈浮緩）→桂枝湯、太陽病傷寒（無汗・脈浮緊・身疼痛）→麻黄湯。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"かぜの患者で「脈が沈んで細い」場合に、選択肢となる処方はどれか。","choices":["桂枝湯","小青竜湯","麻黄附子細辛湯","葛根湯","麻黄湯"],"answer":[2],"exp":"脈沈細は少陰病（体力が衰え、熱感に乏しく悪寒・倦怠が強い）の脈。麻黄附子細辛湯が適する。太陽病の処方（麻黄湯・葛根湯・桂枝湯・小青竜湯）はいずれも脈が浮。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"multi","q":"体を温める性質が強く、冷え（寒証）に向く麻黄剤をすべて選べ。","choices":["麻杏甘石湯","五虎湯","越婢加朮湯","小青竜湯","麻黄附子細辛湯"],"answer":[3,4],"exp":"麻黄附子細辛湯（附子・細辛）・小青竜湯（乾姜・細辛・桂皮）は温める生薬を含み、寒・水毒に向く。麻杏甘石湯・五虎湯・越婢加朮湯は石膏で熱を冷ます（清熱）処方。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"次の組合せのうち、痰・鼻汁の性状と処方の対応として正しいのはどれか。","choices":["水様で薄い痰・鼻汁 ― 麻杏甘石湯","鼻閉が主で鼻汁は少ない ― 小青竜湯","水様で薄い痰・鼻汁 ― 小青竜湯","水様で薄い痰・鼻汁 ― 五虎湯","黄色く粘稠な痰と口渇 ― 小青竜湯"],"answer":[2],"exp":"水様（薄い）＝寒・水毒＝小青竜湯。粘稠・口渇＝熱＝麻杏甘石湯・五虎湯（石膏）。鼻閉主体・副鼻腔炎＝葛根湯加川芎辛夷。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"麻黄附子細辛湯と麻黄湯の比較として正しいのはどれか。","choices":["両者とも脈浮緊の実証に用いる","麻黄湯は附子を含み体を温める","麻黄附子細辛湯は自汗・口渇のある咳に用いる","麻黄附子細辛湯は虚証・寒証の少陰病、麻黄湯は実証の太陽病に用いる","麻黄附子細辛湯は石膏を含み熱を冷ます"],"answer":[3],"exp":"麻黄湯＝体力充実・悪寒発熱・無汗・脈浮緊（太陽病実証）。麻黄附子細辛湯＝高齢者・虚弱者で悪寒・微熱・倦怠・脈沈細（少陰病）。附子を含むのは麻黄附子細辛湯、石膏はどちらも含まない。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"桂枝湯と葛根湯の区別点として最も重要なものはどれか。","choices":["頭痛の有無","発熱の有無","自汗の有無","悪寒の有無","年齢"],"answer":[2],"exp":"どちらも太陽病で悪寒（悪風）・発熱・頭痛はある。自汗（脈浮弱）→桂枝湯、無汗（脈浮緊）・項背強→葛根湯。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"葛根湯と麻黄湯は、どちらも無汗の太陽病実証に用いる。両者を使い分ける主な症状の組合せとして正しいのはどれか。","choices":["葛根湯 ― 脈沈細、麻黄湯 ― 脈浮緊","葛根湯 ― 項背部のこわばり、麻黄湯 ― 関節痛・腰痛など全身の痛み","葛根湯 ― 関節痛・腰痛、麻黄湯 ― 項背部のこわばり","葛根湯 ― 水様鼻汁、麻黄湯 ― 口渇","葛根湯 ― 自汗、麻黄湯 ― 無汗"],"answer":[1],"exp":"葛根湯の目標は項背強（首筋〜背中のこわばり）、麻黄湯の目標は身疼痛・腰痛・骨節疼痛（関節痛）と高熱。いずれも無汗・脈浮緊。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"麻杏甘石湯と小青竜湯の使い分けとして正しいのはどれか。","choices":["口渇・自汗・粘い痰なら麻杏甘石湯、水様の痰・鼻汁なら小青竜湯","麻杏甘石湯は無汗、小青竜湯は自汗が目標","両者とも附子を含み温める","水様の痰なら麻杏甘石湯、粘い痰なら小青竜湯","麻杏甘石湯は寒証、小青竜湯は熱証に用いる"],"answer":[0],"exp":"麻杏甘石湯＝熱（石膏で清熱）：口渇・自汗・粘稠痰。小青竜湯＝寒・水毒（乾姜・細辛で温める）：水様の痰・鼻汁・くしゃみ。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"麻杏甘石湯・五虎湯・神秘湯はいずれも喘息に用いる。神秘湯に特徴的な使用目標はどれか。","choices":["口渇・発汗が著しい","水様の痰・鼻汁が多量","痰が少なく呼吸困難が強く、抑うつ傾向がある","悪寒・微熱・脈沈細","浮腫と小便不利"],"answer":[2],"exp":"神秘湯＝柴胡・厚朴・蘇葉・陳皮で気を巡らせる→痰の少ない呼吸困難・抑うつ傾向。口渇・発汗＝麻杏甘石湯・五虎湯、水様の痰＝小青竜湯。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"越婢加朮湯・麻杏薏甘湯・薏苡仁湯の使い分けとして正しいのはどれか。","choices":["3処方とも石膏を含むため使い分けは不要","浮腫が強ければ麻杏薏甘湯","関節の腫脹・熱感・浮腫が強ければ越婢加朮湯、比較的急性で夕方に増悪すれば麻杏薏甘湯、亜急性〜慢性なら薏苡仁湯","夕方に増悪する痛みは越婢加朮湯","慢性なら越婢加朮湯、急性なら薏苡仁湯"],"answer":[2],"exp":"越婢加朮湯＝石膏で清熱＋蒼朮で利水（腫脹・熱感・浮腫・汗・口渇）。麻杏薏甘湯＝風湿の身体痛で日晡所（夕方）に劇しい。薏苡仁湯＝当帰・芍薬・桂皮も含み、亜急性〜慢性の関節痛・筋肉痛。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"single","q":"小青竜湯・麻黄附子細辛湯・葛根湯加川芎辛夷の使い分けとして誤っているものはどれか。","choices":["麻黄附子細辛湯と小青竜湯はどちらも細辛を含む","鼻閉・蓄膿症・慢性鼻炎なら葛根湯加川芎辛夷","くしゃみ・水様鼻汁が主体なら小青竜湯","高齢で冷え・倦怠・脈沈細があれば麻黄附子細辛湯","鼻閉が主体で副鼻腔炎を伴う場合は小青竜湯を第一に選ぶ"],"answer":[4],"exp":"※誤りを選ぶ問題。鼻閉主体・副鼻腔炎は葛根湯加川芎辛夷。小青竜湯は水様鼻汁・くしゃみ、麻黄附子細辛湯は少陰病（冷え・倦怠・脈沈細）。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"tf","q":"桂枝湯は無汗、麻黄湯は自汗のかぜに用いる。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。逆である。桂枝湯＝自汗・脈浮弱（虚証）、麻黄湯＝無汗・脈浮緊（実証）。","level":1},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"tf","q":"小青竜湯は、口渇が強く黄色い粘稠な痰を伴う咳に第一選択となる。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。小青竜湯は水様の痰・鼻汁（寒・水毒）に用いる。口渇・粘稠痰（熱）は麻杏甘石湯・五虎湯（石膏）。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"tf","q":"麻黄附子細辛湯は、体力充実した若年者の高熱・無汗・脈浮緊のかぜに最も適する。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。それは麻黄湯。麻黄附子細辛湯は高齢者・虚弱者で悪寒・微熱・全身倦怠・手足の冷え・脈沈細（少陰病）に用いる。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"tf","q":"麻杏薏甘湯は、関節痛・筋肉痛が夕方（日晡所）に増悪するときに用いられる。","choices":["正しい","誤り"],"answer":[0],"exp":"『金匱要略』「病者一身尽く疼み、発熱、日晡所劇しき者は風湿と名づく…麻黄杏仁薏苡甘草湯を与う」。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"tf","q":"薏苡仁湯は麻杏薏甘湯に比べ、より慢性化した（亜急性〜慢性の）関節痛・筋肉痛に用いられる。","choices":["正しい","誤り"],"answer":[0],"exp":"薏苡仁湯は当帰・芍薬・桂皮・蒼朮を含み、血行を改善しつつ湿を除くため、急性期を過ぎた関節痛・筋肉痛に用いられる。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"tf","q":"越婢加朮湯は、関節の腫脹・熱感に浮腫・小便不利・発汗を伴う場合に用いる。","choices":["正しい","誤り"],"answer":[0],"exp":"効能：浮腫と汗が出て小便不利のあるものの腎炎、ネフローゼ、脚気、関節リウマチ、夜尿症、湿疹。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"tf","q":"五虎湯は石膏を含まないため、麻杏甘石湯より体を温める作用が強い。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。五虎湯は麻杏甘石湯＋桑白皮で、石膏10g（ツムラ）を含む清熱の処方。","level":3},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"tf","q":"麻黄湯と葛根湯の麻黄・桂皮の配合量（ツムラ）を比べると、麻黄湯の方がいずれも多く、発汗作用が強い。","choices":["正しい","誤り"],"answer":[0],"exp":"麻黄湯：麻黄5g・桂皮4g、葛根湯：麻黄3g・桂皮2g。麻黄湯は体力充実した者の高熱・無汗・身体痛に用いる強い発汗剤。","level":3},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"input","q":"無汗・脈浮緊・悪寒発熱に加え、関節痛・腰痛が強いインフルエンザ初期に用いる麻黄剤を漢字で答えよ。","choices":[],"answer":["麻黄湯","まおうとう"],"exp":"麻黄湯：悪寒、発熱、頭痛、腰痛、自然に汗の出ないものの感冒、インフルエンザ（初期のもの）。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"input","q":"痰が少なく呼吸困難が強い喘息で、抑うつ傾向のある者に用いる麻黄剤を漢字で答えよ。","choices":[],"answer":["神秘湯","しんぴとう"],"exp":"神秘湯：小児ぜんそく、気管支ぜんそく、気管支炎。柴胡・厚朴・蘇葉・陳皮で気を巡らす。","level":2},
{"cat":"鑑別・使い分け","sub":"汗・虚実・脈・寒熱で比較","type":"input","q":"水様の痰・水様鼻汁・くしゃみを目標に、アレルギー性鼻炎・花粉症に用いる麻黄剤を漢字で答えよ。","choices":[],"answer":["小青竜湯","しょうせいりゅうとう"],"exp":"小青竜湯：「心下有水気」。水様の痰・鼻汁・鼻閉・くしゃみ・喘鳴・咳嗽・流涙。","level":2},
{"cat":"鑑別・使い分け","sub":"生薬の組合せと働き","type":"single","q":"麻黄と石膏を組み合わせたときの働きとして最も適切なのはどれか。","choices":["発汗作用が強まり、強く汗を出させる","補血して貧血を改善する","瀉下作用で便通を促す","体を強く温め、冷えをとる","発汗作用が抑えられ、清熱（熱を冷ます）・止渇に働く"],"answer":[4],"exp":"麻黄＋石膏＝麻杏甘石湯・五虎湯・越婢加朮湯。石膏が熱を冷まし麻黄の発汗を抑えるので、汗の出ている者にも用いる。発汗を強めるのは麻黄＋桂皮。","level":1},
{"cat":"鑑別・使い分け","sub":"生薬の組合せと働き","type":"single","q":"麻黄と桂皮を組み合わせたときの主な働きはどれか。","choices":["利水作用の増強","鎮咳・去痰の増強","発汗作用の増強","発汗の抑制と清熱","補気作用"],"answer":[2],"exp":"麻黄＋桂皮＝強い発汗（解表）。麻黄湯・葛根湯・小青竜湯などに含まれる。発汗抑制・清熱は麻黄＋石膏、鎮咳平喘は麻黄＋杏仁、利水は麻黄＋朮。","level":1},
{"cat":"鑑別・使い分け","sub":"生薬の組合せと働き","type":"single","q":"麻黄と蒼朮（朮）を組み合わせたときの主な働きはどれか。","choices":["温裏（体を内から温める）","発汗の増強","鎮咳平喘","利水（浮腫や関節の水をさばく）","補血"],"answer":[3],"exp":"麻黄＋朮＝利水・除湿。越婢加朮湯・薏苡仁湯に含まれ、浮腫や関節の腫れ・重だるさを改善する。","level":2},
{"cat":"鑑別・使い分け","sub":"生薬の組合せと働き","type":"single","q":"麻黄と附子・細辛を組み合わせた麻黄附子細辛湯の考え方として正しいのはどれか。","choices":["柴胡で気を巡らせながら麻黄で鎮咳する","杏仁で咳を止めながら麻黄で発汗する","当帰で補血しながら麻黄で利水する","石膏で冷やしながら麻黄で発汗する","附子・細辛で体を温めながら、麻黄で表の寒邪を発散する"],"answer":[4],"exp":"少陰病（体力が衰え、冷えて脈沈細）では、そのまま発汗させると虚を深める。附子・細辛で温めながら麻黄で表を開く。","level":2},
{"cat":"鑑別・使い分け","sub":"生薬の組合せと働き","type":"tf","q":"麻黄と杏仁の組合せは鎮咳平喘に働き、麻黄湯・麻杏甘石湯・五虎湯・神秘湯などに共通してみられる。","choices":["正しい","誤り"],"answer":[0],"exp":"杏仁（バラ科アンズの種子、アミグダリンを含む）は鎮咳。麻黄の気管支拡張作用（エフェドリンのβ2作用）と合わせて咳・喘鳴を抑える。","level":2},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"multi","q":"麻黄（エフェドリン）の交感神経刺激作用により起こりうる副作用をすべて選べ。","choices":["血圧上昇","徐脈","排尿障害","不眠","動悸・頻脈","眠気","発汗過多"],"answer":[0,2,3,4,6],"exp":"麻黄の副作用：動悸・頻脈・血圧上昇・不眠・発汗過多・精神興奮・排尿障害・食欲不振・胃部不快感など。交感神経刺激なので徐脈や眠気ではなく、頻脈・不眠の方向。","level":1},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"multi","q":"麻黄を含む製剤との併用に注意が必要な薬剤をすべて選べ。","choices":["エフェドリン類含有製剤","甲状腺製剤（レボチロキシンなど）","カテコールアミン製剤（アドレナリンなど）","プロトンポンプ阻害剤","キサンチン系製剤（テオフィリンなど）","MAO阻害剤"],"answer":[0,1,2,4,5],"exp":"麻黄含有製剤の併用注意：麻黄含有製剤・エフェドリン類含有製剤、MAO阻害剤、甲状腺製剤（チロキシン・リオチロニン）、カテコールアミン製剤（アドレナリン・イソプレナリン）、キサンチン系製剤（テオフィリン・ジプロフィリン）。交感神経刺激作用が増強し、不眠・発汗過多・頻脈・動悸・全身脱力感・精神興奮などが現れやすくなる。","level":1},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"multi","q":"麻黄を含む製剤の投与にあたり、特に注意が必要な（慎重に投与すべき）患者をすべて選べ。","choices":["軽度の便秘のある若年者","前立腺肥大などで排尿障害のある患者","甲状腺機能亢進症の患者","病後の衰弱期・著しく体力の衰えている患者","狭心症・心筋梗塞など循環器系障害のある患者","重症高血圧症の患者"],"answer":[1,2,3,4,5],"exp":"麻黄含有製剤では、病後の衰弱期・著しく体力の衰えた患者、胃腸の虚弱な患者、食欲不振・悪心・嘔吐のある患者、発汗傾向の著しい患者、循環器系障害（既往含む）、重症高血圧、高度の腎障害、排尿障害、甲状腺機能亢進症の患者に注意する。","level":1},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"single","q":"麻黄の主成分エフェドリンの作用として正しいのはどれか。","choices":["中枢抑制作用による催眠","鉱質コルチコイド様作用","副交感神経刺激作用","抗ヒスタミン作用による鎮静","交感神経刺激作用（気管支拡張・心拍数増加・血圧上昇など）"],"answer":[4],"exp":"エフェドリンはアドレナリン受容体への直接作用とノルアドレナリン遊離（間接作用）による交感神経刺激薬。気管支拡張（鎮咳平喘）の一方、動悸・頻脈・血圧上昇・不眠・排尿障害を起こしうる。鉱質コルチコイド様作用は甘草（グリチルリチン）。","level":1},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"single","q":"前立腺肥大症の高齢男性が麻黄剤を服用した際に特に起こりやすい副作用はどれか。","choices":["徐脈","眠気","排尿困難・尿閉","低血糖","下痢"],"answer":[2],"exp":"エフェドリンのα受容体刺激で膀胱頸部・尿道の平滑筋が収縮し、排尿困難（尿閉）を起こしうる。前立腺肥大の高齢男性では特に注意。","level":2},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"single","q":"気管支喘息でテオフィリンを服用中の患者に麻杏甘石湯を併用する場合、注意すべきことはどれか。","choices":["テオフィリンの効果が完全に消失する","併用による注意点は特にない","徐脈・血圧低下が起こる","交感神経刺激作用が増強し、動悸・頻脈・不眠・精神興奮などが現れやすくなる","低血糖を起こしやすくなる"],"answer":[3],"exp":"キサンチン系製剤（テオフィリン等）は麻黄含有製剤の併用注意。交感神経刺激作用が増強する。","level":2},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"single","q":"甲状腺機能低下症でレボチロキシンを服用中の患者が葛根湯を服用する場合の注意として正しいのはどれか。","choices":["注意点はない","甲状腺機能低下症が悪化する","甲状腺製剤の吸収がなくなる","甲状腺製剤との併用で交感神経刺激作用が増強し、動悸・頻脈などが起こりやすい","低カリウム血症のみが問題となる"],"answer":[3],"exp":"甲状腺製剤（チロキシン・リオチロニン）は麻黄含有製剤の併用注意。甲状腺ホルモンはカテコールアミンの作用を増強する。","level":2},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"single","q":"かぜの症状に対して、葛根湯と市販の総合感冒薬（塩酸プソイドエフェドリンや dl-メチルエフェドリンを含む）を一緒に服用しようとしている患者への助言として最も適切なのはどれか。","choices":["エフェドリン類が重複し動悸・不眠・血圧上昇などが起こりやすくなるため、併用を避ける","漢方薬と西洋薬は作用が異なるので自由に併用してよい","効果を高めるため両方を倍量で服用する","葛根湯は甘草を含まないので問題ない","総合感冒薬の方が強いので葛根湯は寝る前だけ飲む"],"answer":[0],"exp":"麻黄（エフェドリン類）含有製剤とエフェドリン類含有製剤は併用注意。市販の総合感冒薬・鼻炎薬・鎮咳薬にはエフェドリン類が含まれることが多い。また葛根湯は甘草も含む。","level":2},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"tf","q":"麻黄は交感神経を抑制するため、徐脈や血圧低下に注意が必要である。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。エフェドリンは交感神経を刺激する。頻脈・動悸・血圧上昇に注意。","level":1},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"tf","q":"エフェドリン類はドーピング禁止物質（競技会時に禁止される興奮薬）に指定されているため、スポーツ選手が麻黄を含む漢方薬を服用する際には注意が必要である。","choices":["正しい","誤り"],"answer":[0],"exp":"WADA禁止表国際基準でエフェドリン・メチルエフェドリン・プソイドエフェドリンは興奮薬（競技会時禁止、尿中濃度の閾値あり）。葛根湯など身近なかぜ薬にも麻黄が含まれる点が要注意。","level":1},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"single","q":"競技会を控えたスポーツ選手が、ドーピングの観点から服用に最も注意すべき漢方薬はどれか。","choices":["小建中湯","葛根湯","桂枝加竜骨牡蛎湯","桂枝加芍薬湯","桂枝湯"],"answer":[1],"exp":"葛根湯は麻黄（エフェドリン類）を含む。桂枝湯類（桂枝湯・小建中湯・桂枝加芍薬湯・桂枝加竜骨牡蛎湯）は麻黄を含まない。麻黄剤11処方はすべて麻黄を含むので注意。","level":1},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"tf","q":"麻黄附子細辛湯は甘草を含まないので、麻黄による副作用の心配もない。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。甘草を含まないので偽アルドステロン症の心配は少ないが、麻黄（4g）と附子を含むため、動悸・頻脈・血圧上昇・排尿障害などの麻黄の副作用や附子の副作用に注意が必要。","level":2},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"tf","q":"麻黄剤は胃腸虚弱な患者に投与すると、食欲不振・胃部不快感・悪心などの消化器症状が現れることがある。","choices":["正しい","誤り"],"answer":[0],"exp":"麻黄の副作用には食欲不振・胃部不快感・悪心・嘔吐などの消化器症状がある。胃腸の虚弱な患者は注意が必要（桂枝湯との使い分けにも関わる）。","level":2},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"tf","q":"麻黄剤は「虚証で自汗のある人」でも無汗の人と同じように積極的に用いてよい。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。麻黄＋桂皮型の麻黄剤（麻黄湯・葛根湯など）を虚証・自汗の人に用いると発汗過多・体力消耗を招く（汗法の禁忌）。自汗の虚証には桂枝湯。発汗傾向の著しい患者は麻黄含有製剤の慎重投与の対象でもある。","level":2},
{"cat":"副作用・注意","sub":"麻黄（エフェドリン）","type":"single","q":"MAO阻害剤（セレギリンなど）を服用中のパーキンソン病患者が麻黄湯を併用した場合に懸念されることとして最も適切なのはどれか。","choices":["ノルアドレナリンの分解が抑えられ、交感神経刺激作用が増強する","MAO阻害剤の吸収が低下し、パーキンソン症状が悪化する","低血糖が起こる","低カリウム血症が起こる","麻黄の作用が完全に打ち消される"],"answer":[0],"exp":"エフェドリンはノルアドレナリンを遊離させる間接作用をもつ。MAO阻害剤はモノアミンの分解を抑えるため、併用で交感神経刺激作用（血圧上昇・頻脈など）が増強する。MAO阻害剤は麻黄含有製剤の併用注意。","level":3},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"multi","q":"甘草（グリチルリチン酸）による偽アルドステロン症でみられる症状・所見をすべて選べ。","choices":["ナトリウム・体液の貯留","血圧低下","低カリウム血症","浮腫・体重増加","高カリウム血症","血圧上昇"],"answer":[0,2,3,5],"exp":"グリチルリチン酸の代謝物が11β-HSD2を阻害→コルチゾールが鉱質コルチコイド受容体を刺激→Na・水貯留（浮腫・体重増加・高血圧）とK排泄増加（低K血症）。アルドステロン自体は低下する（だから「偽」）。","level":1},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"single","q":"甘草による低カリウム血症の結果として現れることがある重大な副作用はどれか。","choices":["高血糖","無顆粒球症","ミオパチー（脱力感・四肢の痙攣・麻痺など）","間質性肺炎","出血傾向"],"answer":[2],"exp":"低カリウム血症の結果としてミオパチー（脱力感・筋力低下・筋肉痛・四肢の痙攣・麻痺、CK上昇）が現れることがある。","level":1},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"single","q":"麻黄剤11処方（ツムラ）のうち、甘草の1日量が最も多い処方はどれか。","choices":["麻黄湯","麻杏甘石湯","小青竜湯","葛根湯","越婢加朮湯"],"answer":[2],"exp":"小青竜湯は甘草3g。葛根湯・麻杏甘石湯・越婢加朮湯などは2g、麻黄湯1.5g、麻黄附子細辛湯は0g。甘草1日量2.5g以上の製剤は、アルドステロン症・ミオパチー・低カリウム血症の患者に禁忌とされる。","level":2},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"single","q":"甘草を1日2.5g以上含む漢方製剤は、ある患者に禁忌とされる。麻黄剤のうち、この禁忌に該当する処方（ツムラ）と禁忌の対象患者の組合せとして正しいのはどれか。","choices":["麻黄湯 ― 低カリウム血症のある患者","小青竜湯 ― 低カリウム血症のある患者","葛根湯 ― 高血圧の患者","麻黄附子細辛湯 ― ミオパチーのある患者","小青竜湯 ― 高カリウム血症のある患者"],"answer":[1],"exp":"甘草1日量2.5g以上の製剤：アルドステロン症・ミオパチー・低カリウム血症の患者に禁忌。麻黄剤では小青竜湯（甘草3g）が該当。麻黄湯1.5g、葛根湯2g、麻黄附子細辛湯は甘草を含まない。","level":3},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"multi","q":"甘草を含む漢方薬との併用で、偽アルドステロン症・低カリウム血症に特に注意が必要な薬剤をすべて選べ。","choices":["ビタミンC製剤","カリウム保持性利尿薬（スピロノラクトン）","他の甘草含有漢方製剤","グリチルリチン酸を含む製剤","ループ利尿薬（フロセミドなど）","チアジド系利尿薬（トリクロルメチアジドなど）"],"answer":[2,3,4,5],"exp":"甘草含有製剤の併用注意：甘草含有製剤、グリチルリチン酸及びその塩類を含有する製剤（重複）、ループ系利尿剤（フロセミド・エタクリン酸）、チアジド系利尿剤（トリクロルメチアジド）。いずれも低カリウム血症を助長する。","level":2},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"single","q":"葛根湯（かぜ）と芍薬甘草湯（こむら返り）を同時に処方された患者で、最も注意すべき副作用はどれか。","choices":["甘草の重複による偽アルドステロン症（低K血症・浮腫・高血圧）","低血糖","間質性肺炎のみ","出血傾向","附子中毒"],"answer":[0],"exp":"葛根湯（甘草2g）＋芍薬甘草湯（甘草6g）で甘草が重複・過量になりやすい。偽アルドステロン症・ミオパチーに注意し、血清K値・血圧・浮腫を観察。なお葛根湯の麻黄にも注意。","level":2},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"tf","q":"偽アルドステロン症では血中アルドステロン濃度が上昇している。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。症状はアルドステロン症に似る（低K・高血圧・浮腫）が、血中アルドステロン（およびレニン）は低下しているので「偽」アルドステロン症という。","level":1},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"tf","q":"麻黄附子細辛湯は甘草を含まない麻黄剤であるため、甘草による偽アルドステロン症の観点では他の麻黄剤より注意が少なくてすむ。","choices":["正しい","誤り"],"answer":[0],"exp":"麻黄附子細辛湯＝麻黄・細辛・附子の3味。ただし麻黄と附子の副作用には注意。","level":2},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"tf","q":"甘草による偽アルドステロン症は、服用量が多いほど、また服用期間が長いほど起こりやすく、高齢者で起こりやすい。","choices":["正しい","誤り"],"answer":[0],"exp":"甘草含有製剤の長期・大量服用、高齢者、他の甘草含有製剤や利尿薬との併用でリスクが高まる。早期発見のため血清K値・血圧の確認が重要。","level":2},
{"cat":"副作用・注意","sub":"甘草（偽アルドステロン症）","type":"single","q":"小青竜湯を花粉症シーズンに長期服用している70歳女性。最近、手足のむくみ、血圧上昇、脱力感と手足のつりを訴えた。最も疑われる副作用と確認すべき検査値の組合せはどれか。","choices":["附子中毒 ― 血糖値","間質性肺炎 ― 血清カリウム値","偽アルドステロン症 ― 血清カルシウム値","肝機能障害 ― 血清カルシウム値","偽アルドステロン症 ― 血清カリウム値"],"answer":[4],"exp":"浮腫・血圧上昇・脱力感・こむら返り（ミオパチー）＝甘草による偽アルドステロン症。低カリウム血症を確認する。小青竜湯は甘草3g（麻黄剤で最多）。","level":2},
{"cat":"副作用・注意","sub":"附子・その他の注意","type":"single","q":"麻黄附子細辛湯に含まれる附子による副作用として注意すべき症状はどれか。","choices":["下痢・腹痛（瀉下作用）","出血傾向","心悸亢進・のぼせ・舌のしびれ・悪心など","低カリウム血症・浮腫","眠気・ふらつき"],"answer":[2],"exp":"附子（トリカブトの塊根、減毒加工したもの。アコニチン系アルカロイド）は、心悸亢進・のぼせ・舌のしびれ・悪心などが現れることがある。低K血症・浮腫は甘草の副作用で、麻黄附子細辛湯は甘草を含まない。","level":2},
{"cat":"副作用・注意","sub":"附子・その他の注意","type":"tf","q":"附子を含む麻黄附子細辛湯は、体力が充実していて暑がりでのぼせの強い人に向いている。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。附子は温める生薬で、体力の充実している患者・暑がりでのぼせが強く赤ら顔の患者では副作用が出やすくなるため注意が必要。麻黄附子細辛湯は冷え・倦怠・脈沈細の虚証向け。","level":2},
{"cat":"副作用・注意","sub":"附子・その他の注意","type":"tf","q":"附子を含む製剤は、妊婦または妊娠している可能性のある女性には投与しないことが望ましいとされる。","choices":["正しい","誤り"],"answer":[0],"exp":"附子含有製剤の添付文書では、妊婦・妊娠している可能性のある婦人には投与しないことが望ましい（副作用が現れやすくなる）とされている。","level":3},
{"cat":"副作用・注意","sub":"附子・その他の注意","type":"single","q":"小青竜湯の重大な副作用として添付文書に記載されているもので、発熱・咳嗽・呼吸困難が現れたら直ちに中止し胸部X線などの検査を行うべきものはどれか。","choices":["低血糖","間質性肺炎","無顆粒球症","悪性症候群","腸間膜静脈硬化症"],"answer":[1],"exp":"小青竜湯の重大な副作用：間質性肺炎、偽アルドステロン症、ミオパチー、肝機能障害・黄疸。咳や呼吸困難はもともとの症状と紛らわしいので、発熱・乾性咳嗽・呼吸困難の出現・悪化に注意。","level":3},
{"cat":"副作用・注意","sub":"附子・その他の注意","type":"tf","q":"日本薬局方の細辛は、地上部にアリストロキア酸を含むおそれがあるため、根及び根茎を用いることとされている。","choices":["正しい","誤り"],"answer":[0],"exp":"ウスバサイシン等の地上部（葉など）には腎障害を起こすアリストロキア酸が含まれうるため、日局「サイシン」は根及び根茎と規定されている。小青竜湯・麻黄附子細辛湯に含まれる。","level":3},
{"cat":"副作用・注意","sub":"服薬指導","type":"single","q":"葛根湯や麻黄湯をかぜに用いる際の服薬指導として最も適切なのはどれか。","choices":["かぜの予防のため年間を通じて毎日服用する","かぜの初期に短期間服用し、汗が出て症状が軽くなったら服用を中止する","症状がなくても1か月は飲み続ける","冷水で服用し、体を冷やすようにする","汗が出ても症状が消えるまで増量し続ける"],"answer":[1],"exp":"麻黄剤は発汗によって表の邪を除く。かぜの初期（太陽病期）に短期間、温かくして服用し、発汗して改善したら中止する。漫然とした長期服用は副作用（動悸・甘草の偽アルドステロン症など）のもと。","level":1},
{"cat":"副作用・注意","sub":"服薬指導","type":"single","q":"麻黄湯でかぜを治療するときの服用方法として最も適切なのはどれか。","choices":["白湯に溶かすなどして温かくして服用し、体を温めて軽く汗をかかせる","冷たい水で服用し、薄着で過ごす","食事と一緒にアルコールで服用する","服用後すぐに激しい運動をして汗を出す","汗が出なくなるまで冷房の効いた部屋で過ごす"],"answer":[0],"exp":"発汗療法では温服し、布団などで体を温めて（温覆）、じんわり汗をかかせる。大量の汗を流させるのは過汗で、体力を消耗する。","level":1},
{"cat":"副作用・注意","sub":"服薬指導","type":"multi","q":"麻黄剤を服用中の患者に、服用を中止して医師・薬剤師に相談するよう伝えるべき症状をすべて選べ。","choices":["手足のむくみ・脱力感","眠れない・興奮する","動悸・頻脈","汗が少し出て熱が下がった","くしゃみが減った","排尿しにくい"],"answer":[0,1,2,5],"exp":"動悸・頻脈・不眠・興奮（麻黄）、排尿困難（麻黄）、むくみ・脱力感（甘草の偽アルドステロン症・ミオパチー）は副作用のサイン。発汗・解熱はかぜに対する効果で、服用終了の目安。","level":2},
{"cat":"副作用・注意","sub":"服薬指導","type":"tf","q":"麻黄剤は就寝直前に服用すると、エフェドリンの作用で眠れなくなることがある。","choices":["正しい","誤り"],"answer":[0],"exp":"エフェドリンの中枢興奮作用による不眠は麻黄の代表的な副作用。","level":1},
{"cat":"副作用・注意","sub":"服薬指導","type":"tf","q":"高齢者は一般に生理機能が低下しているため、麻黄剤は減量するなど注意して投与する。","choices":["正しい","誤り"],"answer":[0],"exp":"高齢者では動悸・血圧上昇・排尿障害など麻黄の副作用、甘草による偽アルドステロン症が現れやすい。減量などに注意する。","level":2},
{"cat":"副作用・注意","sub":"服薬指導","type":"single","q":"高血圧と狭心症の既往がある65歳男性が「かぜをひいたので、いつもの葛根湯を飲みたい」と言う。薬剤師の対応として最も適切なのはどれか。","choices":["麻黄による血圧上昇・動悸のおそれを説明し、医師に相談のうえ症状を観察しながら慎重に使用するよう伝える","降圧薬を中止して葛根湯を飲むよう伝える","葛根湯は生薬なので安全であり、倍量で飲んでよいと伝える","長期間服用すれば血圧が下がると伝える","麻黄湯に変更すれば安全だと伝える"],"answer":[0],"exp":"循環器系障害・重症高血圧は麻黄含有製剤で慎重投与。麻黄湯は麻黄量がさらに多い（5g）。生薬だから安全という説明は誤り。","level":2},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"single","q":"「麻黄剤」の説明として最も適切なのはどれか。","choices":["人参を含み補気を目的とする処方群","桂皮を主薬とし麻黄を含まない処方群","大黄を含み瀉下を目的とする処方群","麻黄を含み、その作用（発汗・鎮咳平喘・利水など）を中心とする処方群","柴胡を含み胸脇苦満を目標とする処方群"],"answer":[3],"exp":"麻黄剤＝麻黄を含む処方群。麻黄の発汗（解表）・鎮咳平喘・利水・鎮痛作用を、組み合わせる生薬（桂皮・杏仁・石膏・朮・附子など）で方向づける。柴胡剤は柴胡、桂枝湯類は桂皮が中心。","level":1},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"single","q":"麻黄剤（葛根湯・麻黄湯など）が主に対応する、急性熱性病の初期の病期（六病位）はどれか。","choices":["太陽病","太陰病","厥陰病","陽明病","少陽病"],"answer":[0],"exp":"太陽病＝病邪が表（体表）にある初期。「脈浮、頭項強痛して悪寒す」。治法は発汗（汗法）。少陽病は柴胡剤（和解）、陽明病は瀉下・清熱。","level":1},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"single","q":"太陽病の治療原則（治法）として正しいのはどれか。","choices":["補血する（補法）","和解する（和法）","瀉下させて裏の熱を除く（下法）","発汗させて表の邪を除く（汗法）","嘔吐させる（吐法）"],"answer":[3],"exp":"太陽病＝表証。麻黄剤・桂枝湯で発汗し、表の邪を追い出す。少陽病は和法（柴胡剤）、陽明病は下法（承気湯類）。","level":1},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"single","q":"葛根湯や麻黄湯が適する「証」の組合せとして最も適切なのはどれか。","choices":["裏・熱・実","表・熱・虚","表・寒・実","裏・寒・虚","半表半裏・熱・実"],"answer":[2],"exp":"悪寒・発熱・無汗・脈浮緊の太陽病実証＝表寒実証。発汗で邪を除く。桂枝湯は表寒虚証（自汗・脈浮弱）。","level":2},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"tf","q":"太陽病の提綱は「太陽の病たる、脈浮、頭項強痛して悪寒す」である。","choices":["正しい","誤り"],"answer":[0],"exp":"『傷寒論』太陽病の提綱。脈浮・頭痛・項のこわばり・悪寒が表証のサイン。","level":1},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"tf","q":"汗法（発汗療法）は、自汗のある虚証の患者にこそ積極的に用いるべきである。","choices":["正しい","誤り"],"answer":[1],"exp":"誤り。体力の衰えた虚証や、すでに汗が出ている者に強い発汗剤（麻黄湯・葛根湯）を用いると、さらに体液・体力を失う。自汗の虚証には麻黄を含まない桂枝湯を用いる。","level":1},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"single","q":"少陰病の提綱「少陰の病たる、脈微細、但寝んと欲す」に基づく病態に用いる麻黄剤はどれか。","choices":["麻黄附子細辛湯","麻杏甘石湯","麻黄湯","越婢加朮湯","葛根湯"],"answer":[0],"exp":"少陰病＝体力が衰え、熱感に乏しく、悪寒・倦怠が強く、寝ていたい、脈沈細（微細）。『傷寒論』「少陰病、始めて之を得て、反って発熱し、脈沈の者は麻黄附子細辛湯之を主る」。","level":2},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"input","q":"麻黄附子細辛湯が対応する六病位を漢字で答えよ。","choices":[],"answer":["少陰病","しょういんびょう","少陰"],"exp":"麻黄附子細辛湯＝少陰病（直中の少陰、高齢者・虚弱者のかぜ）。太陽病の麻黄湯と対比して覚える。","level":2},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"input","q":"太陽病に対して発汗により邪を除く治療法を何というか。漢字2文字で答えよ。","choices":[],"answer":["汗法","かんぽう"],"exp":"汗法（発汗療法）。下法（瀉下）、吐法、和法と並ぶ治療法の一つ。","level":1},

{"cat":"麻黄剤の総論","sub":"麻黄という生薬","type":"tf","q":"麻黄の作用は、一緒に配合される生薬によって方向づけられ、桂皮と組めば発汗、石膏と組めば清熱（止汗）、杏仁と組めば鎮咳平喘、朮と組めば利水に働く。","choices":["正しい","誤り"],"answer":[0],"exp":"麻黄剤を覚えるコツ。麻黄＋桂皮（麻黄湯・葛根湯・小青竜湯）、麻黄＋石膏（麻杏甘石湯・五虎湯・越婢加朮湯）、麻黄＋杏仁（麻黄湯・麻杏甘石湯など）、麻黄＋朮（越婢加朮湯・薏苡仁湯）、麻黄＋附子・細辛（麻黄附子細辛湯）。","level":2},

{"cat":"麻黄剤の総論","sub":"出典・成り立ち","type":"single","q":"麻杏甘石湯の『傷寒論』条文の要点として最も適切なのはどれか。","choices":["汗が出ず、身体疼痛し、喘する者","項背強ばり、汗なく悪風する者","心下に水気があり、咳する者","脈沈で、反って発熱する者","汗が出て喘し、大熱のない者"],"answer":[4],"exp":"麻杏甘石湯：「汗出でて喘し、大熱なき者」。汗が出ていても使えるのは石膏のため。「無汗・身疼痛・喘」は麻黄湯、「項背強・無汗悪風」は葛根湯、「脈沈・反発熱」は麻黄附子細辛湯、「心下有水気」は小青竜湯。","level":3},
{"cat":"麻黄剤の総論","sub":"麻黄剤の定義と太陽病","type":"tf","q":"麻黄湯は、桂枝湯から芍薬・大棗・生姜を除き、麻黄・杏仁を加えた構成とみることができる。","choices":["正しい","誤り"],"answer":[0],"exp":"桂枝湯（桂皮・芍薬・大棗・甘草・生姜）－芍薬・大棗・生姜＋麻黄・杏仁＝麻黄湯（麻黄・杏仁・桂皮・甘草）。芍薬を含まず麻黄＋桂皮が主体なので、桂枝湯よりはるかに発汗作用が強い。","level":2},

{"cat":"葛根湯","sub":"効能","type":"single","q":"ツムラ葛根湯の効能・効果の前文「（　）がなく頭痛、発熱、悪寒、肩こり等を伴う比較的体力のあるもの」の空欄に入るのはどれか。","choices":["自然発汗","口渇","食欲","咳嗽","浮腫"],"answer":[0],"exp":"「自然発汗がなく」＝無汗が葛根湯の大前提。汗が自然に出ている（自汗）なら桂枝湯の適応となる。","level":1},

{"cat":"葛根湯","sub":"出典・由来","type":"single","q":"『傷寒論』の条文「太陽病、項背強ること几几、汗無く悪風するは、（　）之を主る」の空欄に入る処方はどれか。","choices":["葛根湯","桂枝湯","麻黄湯","小青竜湯","麻黄附子細辛湯"],"answer":[0],"exp":"「項背強」＝首すじのこわばり、「汗無く」＝無汗。この2つが葛根湯のキーワード。汗が出ていれば桂枝加葛根湯となる。","level":3},
