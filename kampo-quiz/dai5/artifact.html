{"cat":"スライドの症例","sub":"柴胡桂枝湯が正解","type":"single","q":"24歳女性。かぜの経過中で、発熱と悪寒、頭痛に加えて、食欲不振と悪心を訴えており、体力はやや低下している。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[2],"exp":"正解は柴胡桂枝湯。p16 症例1。小柴胡湯の症状（食欲不振、悪心）に表証（発熱、悪寒、頭痛）が加わっており、体力はやや低下している。まとめ「小柴胡湯＋表証（発熱、悪寒、頭痛）→柴胡桂枝湯」（p19）。表証があるので小柴胡湯ではなく柴胡桂枝湯。柴胡桂枝湯はかぜの中期から後期に用い、やや虚弱な人に用いることが多い（p7）。","level":1},
{"cat":"スライドの症例","sub":"半夏瀉心湯が正解","type":"single","q":"30歳男性。胃もたれ、腹鳴、軟便を繰り返している。冷たいものを好み、最近では口内炎もできやすい。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[4],"exp":"正解は半夏瀉心湯。p17 症例2。胃もたれ・腹鳴・軟便はまとめの「胃腸症状（胃もたれ、腹鳴、軟便）→半夏瀉心湯」そのもの（p19）。腹鳴が目安（p12）、口内炎は適応疾患（p12）、冷たいものは図「体調が悪いときに冷たいものを食べ過ぎた」（p13）に対応。黄連解毒湯は熱証（顔面紅潮、イライラ）が目安で胃腸症状中心ではない。","level":1},
{"cat":"スライドの症例","sub":"小柴胡湯が正解","type":"single","q":"52歳男性。2週前にかぜをひき、発熱は軽快したが、食欲不振、悪心が続いている。診察では胸脇苦満が認められた。やや虚弱である。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[3],"exp":"正解は小柴胡湯。p18 症例3。長引くかぜ（2週前）、食欲不振、悪心、胸脇苦満はまとめの小柴胡湯の語句そのもの（p19）。やや虚弱である場合に適応が多い（p2）。発熱は軽快して表証がないので柴胡桂枝湯ではない。半夏瀉心湯は腹鳴・軟便が目安で胸脇苦満は決め手にならない。","level":1},

{"cat":"症例","sub":"小柴胡湯が正解","type":"single","q":"45歳女性。10日前にかぜをひき、熱は下がったが食欲がなく、ときどき吐き気がする。口の中がねばつき、苦い感じがある。体力はやや低下している。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[3],"exp":"正解は小柴胡湯。決め手：長引くかぜ（10日）、食欲不振、悪心、口中のねばりや苦い感じ、やや虚弱。発熱が下がり表証はない。小柴胡湯は長引いているかぜ／肝炎、腎炎、肺炎に用い、食欲不振、悪心、口中のねばりや苦い感じ、胸脇苦満が目安で、体力はあまり選ばないがやや虚弱である場合に適応が多い（p2, p3, p19）。慢性の気管支炎や肝炎では長期投与になることが多い（p2）。発熱・悪寒・頭痛などの表証が残っていれば柴胡桂枝湯、実証・便秘があれば大柴胡湯、不安・不眠・動悸が加われば柴胡加竜骨牡蛎湯（p19）。半夏瀉心湯も悪心に用いるが、腹鳴・軟便・みぞおちのつかえが目安（p12, p13）。黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p19）。","level":1},

{"cat":"症例","sub":"小柴胡湯が正解","type":"single","q":"60歳男性。慢性肝炎で通院中。ふだんからやや疲れやすく、食欲不振と口の苦さを訴える。腹診で胸脇苦満を認める。今後、長期の服用を予定している。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[3],"exp":"正解は小柴胡湯。決め手：肝炎、慢性の肝炎で長期投与、食欲不振、口中の苦い感じ、胸脇苦満、やや虚弱。小柴胡湯は慢性の気管支炎や肝炎に使用するときには長期投与になることが多い（p2）。　小柴胡湯は長引いているかぜ／肝炎、腎炎、肺炎に用い、食欲不振、悪心、口中のねばりや苦い感じ、胸脇苦満が目安で、体力はあまり選ばないがやや虚弱である場合に適応が多い（p2, p3, p19）。慢性の気管支炎や肝炎では長期投与になることが多い（p2）。発熱・悪寒・頭痛などの表証が残っていれば柴胡桂枝湯、実証・便秘があれば大柴胡湯、不安・不眠・動悸が加われば柴胡加竜骨牡蛎湯（p19）。半夏瀉心湯も悪心に用いるが、腹鳴・軟便・みぞおちのつかえが目安（p12, p13）。黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p19）。","level":2},

{"cat":"症例","sub":"小柴胡湯が正解","type":"single","q":"55歳男性。肺炎の回復期。発熱は軽快したが、食欲不振、悪心、口の中の苦い感じが残っている。腹診で胸脇苦満を認める。便通は毎日あり、体格はやや細めで疲れやすい。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","大柴胡湯"],"answer":[3],"exp":"正解は小柴胡湯。決め手：肺炎、食欲不振、悪心、口中の苦い感じ、胸脇苦満、やや虚弱。便秘がなく実証でもない。選択肢の大柴胡湯は実証で便秘傾向のある人に用いる（p5）ので、便通が毎日あり、やや虚弱なこの患者には合わない。　小柴胡湯は長引いているかぜ／肝炎、腎炎、肺炎に用い、食欲不振、悪心、口中のねばりや苦い感じ、胸脇苦満が目安で、体力はあまり選ばないがやや虚弱である場合に適応が多い（p2, p3, p19）。慢性の気管支炎や肝炎では長期投与になることが多い（p2）。発熱・悪寒・頭痛などの表証が残っていれば柴胡桂枝湯、実証・便秘があれば大柴胡湯、不安・不眠・動悸が加われば柴胡加竜骨牡蛎湯（p19）。半夏瀉心湯も悪心に用いるが、腹鳴・軟便・みぞおちのつかえが目安（p12, p13）。黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p19）。","level":2},

{"cat":"症例","sub":"小柴胡湯が正解","type":"single","q":"48歳男性、営業職。かぜをひいて2週間、熱は下がったが食欲が戻らず、ときに吐き気がする。みぞおちから季肋部にかけてつかえ感と圧痛がある。中肉中背でやや疲れやすく、便通は毎日ある。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","大柴胡湯","半夏瀉心湯"],"answer":[2],"exp":"正解は小柴胡湯。決め手：長引くかぜ、食欲不振、悪心、胸脇苦満、やや虚弱。便秘がない。大柴胡湯と小柴胡湯はいずれも胸脇苦満に用いるが、大柴胡湯はさらに実証で便秘傾向のある人（p5）。便通が毎日あり疲れやすいので小柴胡湯。　小柴胡湯は長引いているかぜ／肝炎、腎炎、肺炎に用い、食欲不振、悪心、口中のねばりや苦い感じ、胸脇苦満が目安で、体力はあまり選ばないがやや虚弱である場合に適応が多い（p2, p3, p19）。慢性の気管支炎や肝炎では長期投与になることが多い（p2）。発熱・悪寒・頭痛などの表証が残っていれば柴胡桂枝湯、実証・便秘があれば大柴胡湯、不安・不眠・動悸が加われば柴胡加竜骨牡蛎湯（p19）。半夏瀉心湯も悪心に用いるが、腹鳴・軟便・みぞおちのつかえが目安（p12, p13）。黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p19）。","level":3},

{"cat":"症例","sub":"小柴胡湯が正解","type":"single","q":"58歳女性。慢性肝炎の治療中で、長期にわたり服用できる柴胡剤を検討している。疲労感、食欲不振、口中の苦い感じがあり、胸脇苦満を認める。発熱・悪寒・頭痛などのかぜ症状はない。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[3],"exp":"正解は小柴胡湯。決め手：肝炎（慢性で長期投与）、疲労感、食欲不振、口中の苦い感じ、胸脇苦満。図（p3）では黄芩が「胆・肝が発熱」を冷まし肝炎に、人参・甘草が「気の産生が低下」を補い疲労感に対応する。　小柴胡湯は長引いているかぜ／肝炎、腎炎、肺炎に用い、食欲不振、悪心、口中のねばりや苦い感じ、胸脇苦満が目安で、体力はあまり選ばないがやや虚弱である場合に適応が多い（p2, p3, p19）。慢性の気管支炎や肝炎では長期投与になることが多い（p2）。発熱・悪寒・頭痛などの表証が残っていれば柴胡桂枝湯、実証・便秘があれば大柴胡湯、不安・不眠・動悸が加われば柴胡加竜骨牡蛎湯（p19）。半夏瀉心湯も悪心に用いるが、腹鳴・軟便・みぞおちのつかえが目安（p12, p13）。黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p19）。","level":2},
{"cat":"症例","sub":"小柴胡湯が正解","type":"single","q":"36歳男性。かぜの発症から約1〜2週経った。発熱は軽快し、頭痛や悪寒もない。食欲不振、悪心があり、胸脇苦満を認める。動悸・不眠・精神不安はない。やや虚弱である。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[3],"exp":"正解は小柴胡湯。決め手：発症から1〜2週の長引くかぜ、食欲不振、悪心、胸脇苦満、やや虚弱。表証も不安・不眠・動悸もない。小柴胡湯は長引いているかぜ／肝炎、腎炎、肺炎に用い、食欲不振、悪心、口中のねばりや苦い感じ、胸脇苦満が目安で、体力はあまり選ばないがやや虚弱である場合に適応が多い（p2, p3, p19）。慢性の気管支炎や肝炎では長期投与になることが多い（p2）。発熱・悪寒・頭痛などの表証が残っていれば柴胡桂枝湯、実証・便秘があれば大柴胡湯、不安・不眠・動悸が加われば柴胡加竜骨牡蛎湯（p19）。半夏瀉心湯も悪心に用いるが、腹鳴・軟便・みぞおちのつかえが目安（p12, p13）。黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p19）。","level":2},
{"cat":"症例","sub":"小柴胡湯が正解","type":"single","q":"75歳女性。かぜが長引いて2週間になる。食欲不振、悪心、口の中の苦い感じがあり、胸脇苦満を認める。もともと体力がない。腹鳴や軟便はなく、冷たいものを食べ過ぎたこともない。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[3],"exp":"正解は小柴胡湯。決め手：長引くかぜ、食欲不振、悪心、口中の苦い感じ、胸脇苦満、やや虚弱。腹鳴・軟便がないので半夏瀉心湯ではない。小柴胡湯は長引いているかぜ／肝炎、腎炎、肺炎に用い、食欲不振、悪心、口中のねばりや苦い感じ、胸脇苦満が目安で、体力はあまり選ばないがやや虚弱である場合に適応が多い（p2, p3, p19）。慢性の気管支炎や肝炎では長期投与になることが多い（p2）。発熱・悪寒・頭痛などの表証が残っていれば柴胡桂枝湯、実証・便秘があれば大柴胡湯、不安・不眠・動悸が加われば柴胡加竜骨牡蛎湯（p19）。半夏瀉心湯も悪心に用いるが、腹鳴・軟便・みぞおちのつかえが目安（p12, p13）。黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p19）。","level":3},
{"cat":"症例","sub":"大柴胡湯が正解","type":"single","q":"50歳男性、会社役員。がっしりした体格で体力が充実している（実証）。高血圧があり、肩こりと頭痛、便秘を訴える。腹診で胸脇苦満を認める。顔面紅潮やイライラは目立たない。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","小柴胡湯","大柴胡湯","半夏瀉心湯"],"answer":[3],"exp":"正解は大柴胡湯。決め手：実証、高血圧にともなう肩こり・頭痛・便秘、胸脇苦満。熱証（顔面紅潮・イライラ）がない。大柴胡湯は小柴胡湯に類似するが、さらに実証（人参・甘草が配合されていない）で便秘傾向のある人に用いる（p5）。適応疾患は高血圧、高血圧や肥満にともなう肩こり・頭痛・便秘／胃炎／肥満症（p5）。図でも柴胡→胸脇苦満、大黄→便秘（p6）。まとめ「小柴胡湯＋実証、便秘→大柴胡湯」（p19）。小柴胡湯はやや虚弱な場合に適応が多く（p2）、柴胡加竜骨牡蛎湯はストレスと精神不安が鍵（p9）、黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p14, p19）。","level":1},
{"cat":"症例","sub":"大柴胡湯が正解","type":"single","q":"45歳男性。肥満症で減量中。便秘傾向で、肩こりがひどい。体力は充実しており、腹診で胸脇苦満が強い。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","大柴胡湯"],"answer":[4],"exp":"正解は大柴胡湯。決め手：肥満症、肥満にともなう肩こり・便秘、実証、胸脇苦満。肥満に対して使用するときには適応に注意する（p5）。　大柴胡湯は小柴胡湯に類似するが、さらに実証（人参・甘草が配合されていない）で便秘傾向のある人に用いる（p5）。適応疾患は高血圧、高血圧や肥満にともなう肩こり・頭痛・便秘／胃炎／肥満症（p5）。図でも柴胡→胸脇苦満、大黄→便秘（p6）。まとめ「小柴胡湯＋実証、便秘→大柴胡湯」（p19）。小柴胡湯はやや虚弱な場合に適応が多く（p2）、柴胡加竜骨牡蛎湯はストレスと精神不安が鍵（p9）、黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p14, p19）。","level":1},

{"cat":"症例","sub":"大柴胡湯が正解","type":"single","q":"55歳男性。胃炎を繰り返している。体格がよく実証で、便秘傾向がある。季肋部に張り感と圧痛（胸脇苦満）を認める。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","小柴胡湯","大柴胡湯","半夏瀉心湯"],"answer":[3],"exp":"正解は大柴胡湯。決め手：胃炎、実証、便秘傾向、胸脇苦満。大柴胡湯は小柴胡湯に類似するが、さらに実証（人参・甘草が配合されていない）で便秘傾向のある人に用いる（p5）。適応疾患は高血圧、高血圧や肥満にともなう肩こり・頭痛・便秘／胃炎／肥満症（p5）。図でも柴胡→胸脇苦満、大黄→便秘（p6）。まとめ「小柴胡湯＋実証、便秘→大柴胡湯」（p19）。小柴胡湯はやや虚弱な場合に適応が多く（p2）、柴胡加竜骨牡蛎湯はストレスと精神不安が鍵（p9）、黄連解毒湯は顔面紅潮・イライラなどの熱証が目安（p14, p19）。","level":2},

{"cat":"症例","sub":"柴胡桂枝湯が正解","type":"single","q":"30歳女性。かぜをひいて5日目。まだ微熱と悪寒、頭痛が残っているが、食欲が落ちて吐き気もある。やや虚弱である。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[2],"exp":"正解は柴胡桂枝湯。決め手：表証（発熱、悪寒、頭痛）＋食欲不振・悪心、やや虚弱。柴胡桂枝湯は小柴胡湯と桂枝湯の合方で、かぜの中期から後期／胃腸炎に用い、やや虚弱な人に用いることが多い（p7）。図では悪寒・発熱（桂皮・生姜）、頭痛・筋肉痛・関節痛（芍薬・甘草）、悪心・食欲不振、胸脇苦満（p8）。まとめ「小柴胡湯＋表証（発熱、悪寒、頭痛）→柴胡桂枝湯」（p19）。表証が消えて食欲不振・悪心・胸脇苦満だけが残っていれば小柴胡湯（p18, p19）。","level":1},

{"cat":"症例","sub":"柴胡桂枝湯が正解","type":"single","q":"24歳女性、保育士。かぜで寒気と発熱が続き、頭痛もある。食欲がなく悪心がある。顔面紅潮やイライラはない。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[2],"exp":"正解は柴胡桂枝湯。決め手：表証（発熱、悪寒、頭痛）＋食欲不振・悪心。熱証がないので黄連解毒湯ではない。柴胡桂枝湯は小柴胡湯と桂枝湯の合方で、かぜの中期から後期／胃腸炎に用い、やや虚弱な人に用いることが多い（p7）。図では悪寒・発熱（桂皮・生姜）、頭痛・筋肉痛・関節痛（芍薬・甘草）、悪心・食欲不振、胸脇苦満（p8）。まとめ「小柴胡湯＋表証（発熱、悪寒、頭痛）→柴胡桂枝湯」（p19）。表証が消えて食欲不振・悪心・胸脇苦満だけが残っていれば小柴胡湯（p18, p19）。","level":1},
{"cat":"症例","sub":"柴胡加竜骨牡蛎湯が正解","type":"single","q":"42歳男性、管理職。仕事のストレスが強く、精神不安、不眠、動悸を訴える。比較的体力がある。腹診で胸脇苦満を認める。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[1],"exp":"正解は柴胡加竜骨牡蛎湯。決め手：ストレス、精神不安、不眠、動悸、比較的体力がある、胸脇苦満。柴胡加竜骨牡蛎湯は精神不安がある動悸、不眠、高血圧などに用い、ストレスと精神不安が処方意図を読む鍵で、比較的体力がある人に用いることが多い（p9）。図「ストレスを感じているときにかぜをこじらせた」では高血圧・心悸亢進・精神不安・不眠・神経症（p10）。まとめ「小柴胡湯＋不安、不眠、動悸→柴胡加竜骨牡蛎湯」（p19）。黄連解毒湯も不眠・高血圧に用いるが、顔面紅潮・イライラ・のぼせなどの熱証や出血・皮膚炎が目安で体力がしっかりとある場合（p14, p15, p19）。半夏瀉心湯の不眠は腹鳴・軟便など胃腸症状をともなう（p12）。","level":1},

{"cat":"症例","sub":"半夏瀉心湯が正解","type":"single","q":"34歳女性。胃もたれと腹鳴、軟便が続いている。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[4],"exp":"正解は半夏瀉心湯。決め手：胃腸症状（胃もたれ、腹鳴、軟便）。半夏瀉心湯は急・慢性胃腸炎、胃下垂、神経性胃炎／口内炎／精神不安、不眠症／イリノテカンの遅延性下痢（副作用軽減）に用い、消化器の不調に広く使用されるが腹鳴が目安。腹部は冷えているが精神不安、不眠などの精神神経症状をともなう（p12）。図「体調が悪いときに冷たいものを食べ過ぎた」：みぞおちのつかえ、口内炎、悪心・嘔吐・げっぷ、食欲不振、軟便・下痢（p13）。まとめ「胃腸症状（胃もたれ、腹鳴、軟便）→半夏瀉心湯」（p19）。小柴胡湯も悪心に用いるが、長引くかぜと胸脇苦満が目安（p2, p19）。","level":1},

{"cat":"症例","sub":"黄連解毒湯が正解","type":"single","q":"50歳男性。顔面紅潮があり、イライラしやすく、のぼせを訴える。高血圧を指摘されている。体力がしっかりとある。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[0],"exp":"正解は黄連解毒湯。決め手：熱証（顔面紅潮、イライラ）、のぼせ、高血圧（イライラしやすい人）、体力がしっかりとある。黄連解毒湯は炎症や痒みの強い皮膚炎／胃炎／高血圧／出血性疾患／不眠症、神経症に用い、およそ炎症と出血を抑える処方で、体力がしっかりとある場合に使用され、高血圧はイライラしやすい人が対象であることが多い（p14）。図ではのぼせ・各種出血・心悸亢進・高血圧、皮膚炎・皮膚掻痒感、不眠症・神経症（p15）。まとめ「熱証（顔面紅潮、イライラ）→黄連解毒湯」（p19）。柴胡加竜骨牡蛎湯はストレスと精神不安・動悸が鍵（p9）、大柴胡湯は実証・便秘・胸脇苦満が目安（p5）。","level":1},

{"cat":"症例","sub":"黄連解毒湯が正解","type":"single","q":"40歳男性。胃炎で嘔吐することがある。顔面紅潮とイライラがあり、体力はしっかりとある。腹鳴や軟便はない。この患者に最も適した漢方薬はどれか。1つ選べ。","choices":["黄連解毒湯","柴胡加竜骨牡蛎湯","柴胡桂枝湯","小柴胡湯","半夏瀉心湯"],"answer":[0],"exp":"正解は黄連解毒湯。決め手：胃炎・嘔吐、熱証（顔面紅潮、イライラ）、体力がしっかりとある。図（p15）「胃に熱がおよぶ」→胃炎・嘔吐。半夏瀉心湯は腹鳴・軟便が目安（p12）。　黄連解毒湯は炎症や痒みの強い皮膚炎／胃炎／高血圧／出血性疾患／不眠症、神経症に用い、およそ炎症と出血を抑える処方で、体力がしっかりとある場合に使用され、高血圧はイライラしやすい人が対象であることが多い（p14）。図ではのぼせ・各種出血・心悸亢進・高血圧、皮膚炎・皮膚掻痒感、不眠症・神経症（p15）。まとめ「熱証（顔面紅潮、イライラ）→黄連解毒湯」（p19）。柴胡加竜骨牡蛎湯はストレスと精神不安・動悸が鍵（p9）、大柴胡湯は実証・便秘・胸脇苦満が目安（p5）。","level":3},
{"cat":"症例","sub":"柴胡加竜骨牡蛎湯の製剤選択","type":"single","q":"32歳女性、妊娠中。仕事のストレスで精神不安、不眠、動悸がある。比較的体力がある。柴胡加竜骨牡蛎湯を用いる場合、製剤選択として正しいのはどれか。1つ選べ。","choices":["大黄が配合されていない製剤を選択する","竜骨・牡蛎が配合されていない製剤を選択する","人参が配合されていない製剤を選択する","茯苓が配合されていない製剤を選択する","桂皮が配合されていない製剤を選択する"],"answer":[0],"exp":"柴胡加竜骨牡蛎湯の構成生薬は柴胡、黄芩、半夏、人参、生姜、大棗、桂皮、茯苓、竜骨、牡蛎、（大黄）で、大黄は括弧付き。選択のポイント「下痢がみられる場合や妊娠中の女性は大黄が配合されていない製剤を選択する」（p9）。","level":2},

  const ALIAS = { "桂皮": ["桂枝", "けいし", "ケイシ"], "蒼朮": ["朮", "白朮"], "生姜": ["しょうが", "ショウガ"], "牡蛎": ["牡蠣"], "竜骨": ["龍骨"], "釣藤鈎": ["釣藤鉤", "釣藤"], "栝楼根": ["瓜呂根"] };

  // ---------- 小道具 ----------
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rnd(a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sample = (a, n) => shuffle(a).slice(0, n);
  const herbsOf = (f) => Object.keys(f.herbs);
  const uniq = (a) => [...new Set(a)];
  const catOf = (f) => f.cat || GROUP_CAT[f.group];
  const groupOf = (g) => F.filter((f) => f.group === g);
  const ALL_HERBS = Object.keys(R);

  // 五十音順の比較（濁点・半濁点を外して比べ、同じなら清音を先に）
  const seion = (s) => s.normalize("NFD").replace(/[゙゚]/g, "").normalize("NFC");
  const gojuon = (a, b) => {
    const x = seion(R[a]), y = seion(R[b]);
    if (x !== y) return x < y ? -1 : 1;
    return R[a] < R[b] ? -1 : 1;
  };
  const sortedHerbs = (f) => herbsOf(f).sort(gojuon);

  // 回答の正規化：空白除去・全角数字→半角・カタカナ→ひらがな
  function norm(s) {
    return String(s).trim().replace(/[\s　、,。．.]/g, "")
      .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
      .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
      .replace(/種類?$|種$|つ$|個$/, "");
  }
  function herbAnswers(h) { return [h, R[h], ...(ALIAS[h] || [])]; }

  function compText(f) {
    return sortedHerbs(f).map((h) => `${h}(${R[h]})` + (f.herbs[h] != null ? ` ${f.herbs[h]}g` : "")).join("、");
  }
  function compNote(f) {
    return `【${f.name}（${f.yomi}）】${herbsOf(f).length}種：${compText(f)}${window.AMOUNT_NOTE || "（五十音順・ツムラ1日量）"}` + (f.optNote ? `\n※${f.optNote}` : "");
  }

  // ひっかけ用の生薬：同グループの処方に出てくる生薬を優先
  function distractHerbs(exclude, group, n) {
    const ex = new Set(exclude);
    const near = uniq(groupOf(group).flatMap(herbsOf)).filter((h) => !ex.has(h));
    const far = ALL_HERBS.filter((h) => !ex.has(h) && !near.includes(h));
    const a = sample(near, Math.min(n, Math.ceil(n * 0.7), near.length));
    return a.concat(sample(far, n - a.length));
  }

  // ---------- 自動生成問題の型 ----------
  // 各テンプレートは make() を呼ぶたびに新しい選択肢で問題を作る
  const T = [];
  // 記述式は出さない：自動生成の問題で答えが1語のものは、5択の選択問題に変えて出す
  // pool：ひっかけ選択肢の候補（同じ処方の生薬など）。数字は近い数を並べる
  function toChoice(q) {
    const right = q.answer[0], ok = new Set(q.answer.map(norm));
    let cands;
    if (/^\d+$/.test(right)) {
      const n = +right;
      cands = [n - 2, n - 1, n + 1, n + 2, n + 3, n - 3].filter((x) => x > 0).map(String);
    } else cands = q.pool || []; // pool は「同じ処方の生薬（シャッフル済み）→ 補う生薬」の順
    const wrong = uniq(cands).filter((c) => !ok.has(norm(c)) && !q.q.includes(c)).slice(0, 4);
    if (wrong.length < 3) return null;
    const ch = shuffle([right, ...wrong]);
    if (/^\d+$/.test(right)) ch.sort((a, b) => a - b);
    const { pool, ...rest } = q;
    return Object.assign(rest, { type: "single", q: q.q.replace(/数字で答えなさい。|答えなさい。$/, "1つ選べ。"), choices: ch, answer: [ch.indexOf(right)] });
  }
  function add(id, cat, sub, level, make) {
    T.push({ id, cat, sub, level, gen: true, make: () => { const q = make(); return q && q.type === "input" ? toChoice(q) : q; } });
  }

  for (const f of F) {
    const cat = catOf(f);
    const hs = herbsOf(f);

    add(`g:all:${f.name}`, cat, "構成生薬（すべて選べ）", 1, () => {
      const total = Math.min(12, Math.max(8, hs.length + 4));
      const ch = shuffle(hs.concat(distractHerbs(hs, f.group, total - hs.length)));
      return { type: "multi", q: `${f.name}の構成生薬をすべて選べ。`, choices: ch, answer: ch.map((h, i) => (hs.includes(h) ? i : -1)).filter((i) => i >= 0), exp: compNote(f), formula: f.name };
    });

    // opt：製剤によって入らない生薬（例：柴胡加竜骨牡蛎湯の大黄）。その分を除いた数も正解にする
    add(`g:count:${f.name}`, cat, "構成生薬数", 1, () => ({
      type: "input", q: `${f.name}の構成生薬は何種類か。数字で答えなさい。`, answer: [String(hs.length), ...(f.opt ? [String(hs.length - f.opt.length)] : [])], exp: compNote(f) + (f.opt ? `\n（${f.opt.join("・")}を除いた${hs.length - f.opt.length}種の製剤もある）` : ""), formula: f.name,
    }));

    if (hs.length >= 3 && !f.opt) add(`g:goju:${f.name}`, cat, "五十音順", 2, () => {
      const s = sortedHerbs(f), n = 1 + rnd(s.length), h = s[n - 1];
      return { type: "input", q: `${f.name}の構成生薬のうち、五十音順で${n}番目にくる生薬を答えなさい。`, answer: herbAnswers(h), pool: shuffle(s.filter((x) => x !== h)).concat(distractHerbs(hs, f.group, 4)),
        exp: `五十音順：${s.map((x, i) => `${i + 1}.${x}(${R[x]})`).join(" → ")}`, formula: f.name };
    });

    if (hs.length >= 4) add(`g:not:${f.name}`, cat, "構成生薬でないもの", 1, () => {
      const right = sample(hs, 4), wrong = distractHerbs(hs, f.group, 1)[0];
      const ch = shuffle(right.concat(wrong));
      return { type: "single", q: `${f.name}の構成生薬に含まれないのはどれか。1つ選べ。`, choices: ch, answer: [ch.indexOf(wrong)], exp: `${wrong}は含まれない。` + compNote(f), formula: f.name };
    });

    add(`g:which:${f.name}`, cat, "構成から処方名", 2, () => {
      const others = sample(groupOf(f.group).filter((x) => x !== f), 4);
      const ch = shuffle([f, ...others].map((x) => x.name));
      return { type: "single", q: `次の生薬で構成される処方はどれか。1つ選べ。\n${sortedHerbs(f).join("・")}`, choices: ch, answer: [ch.indexOf(f.name)], exp: compNote(f), formula: f.name };
    });

    add(`g:use2f:${f.name}`, cat, "適応→処方", 1, () => {
      const others = sample(groupOf(f.group).filter((x) => x !== f), 4);
      const ch = shuffle([f, ...others].map((x) => x.name));
      return { type: "single", q: `「${f.use}」に最も適した漢方薬はどれか。1つ選べ。`, choices: ch, answer: [ch.indexOf(f.name)],
        exp: `${f.name}：${f.use}\n` + others.map((o) => `・${o.name}：${o.use}`).join("\n"), formula: f.name };
    });

    add(`g:f2use:${f.name}`, cat, "処方→適応", 1, () => {
      const others = sample(groupOf(f.group).filter((x) => x !== f), 4);
      const ch = shuffle([f, ...others].map((x) => x.use));
      return { type: "single", q: `${f.name}の適応として最も適切なのはどれか。1つ選べ。`, choices: ch, answer: [ch.indexOf(f.use)],
        exp: others.map((o) => `・${o.name}：${o.use}`).join("\n"), formula: f.name };
    });

    add(`g:yomi:${f.name}`, cat, "読み方", 1, () => ({
      type: "input", q: `「${f.name}」の読みをひらがなで答えなさい。`, answer: [f.yomi], pool: shuffle(F.filter((x) => x !== f).map((x) => x.yomi)), exp: `${f.name}＝${f.yomi}`, formula: f.name,
    }));

    // 1日量が最も多い生薬（同量1位が複数あるときは出さない）
    const amounts = hs.map((h) => f.herbs[h]), mx = Math.max(...amounts);
    if (amounts.every((a) => a != null) && amounts.filter((a) => a === mx).length === 1) {
      const top = hs.find((h) => f.herbs[h] === mx);
      add(`g:max:${f.name}`, cat, "配合量（重箱の隅）", 3, () => {
        const ch = shuffle([top, ...sample(hs.filter((h) => h !== top), Math.min(4, hs.length - 1))]);
        return { type: "single", q: `${f.name}（ツムラ医療用）で1日量が最も多い生薬はどれか。1つ選べ。`, choices: ch, answer: [ch.indexOf(top)],
          exp: compNote(f) + "\n※配合量はメーカーで異なることがある。", formula: f.name };
      });
    }
  }

  // グループ内で「この処方だけに配合される生薬」（小テスト3 問6型）
  for (const g of Object.keys(GROUP_CAT)) {
    const fs = groupOf(g);
    add(`g:only:${g}`, GROUP_CAT[g], "この処方のみに配合", 2, () => {
      for (let t = 0; t < 30; t++) {
        const set = g === "keishi" ? fs : sample(fs, Math.min(5, fs.length));
        const target = pick(set);
        const others = new Set(set.filter((x) => x !== target).flatMap(herbsOf));
        const only = herbsOf(target).filter((h) => !others.has(h));
        if (!only.length) continue;
        const names = set.map((x) => x.name).join("、");
        const exp = `${target.name}のみ：${only.join("・")}\n` + set.map(compNote).join("\n");
        if (only.length === 1) return { type: "input", q: `${names}の構成生薬のうち、${target.name}のみに配合されている生薬を答えなさい。`, answer: herbAnswers(only[0]), pool: shuffle(uniq(set.flatMap(herbsOf))), exp, formula: target.name };
        const ch = shuffle(uniq(set.flatMap(herbsOf)));
        return { type: "multi", q: `${names}の構成生薬のうち、${target.name}のみに配合されている生薬をすべて選べ。`, choices: ch, answer: only.map((h) => ch.indexOf(h)), exp, formula: target.name };
      }
      return null;
    });

    // 生薬Xを含む処方をすべて選べ
    add(`g:contain:${g}`, GROUP_CAT[g], "生薬を含む処方（すべて選べ）", 2, () => {
      for (let t = 0; t < 30; t++) {
        const set = sample(fs, Math.min(6, fs.length));
        const h = pick(uniq(set.flatMap(herbsOf)));
        const yes = set.filter((x) => h in x.herbs);
        if (!yes.length || yes.length === set.length) continue;
        const ch = set.map((x) => x.name);
        return { type: "multi", q: `次の処方のうち、${h}（${R[h]}）を含むものをすべて選べ。`, choices: ch, answer: yes.map((x) => ch.indexOf(x.name)),
          exp: `${h}を含む：${yes.map((x) => x.name).join("、")}\n含まない：${set.filter((x) => !yes.includes(x)).map((x) => x.name).join("、") || "なし"}` };
      }
      return null;
    });
  }

  // 「B に何を加えた処方か」：構成生薬の集合として B ⊂ A の組
  for (const a of F) for (const b of F) {
    if (a === b) continue;
    const ha = herbsOf(a), hb = herbsOf(b);
    if (hb.length < 3 || !hb.every((h) => ha.includes(h)) || ha.length === hb.length) continue;
    const added = ha.filter((h) => !hb.includes(h));
    if (added.length > 3) continue;
    add(`g:add:${a.name}:${b.name}`, catOf(a), "加味（何を加えたか）", 2, () => {
      if (added.length === 1) return { type: "input", q: `${a.name}の構成生薬を${b.name}と比べたとき、${b.name}にない生薬（加えられている生薬）を答えなさい。`, answer: herbAnswers(added[0]), pool: shuffle(ha).concat(distractHerbs(ha, a.group, 4)), exp: compNote(a) + "\n" + compNote(b), formula: a.name };
      const ch = shuffle(added.concat(distractHerbs(ha, a.group, 6 - added.length)));
      return { type: "multi", q: `${a.name}の構成生薬を${b.name}と比べたとき、${b.name}にない生薬（加えられている生薬）をすべて選べ。`, choices: ch, answer: added.map((h) => ch.indexOf(h)), exp: compNote(a) + "\n" + compNote(b), formula: a.name };
    });
  }

  // 増量（講義で扱う定番の組だけに限定）
  for (const [a, b, h] of [["桂枝加芍薬湯", "桂枝湯", "芍薬"], ["小建中湯", "桂枝湯", "芍薬"]]) {
    if (!BYNAME[a] || !BYNAME[b]) continue;
    add(`g:inc:${a}`, "桂枝湯類", "増量されている生薬", 1, () => ({
      type: "input", q: `${a}で、${b}と比べて増量されている生薬を答えなさい。`, answer: herbAnswers(h), pool: shuffle(herbsOf(BYNAME[a])),
      exp: `${h}：${b} ${BYNAME[b].herbs[h]}g → ${a} ${BYNAME[a].herbs[h]}g（ツムラ1日量）\n` + compNote(BYNAME[a]) + "\n" + compNote(BYNAME[b]), formula: a,
    }));
  }

  // 生薬の読み
  for (const h of uniq(F.flatMap(herbsOf))) add(`g:hyomi:${h}`, "生薬", "読み方", 1, () => ({ type: "input", q: `生薬「${h}」の読みをひらがなで答えなさい。`, answer: [R[h], ...(ALIAS[h] || []).filter((x) => /^[ぁ-ん]+$/.test(x))], pool: shuffle(uniq(F.flatMap(herbsOf)).filter((x) => x !== h).map((x) => R[x])), exp: `${h}＝${R[h]}` }));

  window.KAMPO = { T, norm, shuffle, compNote, BYNAME, GROUP_CAT, sortedHerbs, herbAnswers };
})();

</script>

{"keys":["桂枝湯類","桂枝湯","桂枝加芍薬湯","桂枝加朮附湯","桂枝加竜骨牡蛎湯","小建中湯"],"text":"桂枝湯類は桂枝湯（桂皮・芍薬・大棗・甘草・生姜）への足し算。芍薬増量→桂枝加芍薬湯（腹痛）、その＋膠飴→小建中湯（小児虚弱）、＋朮・附子→桂枝加朮附湯（冷えの関節痛）、＋竜骨・牡蛎→桂枝加竜骨牡蛎湯（神経質・夜泣き）。"},

{"keys":["関節痛","薏苡仁","麻杏薏甘湯","薏苡仁湯","越婢加朮湯","桂枝加朮附湯"],"text":"関節痛の処方はまず薏苡仁で探す。薏苡仁入りの麻杏薏甘湯・薏苡仁湯（関節痛・筋肉痛）、むくみと汗があれば越婢加朮湯（石膏）、冷えで悪化すれば桂枝加朮附湯（附子入り、麻黄なし）。"},

{"keys":["気虚","四君子湯","六君子湯","補中益気湯"],"text":"気虚の基本は四君子湯（人参・蒼朮・茯苓・甘草＋生姜・大棗）。＋半夏・陳皮で六君子湯（みぞおちのつかえ・食欲不振）。黄耆・升麻・柴胡などを含む補中益気湯は四肢倦怠・夏やせ・病後の体力増強に。"},

{"keys":["水毒","五苓散","苓桂朮甘湯","真武湯"],"text":"茯苓・朮で水をさばく3処方。口渇・尿量減少→五苓散（沢瀉・猪苓）、ふらつき・動悸→苓桂朮甘湯、冷えて下痢→真武湯（附子）。めまいは3つとも適応なので「口渇」「動悸」「冷え」で区別。"},
{"keys":["附子","桂枝加朮附湯","麻黄附子細辛湯","真武湯"],"text":"附子＝温める（冷えが目印）。附子入りは桂枝加朮附湯（冷えで悪化する関節痛）、麻黄附子細辛湯（手足の冷えを伴う高齢者などのかぜ）、真武湯（新陳代謝が沈衰し冷えた者の下痢・めまい）。"},
{"keys":["抑肝散","加味逍遙散","柴胡桂枝乾姜湯","四逆散","柴胡加竜骨牡蛎湯"],"text":"精神症状に使う柴胡入り処方を区別する。体力があり動悸・不眠→柴胡加竜骨牡蛎湯、虚弱・冷え・動悸→柴胡桂枝乾姜湯、神経の高ぶり・小児夜泣き→抑肝散、女性のいらだち・更年期→加味逍遙散、胸腹部の重苦しさ→四逆散。"},
{"keys":["芍薬","芍薬甘草湯","桂枝加芍薬湯","四逆散"],"text":"芍薬＋甘草は筋肉のけいれん・痛みを緩める組み合わせ。2味だけなら芍薬甘草湯（こむらがえり）、桂枝湯の芍薬を増やすと桂枝加芍薬湯（腹痛）、柴胡・枳実と組むと四逆散。"},
{"keys":["乾姜","人参湯","大建中湯","半夏瀉心湯","小青竜湯","柴胡桂枝乾姜湯"],"text":"乾姜入りは人参湯・大建中湯・半夏瀉心湯・小青竜湯・柴胡桂枝乾姜湯。乾姜は温める生薬で、冷え（腹の冷え・冷えた脾）のある処方に入ると覚える。半夏瀉心湯は生姜ではなく乾姜。"}
];

</script>
<script>
// 漢方小テスト対策：画面の動き
(function () {
  const K = window.KAMPO;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // 生薬・処方名にふりがな（読みを答える問題では付けない）
  const rb = (s) => { const h = esc(s); return cur && /読み/.test(cur.q) ? h : window.addRuby(h); };
  const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };

  const KEY = (window.APP_KEY || "kampo") + ":";
  // ---------- 保存（この端末のブラウザ内のみ） ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },
  };
  let stats = store.get("stats", {}); // id -> {c, w, streak, last}

  // ---------- 問題プール ----------
  const STATIC = (window.QBANK || []).map((q) => ({ ...q, id: "s:" + hash(q.cat + q.q), gen: false }));
  const POOL = STATIC.concat(K.T);
  const CATS = window.APP_CATS || ["過去の小テスト", "総論", "基礎理論", "桂枝湯類", "生薬", "麻黄剤(予想)", "柴胡剤(予想)", "その他処方(予想)"];
  const CAT_NOTE = { "総論": "小テスト1", "基礎理論": "小テスト2", "桂枝湯類": "小テスト3", "生薬": "小テスト3" };
  const TYPES = { single: "1つ選ぶ", multi: "すべて選ぶ", tf: "正誤" }; // 記述式は出さない（ビルド時に選択式へ変換済み）

  const defaults = { cats: CATS.slice(), src: ["static", "gen"], types: Object.keys(TYPES), levels: [1, 2, 3], order: "weak", ruby: true };
  let cfg = Object.assign({}, defaults, store.get("cfg", {}));
  cfg.cats = cfg.cats.filter((c) => CATS.includes(c));
  cfg.types = cfg.types.filter((t) => TYPES[t]); if (!cfg.types.length) cfg.types = Object.keys(TYPES);

  // ---------- 設定パネル ----------
  function chips(el, items, key, labelOf) {
    el.innerHTML = items.map((v) => {
      const on = cfg[key].includes(v);
      return `<button type="button" class="chip" aria-pressed="${on}" data-key="${key}" data-v="${esc(v)}">${labelOf(v)}</button>`;
    }).join("");
  }
  function countFor(cat) { return POOL.filter((q) => q.cat === cat).length; }
  function renderSettings() {
    chips($("#f-cats"), CATS, "cats", (c) => `${esc(c)}<small>${CAT_NOTE[c] ? CAT_NOTE[c] + "・" : ""}${countFor(c)}</small>`);
    chips($("#f-src"), ["static", "gen"], "src", (v) => (v === "static" ? `知識問題<small>${STATIC.length}</small>` : `処方構成・適応の自動生成<small>${K.T.length}型</small>`));
    chips($("#f-types"), Object.keys(TYPES), "types", (v) => TYPES[v]);
    chips($("#f-levels"), [1, 2, 3], "levels", (v) => ["", "基本", "標準", "重箱の隅"][v]);
    document.querySelectorAll("input[name=order]").forEach((r) => (r.checked = r.value === cfg.order));
    $("#pool-n").textContent = filtered().length;
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".chip[data-key]");
    if (!b) return;
    const key = b.dataset.key; let v = b.dataset.v; if (key === "levels") v = Number(v);
    const a = cfg[key]; const i = a.indexOf(v);
    if (i >= 0) { if (a.length > 1) a.splice(i, 1); } else a.push(v);
    store.set("cfg", cfg); renderSettings();
  });
  $("#f-onlycat").addEventListener("change", (e) => {
    const v = e.target.value; if (!v) return;
    cfg.cats = v === "all" ? CATS.slice() : v === "past" ? ["過去の小テスト", "総論", "基礎理論", "桂枝湯類", "生薬"] : v === "next" ? ["麻黄剤(予想)", "柴胡剤(予想)", "その他処方(予想)"] : [v];
    e.target.value = ""; store.set("cfg", cfg); renderSettings();
  });
  document.querySelectorAll("input[name=order]").forEach((r) => r.addEventListener("change", () => { cfg.order = r.value; store.set("cfg", cfg); renderSettings(); }));

  function filtered() {
    return POOL.filter((q) => cfg.cats.includes(q.cat) && cfg.src.includes(q.gen ? "gen" : "static") && cfg.levels.includes(q.level || 2)
      && (q.gen || cfg.types.includes(q.type))
      && (cfg.order !== "wrong" || (stats[q.id] && stats[q.id].w > 0 && stats[q.id].streak < 2)));
  }

  // ふりがなの表示切り替え（CSSで rt を隠すだけなので、解いている途中でも即反映）
  function applyRuby() { document.body.classList.toggle("noruby", !cfg.ruby); $("#ruby-on").checked = cfg.ruby; }
  $("#ruby-on").addEventListener("change", (e) => { cfg.ruby = e.target.checked; store.set("cfg", cfg); applyRuby(); });

  // ---------- 出題の選び方 ----------
  let recent = [];
  function weight(q) {
    const s = stats[q.id];
    if (cfg.order === "random") return 1;
    if (!s) return 3;
    if (s.streak === 0) return 6;
    return Math.max(0.2, 2.2 - s.streak * 0.7);
  }
  function nextQuestion() {
    const pool = filtered();
    if (!pool.length) return null;
    for (let t = 0; t < 60; t++) {
      const cand = pool.filter((q) => !recent.includes(q.id) || pool.length <= recent.length);
      const list = cand.length ? cand : pool;
      let tot = list.reduce((a, q) => a + weight(q), 0), r = Math.random() * tot, q = list[0];
      for (const x of list) { r -= weight(x); if (r <= 0) { q = x; break; } }
      const made = q.gen ? q.make() : prepStatic(q);
      if (!made) continue;
      if (q.gen && !cfg.types.includes(made.type)) continue;
      recent.push(q.id); if (recent.length > Math.min(25, Math.floor(pool.length / 2))) recent.shift();
      return Object.assign({ id: q.id, cat: q.cat, sub: q.sub, level: q.level || 2 }, made);
    }
    return null;
  }
  function prepStatic(q) {
    if (q.type === "input" || q.type === "tf") return { type: q.type, q: q.q, choices: q.choices || [], answer: q.answer, exp: q.exp };
    const order = K.shuffle(q.choices.map((_, i) => i));
    return { type: q.type, q: q.q, choices: order.map((i) => q.choices[i]), answer: q.answer.map((a) => order.indexOf(a)), exp: q.exp };
  }

  // ---------- 覚え方 ----------
  // OBOE: [{keys:[語...], text}]。正解 → 問題文 → 解説の順に、出てくる語（長い語を優先）で探し、最大2件
  const OBOE = window.OBOE || [];
  const OKEYS = [...new Set(OBOE.flatMap((o) => o.keys))].sort((a, b) => b.length - a.length);
  const OKRE = OKEYS.length ? new RegExp(OKEYS.map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g") : null;
  function findOboe(texts) {
    if (!OKRE) return [];
    const hit = [];
    // 正解 → 問題文 → 解説の順に見る。同じ文の中では、その語に専用の覚え方（keys が少ないもの）を先に
    for (const t of texts) {
      const words = [...new Set([...String(t || "").matchAll(OKRE)].map((m) => m[0]))];
      const found = OBOE.filter((o) => !hit.includes(o) && o.keys.some((k) => words.includes(k))).sort((a, b) => a.keys.length - b.keys.length);
      for (const o of found) { hit.push(o); if (hit.length >= 2) return hit; }
    }
    return hit;
  }

  // ---------- 出題画面 ----------
  let cur = null, answered = false, sess = { n: 0, ok: 0, streak: 0 };
  function show() {
    cur = nextQuestion(); answered = false;
    const box = $("#qcard");
    if (!cur) { box.innerHTML = `<p class="empty">条件に合う問題がありません。分類・形式の選択を増やすか、「間違えた問題だけ」を外してください。</p>`; return; }
    const s = stats[cur.id];
    const hist = s ? `これまで ${s.c}正 / ${s.w}誤` : "初出題";
    let body = "";
    if (cur.type === "input") {
      body = `<form id="inp" class="inp" autocomplete="off"><input id="ans" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="漢字・ひらがな・カタカナ可" aria-label="解答"><button class="btn primary" type="submit">判定</button></form>`;
    } else {
      body = `<ol class="choices ${cur.type}">` + cur.choices.map((c, i) => `<li><button type="button" class="choice" data-i="${i}" aria-pressed="false"><span class="no">${i + 1}</span><span class="tx">${rb(c)}</span></button></li>`).join("") + `</ol>`;
      if (cur.type === "multi") body += `<button id="judge" class="btn primary" type="button">判定（すべて選んだら）</button>`;
    }
    box.innerHTML = `<div class="meta"><span class="tag">${esc(cur.cat)}</span><span class="tag sub">${esc(cur.sub || "")}</span><span class="tag lv${cur.level}">${["", "基本", "標準", "重箱の隅"][cur.level]}</span><span class="hist">${hist}</span></div>
      <p class="qtext">${rb(cur.q).replace(/\n/g, "<br>")}</p>${cur.type === "multi" ? `<p class="hint">正解はいくつあるか分かりません。すべて選んでから判定。</p>` : ""}${body}<div id="result"></div>`;
    if (cur.type === "input") { const f = $("#inp"); f.addEventListener("submit", (e) => { e.preventDefault(); judge(); }); setTimeout(() => $("#ans").focus({ preventScroll: true }), 30); }
    renderSess();
  }
  $("#qcard").addEventListener("click", (e) => {
    if (answered) return;
    const c = e.target.closest(".choice");
    if (c) {
      if (cur.type === "multi") c.setAttribute("aria-pressed", c.getAttribute("aria-pressed") === "true" ? "false" : "true");
      else { c.setAttribute("aria-pressed", "true"); judge(); }
    }
    if (e.target.closest("#judge")) judge();
  });

  function judge() {
    if (answered) return;
    let ok, picked = [];
    if (cur.type === "input") {
      const v = K.norm($("#ans").value); if (!v) return;
      ok = cur.answer.some((a) => K.norm(a) === v);
      $("#ans").disabled = true;
    } else {
      picked = [...document.querySelectorAll(".choice[aria-pressed=true]")].map((b) => +b.dataset.i);
      if (!picked.length) return;
      ok = picked.length === cur.answer.length && picked.every((i) => cur.answer.includes(i));
      document.querySelectorAll(".choice").forEach((b) => {
        const i = +b.dataset.i, right = cur.answer.includes(i), p = picked.includes(i);
        b.classList.add(right ? "right" : p ? "wrong" : "dim");
        if (right && !p && cur.type === "multi") b.classList.add("missed");
        b.disabled = true;
      });
      const j = $("#judge"); if (j) j.remove();
    }
    answered = true;
    const s = stats[cur.id] || { c: 0, w: 0, streak: 0 };
    if (ok) { s.c++; s.streak++; } else { s.w++; s.streak = 0; }
    s.last = Date.now(); s.cat = cur.cat; stats[cur.id] = s; store.set("stats", stats);
    sess.n++; if (ok) { sess.ok++; sess.streak++; } else sess.streak = 0;
    const ansText = cur.type === "input" ? `正解：${rb(cur.answer[0])}` + (cur.answer.length > 1 ? `（${cur.answer.slice(1).map(esc).join("／")} も可）` : "")
      : `正解：${cur.answer.map((i) => i + 1).sort((a, b) => a - b).join("・")}`;
    $("#result").innerHTML = `<div class="verdict ${ok ? "ok" : "ng"}" role="status"><b>${ok ? "正解" : "不正解"}</b><span>${ansText}</span></div>
      <button id="next" class="btn primary next" type="button">次の問題 <kbd>Enter</kbd></button>
      <div class="exp">${rb(cur.exp || "").replace(/\n/g, "<br>")}</div>
      ${findOboe([cur.type === "input" ? cur.answer[0] : cur.answer.map((i) => cur.choices[i]).join(" "), cur.q, cur.exp, cur.formula]).map((o) => `<div class="oboe"><b>覚え方</b><p>${rb(o.text).replace(/\n/g, "<br>")}</p></div>`).join("")}`;
    $("#next").addEventListener("click", () => { show(); $("#qcard").scrollIntoView({ block: "start" }); });
    $("#next").focus({ preventScroll: true });
    // スマホでは判定と「次の問題」が画面に入るようにスクロール
    const r = $("#result").getBoundingClientRect();
    if (r.top < 60 || r.top > window.innerHeight * 0.6) $("#result").scrollIntoView({ block: "start", behavior: "smooth" });
    renderSess();
  }
  document.addEventListener("keydown", (e) => {
    if ($("#view-quiz").hidden || !cur) return;
    if (e.key === "Enter" && answered && document.activeElement?.id !== "ans") { e.preventDefault(); show(); }
    if (!answered && cur.type !== "input" && /^[1-9]$/.test(e.key)) { const b = document.querySelector(`.choice[data-i="${+e.key - 1}"]`); if (b) b.click(); }
  });
  function renderSess() {
    $("#sess").innerHTML = `今回 <b>${sess.n}</b>問　正解率 <b>${sess.n ? Math.round((sess.ok / sess.n) * 100) : 0}%</b>　連続正解 <b>${sess.streak}</b>`;
  }

  // ---------- 構成表（暗記） ----------
  let hideHerbs = false, tableGroup = window.TABLE_DEFAULT || "keishi";
  function renderTable() {
    const fs = window.FORMULAS.filter((f) => tableGroup === "all" || f.group === tableGroup);
    $("#tbl").innerHTML = fs.map((f) => {
      const hs = K.sortedHerbs(f);
      return `<article class="fcard"><header><h3>${esc(f.name)}</h3><span class="yomi">${esc(f.yomi)}</span><span class="cnt">${hs.length}種</span></header>
        <ul class="herbs ${hideHerbs ? "hide" : ""}">${hs.map((h) => `<li tabindex="0"><span class="hn">${esc(h)}</span><span class="hr">${esc(window.HERB_READING[h])}</span>${f.herbs[h] != null ? `<span class="g">${f.herbs[h]}g</span>` : ""}</li>`).join("")}</ul>
        <p class="use">${esc(f.use)}</p></article>`;
    }).join("");
    document.querySelectorAll("#tgroup button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.g === tableGroup));
    $("#hide").setAttribute("aria-pressed", hideHerbs);
  }
  $("#tgroup").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { tableGroup = b.dataset.g; renderTable(); } });
  $("#hide").addEventListener("click", () => { hideHerbs = !hideHerbs; renderTable(); });
  $("#tbl").addEventListener("click", (e) => { const li = e.target.closest(".herbs.hide li"); if (li) li.classList.toggle("open"); });

  // ---------- 成績 ----------
  function renderStats() {
    const rows = CATS.map((c) => {
      const ids = POOL.filter((q) => q.cat === c).map((q) => q.id);
      let n = 0, ok = 0, ng = 0, mastered = 0, seen = 0;
      for (const id of ids) { const s = stats[id]; if (!s) continue; seen++; ok += s.c; ng += s.w; if (s.streak >= 2) mastered++; }
      n = ok + ng;
      const pct = n ? Math.round((ok / n) * 100) : 0;
      return `<tr><th scope="row">${esc(c)}</th><td>${seen}/${ids.length}</td><td>${n}</td><td><div class="bar"><i style="width:${pct}%"></i></div>${n ? pct + "%" : "–"}</td><td>${mastered}</td></tr>`;
    }).join("");
    const weak = Object.values(stats).filter((s) => s.w > 0 && s.streak < 2).length;
    $("#stats").innerHTML = `<p class="lead">苦手（直近で間違えて、まだ2連続正解していない問題）：<b>${weak}</b>問</p>
      <div class="tw"><table><thead><tr><th>分類</th><th>出題済/総数</th><th>解答回数</th><th>正解率</th><th>2連続正解</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">自動生成の問題は「型」単位で数えています（選択肢は毎回変わります）。記録はこの端末のブラウザにだけ保存されます。</p>`;
  }
  $("#reset").addEventListener("click", () => { $("#reset-confirm").hidden = false; });
  $("#reset-no").addEventListener("click", () => { $("#reset-confirm").hidden = true; });
  $("#reset-yes").addEventListener("click", () => { stats = {}; store.set("stats", stats); $("#reset-confirm").hidden = true; renderStats(); renderSettings(); });

  // ---------- タブ ----------
  function tab(name) {
    ["quiz", "table", "stats"].forEach((n) => { $("#view-" + n).hidden = n !== name; $("#tab-" + n).setAttribute("aria-selected", n === name); });
    if (name === "table") renderTable();
    if (name === "stats") renderStats();
    if (name === "quiz") renderSettings();
  }
  document.querySelectorAll("[role=tab]").forEach((b) => b.addEventListener("click", () => tab(b.id.slice(4))));
  $("#start").addEventListener("click", () => { $("#settings").open = false; sess = { n: 0, ok: 0, streak: 0 }; recent = []; show(); $("#qcard").scrollIntoView({ behavior: "smooth", block: "start" }); });

  $("#total").textContent = `知識問題 ${STATIC.length}問 ＋ 自動生成 ${K.T.length}型（毎回選択肢が変わる）`;
  applyRuby(); renderSettings(); show();
})();

</script>
