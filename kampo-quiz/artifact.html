<title>漢方小テスト道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
/* レイアウト：1カラムの問題カード＋上部タブ。薬箪笥の引き出しラベルのような札（タグ）で分類を示す */
:root {
  --bg: #eef1ee; --paper: #fbfcfa; --fg: #1d2622; --muted: #5d6b64; --line: #cdd6d0;
  --accent: #2f4f7a; --accent-weak: #dfe6f1; --ochre: #a8761a; --ochre-weak: #f4e9d2;
  --ok: #1f7a4a; --ok-weak: #dcefe3; --ng: #b3322f; --ng-weak: #f6dedd;
  --f-disp: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141a17; --paper: #1c2420; --fg: #e4ebe6; --muted: #9aa8a0; --line: #33403a;
  --accent: #9db8e3; --accent-weak: #253247; --ochre: #e0b45c; --ochre-weak: #3a3020;
  --ok: #6fd19b; --ok-weak: #1d3a2a; --ng: #f08a86; --ng-weak: #432423; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141a17; --paper: #1c2420; --fg: #e4ebe6; --muted: #9aa8a0; --line: #33403a;
  --accent: #9db8e3; --accent-weak: #253247; --ochre: #e0b45c; --ochre-weak: #3a3020;
  --ok: #6fd19b; --ok-weak: #1d3a2a; --ng: #f08a86; --ng-weak: #432423; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.7; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; }
header.top { display: grid; gap: 4px; margin-bottom: 14px; }
h1 { font-family: var(--f-disp); font-weight: 800; font-size: 1.9rem; letter-spacing: .04em; margin: 0; text-wrap: balance; }
h1 span { color: var(--ochre); }
.sub-h { color: var(--muted); font-size: .85rem; margin: 0; }
nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 16px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
nav.tabs button { flex: 1; font: inherit; font-weight: 700; background: none; border: 0; padding: 10px 6px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
details#settings { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; margin-bottom: 14px; }
details#settings summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
details#settings summary small { font-weight: 400; color: var(--muted); }
.fg { display: grid; gap: 6px; margin: 10px 0 14px; }
.fg > span { font-size: .78rem; color: var(--muted); letter-spacing: .08em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: .88rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.chip small { font-size: .72rem; opacity: .8; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent-weak); border-color: var(--accent); color: var(--fg); }
select, .radios label { font: inherit; font-size: .9rem; }
select { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--fg); max-width: 100%; }
.radios { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.startrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 6px 0 12px; }
.btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 10px 18px; border: 1px solid var(--line); background: var(--paper); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn:focus-visible, .choice:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
kbd { font-family: var(--f-body); font-size: .7rem; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; opacity: .7; }
#sess { font-size: .85rem; color: var(--muted); margin: 0 0 8px; font-variant-numeric: tabular-nums; }
#sess b { color: var(--fg); }
#qcard { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 20px; scroll-margin-top: 60px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.tag { font-size: .75rem; padding: 2px 8px; border-radius: 4px; background: var(--ochre-weak); color: var(--ochre); font-weight: 700; letter-spacing: .04em; }
.tag.sub { background: var(--accent-weak); color: var(--accent); }
.tag.lv3 { background: var(--ng-weak); color: var(--ng); }
.tag.lv1, .tag.lv2 { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 400; }
.hist { font-size: .75rem; color: var(--muted); margin-left: auto; }
.qtext { font-size: 1.08rem; font-weight: 700; margin: 4px 0 12px; }
.hint { font-size: .8rem; color: var(--ochre); margin: -6px 0 10px; }
.choices { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
.choices.multi { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.choice { width: 100%; text-align: left; font: inherit; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 10px 12px; cursor: pointer; min-height: 46px; }
.choice .no { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; min-width: 1.2em; }
.choice .tx { min-width: 0; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); }
.choice.right { border-color: var(--ok); background: var(--ok-weak); }
.choice.right.missed { border-style: dashed; }
.choice.wrong { border-color: var(--ng); background: var(--ng-weak); }
.choice.dim { opacity: .55; }
.choice:disabled { cursor: default; color: var(--fg); }
.inp { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.inp input { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 1.05rem; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.verdict { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; }
.verdict b { font-family: var(--f-disp); font-size: 1.3rem; }
.verdict.ok { background: var(--ok-weak); color: var(--ok); }
.verdict.ng { background: var(--ng-weak); color: var(--ng); }
.verdict span { color: var(--fg); font-weight: 700; }
.exp { font-size: .92rem; line-height: 1.8; border-left: 3px solid var(--ochre); padding: 4px 0 4px 12px; margin-bottom: 14px; overflow-wrap: anywhere; }
.empty { color: var(--muted); }
/* 構成表 */
.tbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
#tgroup { display: flex; flex-wrap: wrap; gap: 6px; }
#tbl { display: grid; gap: 10px; }
.fcard { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.fcard header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.fcard h3 { font-family: var(--f-disp); font-size: 1.2rem; margin: 0; }
.fcard .yomi { color: var(--muted); font-size: .8rem; }
.fcard .cnt { margin-left: auto; font-weight: 700; color: var(--ochre); font-variant-numeric: tabular-nums; }
.herbs { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.herbs li { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; display: inline-flex; gap: 6px; align-items: baseline; background: var(--bg); }
.herbs .hn { font-weight: 700; }
.herbs .hr, .herbs .g { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.herbs.hide li { cursor: pointer; }
.herbs.hide li:not(.open) > * { visibility: hidden; }
.herbs.hide li:not(.open) { background: var(--accent-weak); }
.use { font-size: .85rem; color: var(--muted); margin: 0; }
/* 成績 */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; font-variant-numeric: tabular-nums; background: var(--paper); }
th, td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; white-space: nowrap; }
.bar { display: inline-block; width: 70px; height: 8px; background: var(--line); border-radius: 4px; margin-right: 6px; vertical-align: middle; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.note, .lead { font-size: .85rem; color: var(--muted); }
.confirm { border: 1px solid var(--ng); background: var(--ng-weak); border-radius: 8px; padding: 12px; margin-top: 10px; display: grid; gap: 8px; }
.confirm div { display: flex; gap: 8px; flex-wrap: wrap; }
.disclaimer { font-size: .78rem; color: var(--muted); margin-top: 28px; border-top: 1px solid var(--line); padding-top: 10px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>漢方<span>小テスト</span>道場</h1>
    <p class="sub-h" id="total"></p>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-quiz" aria-selected="true">演習</button>
    <button role="tab" id="tab-table" aria-selected="false">構成表で暗記</button>
    <button role="tab" id="tab-stats" aria-selected="false">成績</button>
  </nav>

  <section id="view-quiz">
    <details id="settings">
      <summary>出題範囲を選ぶ <small>（対象 <span id="pool-n"></span> 型）</small></summary>
      <div class="fg"><span>まとめて選ぶ</span>
        <select id="f-onlycat" aria-label="分類をまとめて選ぶ">

          <option value="all">全分類</option>
          <option value="past">小テスト1〜3の範囲</option>

          <option value="桂枝湯類">桂枝湯類だけ</option><option value="生薬">生薬だけ</option>
          <option value="麻黄剤(予想)">麻黄剤だけ</option><option value="柴胡剤(予想)">柴胡剤だけ</option><option value="その他処方(予想)">その他処方だけ</option>
        </select>
      </div>
      <div class="fg"><span>分類</span><div class="chips" id="f-cats"></div></div>
      <div class="fg"><span>問題の種類</span><div class="chips" id="f-src"></div></div>
      <div class="fg"><span>形式</span><div class="chips" id="f-types"></div></div>
      <div class="fg"><span>難易度</span><div class="chips" id="f-levels"></div></div>
      <div class="fg"><span>出題の順番</span>
        <div class="radios">
          <label><input type="radio" name="order" value="weak" id="o-weak"> 苦手・未出題を優先</label>
          <label><input type="radio" name="order" value="random" id="o-random"> 完全ランダム</label>
          <label><input type="radio" name="order" value="wrong" id="o-wrong"> 間違えた問題だけ</label>
        </div>
      </div>
      <div class="startrow"><button class="btn primary" id="start" type="button">この範囲で始める</button></div>
    </details>
    <p id="sess"></p>
    <div id="qcard"></div>
  </section>

  <section id="view-table" hidden>
    <div class="tbar">
      <div id="tgroup">
        <button class="chip" data-g="keishi">桂枝湯類</button><button class="chip" data-g="mao">麻黄剤</button>
        <button class="chip" data-g="saiko">柴胡剤</button><button class="chip" data-g="other">その他</button><button class="chip" data-g="all">全部</button>
      </div>
      <button class="chip" id="hide" type="button">生薬をかくす（タップでめくる）</button>
    </div>
    <div id="tbl"></div>
  </section>

  <section id="view-stats" hidden>
    <div id="stats"></div>
    <button class="btn" id="reset" type="button">成績の記録を消す</button>
    <div class="confirm" id="reset-confirm" hidden>
      <span>これまでの正誤の記録をすべて消します。元に戻せません。消してよいですか？</span>
      <div><button class="btn" id="reset-yes" type="button">消す</button><button class="btn primary" id="reset-no" type="button">やめる</button></div>
    </div>
  </section>

  <p class="disclaimer">処方構成と1日量はツムラ医療用漢方製剤を基準にしています。メーカーにより蒼朮/白朮・桂皮/桂枝の表記や量が違うことがあるので、講義スライドの表記を優先してください。「(予想)」の分類は第4回の範囲を小テスト1〜3の流れから予想したものです。</p>
</div>

{"cat":"過去の小テスト","sub":"小テスト1 問1","type":"single","level":1,"q":"漢方薬について正しいのはどれか。1つ選べ。","choices":["漢方薬は必ず1種類の生薬からなる。","漢方薬は西洋医学で治療に用いられる薬である。","漢方薬は通常、複数の生薬を配合して用いる。","漢方薬はすべて中国で開発された薬である。","漢方薬には鉱物性生薬は用いられない。"],"answer":[2],"exp":"漢方薬は通常、複数の生薬を組み合わせる。日本で独自に発展した処方もあり、石膏などの鉱物性生薬も用いる。"},
{"cat":"過去の小テスト","sub":"小テスト1 問2","type":"single","level":1,"q":"鍼灸について記載されている中国の医学書はどれか。1つ選べ。","choices":["医心方","神農本草経","傷寒雑病論","黄帝内経","金匱要略"],"answer":[3],"exp":"黄帝内経（素問・霊枢）は医学理論と鍼灸を扱う。神農本草経＝本草書、傷寒雑病論＝薬物療法（傷寒論・金匱要略）、医心方＝日本（平安時代・丹波康頼）。"},
{"cat":"過去の小テスト","sub":"小テスト1 問3","type":"single","level":1,"q":"「傷寒論」について正しいのはどれか。1つ選べ。","choices":["生薬の分類について記載した本草書である。","急性熱性疾患の病状と薬物療法を扱っている。","日本で江戸時代に成立した医学書である。","現代の中国医学を体系化した医学書である。","西洋医学の処方をまとめた医学書である。"],"answer":[1],"exp":"傷寒論は後漢の張仲景による傷寒雑病論の一部で、急性熱性疾患（傷寒）を扱う。慢性疾患（雑病）は金匱要略。"},
{"cat":"過去の小テスト","sub":"小テスト1 問4","type":"single","level":1,"q":"日本における漢方医学の歴史について正しいのはどれか。1つ選べ。","choices":["江戸時代中期に古方派が出現し、「傷寒雑病論」に基づく治療が重視された。","明治時代には、政府が漢方医学を保護する方針をとった。","平安時代には、蘭学を取り入れた折衷派が出現した。","2006年に、医療用漢方製剤4処方が初めて薬価基準に収載された。","漢方医学は中国から伝来した後、日本ではほとんど変化しなかった。"],"answer":[0],"exp":"明治政府は西洋医学を採用し漢方を保護しなかった。折衷派は江戸後期。医療用漢方エキス製剤4処方の初収載は1967年（1976年に大幅収載）。漢方は日本で独自に発展した。"},
{"cat":"過去の小テスト","sub":"小テスト1 問5","type":"single","level":1,"q":"神農本草経における「上品（上薬）」の説明として正しいのはどれか。1つ選べ。","choices":["上品は治療薬であり、毒性が強いため連用を避ける。","中品は生命を養う目的で、長期連用しても害がない。","下品は養生を目的に使用し、無毒にも有毒にもなる。","上品は生命を養う目的で、長期連用しても害のないものとされる。","下品はすべて無毒であり、長期連用が可能である。"],"answer":[3],"exp":"上品＝養命・無毒・長期連用可（120種）、中品＝養性・無毒にも有毒にもなる（120種）、下品＝治病・有毒が多く長期連用不可（125種）。計365種。"},
{"cat":"過去の小テスト","sub":"小テスト1 問6","type":"single","level":1,"q":"剤形について正しいのはどれか。1つ選べ。","choices":["煎剤は、生薬の粉末をそのまま混合したものである。","散剤は、生薬を蜂蜜などで丸く形成したものである。","丸剤は、漢方処方の抽出液を濃縮・乾燥して製剤化したものである。","軟膏剤は、医療用漢方製剤では用いられない剤形である。","エキス剤は、漢方処方の抽出液を濃縮・乾燥して得たエキスを製剤化したものである。"],"answer":[4],"exp":"煎剤＝煎じた液、散剤＝粉末を混合、丸剤＝粉末を蜂蜜などで丸める、エキス剤＝抽出液を濃縮・乾燥して製剤化。軟膏剤（紫雲膏）は医療用にもある。"},
{"cat":"過去の小テスト","sub":"小テスト1 問7","type":"single","level":1,"q":"漢方製剤について正しいのはどれか。1つ選べ。","choices":["一般用漢方製剤と医療用漢方製剤の処方数は同じである。","同じ処方名であれば、メーカーが異なっても構成生薬の配合量は同じである。","医療用漢方製剤と煎剤との同等性や品質を確保するために、指標成分の定量が行われる。","医療用漢方製剤として処方される内服薬の主流は煎剤である。","薬局製剤のうち、漢方薬が占める割合は全体の約1割である。"],"answer":[2],"exp":"処方数は一般用（約294）と医療用（148）で異なる。メーカーで配合量が異なることがある。医療用の主流はエキス剤。"},
{"cat":"過去の小テスト","sub":"小テスト1 問8","type":"single","level":1,"q":"漢方薬の服用法について正しいのはどれか。1つ選べ。","choices":["漢方薬は、頓服では服用しない","漢方薬は、通常、1日3回、食後に服用する。","漢方薬は、通常、1日1回の服用で十分である。","漢方薬は、通常、1日3回、食前または食間に服用する。","漢方薬は、通常、症状が改善するまで2か月以上継続して服用する。"],"answer":[3],"exp":"通常1日2〜3回、食前または食間。頓服で使うこともある（例：芍薬甘草湯）。"},

{"cat":"過去の小テスト","sub":"小テスト3 問6","type":"input","level":1,"q":"桂枝加芍薬湯、桂枝加朮附湯、桂枝加竜骨牡蛎湯、桂枝湯、小建中湯の構成生薬のうち、小建中湯のみに配合されている生薬を答えなさい。","answer":["膠飴","こうい"],"exp":"小建中湯＝桂枝加芍薬湯＋膠飴。"},
{"cat":"過去の小テスト","sub":"小テスト3 問7","type":"single","level":1,"q":"過敏性腸症候群の治療に最も適した漢方薬はどれか。","choices":["桂枝加芍薬湯","桂枝加朮附湯","桂枝加竜骨牡蛎湯","桂枝湯","小建中湯"],"answer":[0],"exp":"桂枝加芍薬湯：腹部膨満感のあるしぶり腹・腹痛。"},
{"cat":"過去の小テスト","sub":"小テスト3 問8","type":"single","level":1,"q":"小児の虚弱体質改善に最も適した漢方薬はどれか。","choices":["桂枝加芍薬湯","桂枝加朮附湯","桂枝加竜骨牡蛎湯","桂枝湯","小建中湯"],"answer":[4],"exp":"小建中湯：小児虚弱体質、疲労倦怠、小児夜尿症、夜泣き。"},
{"cat":"過去の小テスト","sub":"小テスト3 問9","type":"single","level":1,"q":"26歳女性。入社以来、重要なプレゼン前や通勤電車の中で突然強い下痢と、お腹がギューッと絞られるような強い痛みに襲われるようになった。排便すると一時的に症状は軽快する。医療機関で検査を受けたが器質的異常は認められなかった。腹診では腹直筋の著明な緊張（腹皮攣急）を認める。この患者に適した漢方薬はどれか。","choices":["桂枝加芍薬湯","桂枝加朮附湯","桂枝加竜骨牡蛎湯","桂枝湯","小建中湯"],"answer":[0],"exp":"器質的異常のない腹痛・下痢＝過敏性腸症候群。腹皮拘急（攣急）＋腹痛 → 桂枝加芍薬湯。小建中湯は体質虚弱・疲れやすさ（小児の虚弱体質）が目標。"},
{"cat":"過去の小テスト","sub":"小テスト3 問10","type":"single","level":1,"q":"68歳女性。以前から関節痛がある。特に冬場や雨の日になると痛みが強くなり、関節の痛みとともに重だるさを感じる。冷えると症状が悪化し、温めると楽になる。体力はあまりなく、手足も冷えやすい。この患者に適した漢方薬はどれか。","choices":["桂枝加芍薬湯","桂枝加朮附湯","桂枝加竜骨牡蛎湯","桂枝湯","小建中湯"],"answer":[1],"exp":"冷え（附子で温める）＋湿・重だるさ（蒼朮で利水）＋関節痛 → 桂枝加朮附湯。"},
{"cat":"総論","sub":"古典","type":"single","q":"鍼灸について記載された医学書はどれか。","choices":["医心方","傷寒雑病論","金匱要略","神農本草経","黄帝内経"],"answer":[4],"exp":"黄帝内経は中国最古の医学理論書とされ、『素問』（医学理論・生理・病理）と『霊枢』（鍼灸の理論と技術、別名『鍼経』）から成る。神農本草経は薬物書、傷寒雑病論（傷寒論・金匱要略）は薬物療法の書、医心方は日本の医書。","level":1},
{"cat":"総論","sub":"古典","type":"single","q":"傷寒論に記載されている内容として正しいものはどれか。","choices":["日本で編纂された医学知識の集大成","急性熱性疾患の病状と薬物療法","慢性疾患（雑病）の治療","薬物365種の上・中・下品への分類","鍼灸の理論と技術"],"answer":[1],"exp":"傷寒論は張仲景の傷寒雑病論のうち「傷寒」（急性熱性疾患）の部分で、病状の進行（太陽病→陽明病→少陽病→太陰病→少陰病→厥陰病の六病位）に応じた薬物療法を記す。慢性疾患（雑病）は金匱要略、薬物分類は神農本草経、鍼灸は黄帝内経（霊枢）、日本の集大成は医心方。","level":1},
{"cat":"総論","sub":"古典","type":"single","q":"金匱要略に主に記載されている内容はどれか。","choices":["慢性疾患（雑病）の病状と薬物療法","急性熱性疾患の病状と薬物療法","鍼灸の理論","外科手術の方法","生薬の産地と採取時期のみ"],"answer":[0],"exp":"傷寒雑病論の「雑病」部分が金匱要略で、慢性疾患・婦人病などの治療を記す。急性熱性疾患は傷寒論。","level":1},
{"cat":"総論","sub":"古典","type":"single","q":"中国最古の本草書（薬物書）とされるのはどれか。","choices":["傷寒論","医心方","神農本草経","黄帝内経","金匱要略"],"answer":[2],"exp":"神農本草経は中国最古の本草書で、365種の薬物を上品・中品・下品に分類している。黄帝内経は医学理論・鍼灸、傷寒論・金匱要略は処方（薬物療法）の書、医心方は日本の医書。","level":1},
{"cat":"総論","sub":"古典","type":"single","q":"傷寒雑病論の著者はだれか。","choices":["陶弘景","吉益東洞","丹波康頼","李時珍","張仲景"],"answer":[4],"exp":"傷寒雑病論は後漢末の張仲景の著。陶弘景は神農本草経を整理・注釈した人物、丹波康頼は医心方の編者、李時珍は明代の『本草綱目』の著者、吉益東洞は江戸の古方派の医家。","level":2},
{"cat":"総論","sub":"古典","type":"single","q":"傷寒雑病論が成立した時代はどれか。","choices":["周","後漢","唐","宋","明"],"answer":[1],"exp":"傷寒雑病論は後漢（末期）に張仲景によって著された。","level":2},
{"cat":"総論","sub":"古典","type":"tf","q":"傷寒雑病論は、後に『傷寒論』と『金匱要略』に分かれて伝えられた。","choices":["正しい","誤り"],"answer":[0],"exp":"傷寒雑病論は散逸・再編を経て、急性熱性疾患を扱う傷寒論と、慢性疾患（雑病）を扱う金匱要略の2書として伝えられた。","level":1},
{"cat":"総論","sub":"古典","type":"tf","q":"傷寒論は慢性疾患を、金匱要略は急性熱性疾患を主に扱う。","choices":["正しい","誤り"],"answer":[1],"exp":"逆。傷寒論＝急性熱性疾患、金匱要略＝慢性疾患（雑病）。","level":1},
{"cat":"総論","sub":"古典","type":"single","q":"黄帝内経を構成する2つの書の組合せとして正しいものはどれか。","choices":["上経と下経","医心方と啓迪集","本草と方剤","傷寒論と金匱要略","素問と霊枢"],"answer":[4],"exp":"黄帝内経は『素問』と『霊枢』から成る。霊枢は鍼灸を中心に記載。傷寒論と金匱要略は傷寒雑病論が分かれたもの。","level":2},
{"cat":"総論","sub":"古典","type":"tf","q":"黄帝内経は薬物を上品・中品・下品に分類した薬物書である。","choices":["正しい","誤り"],"answer":[1],"exp":"薬物を三品分類したのは神農本草経。黄帝内経は陰陽五行説などに基づく医学理論と鍼灸の書。","level":1},
{"cat":"総論","sub":"古典","type":"tf","q":"黄帝内経のうち『霊枢』は主に鍼灸について記載している。","choices":["正しい","誤り"],"answer":[0],"exp":"霊枢は鍼灸の理論・技術を中心とし『鍼経』とも呼ばれる。素問は生理・病理などの医学理論が中心。","level":2},
{"cat":"総論","sub":"古典","type":"single","q":"医心方の編者はだれか。","choices":["丹波康頼","吉益東洞","田代三喜","華岡青洲","曲直瀬道三"],"answer":[0],"exp":"医心方は平安時代（984年）に丹波康頼が編纂し朝廷に献上した、現存する日本最古の医学書（全30巻）。中国の多数の医書を引用・編纂したもの。","level":1},
{"cat":"総論","sub":"古典","type":"single","q":"医心方が成立した時代はどれか。","choices":["奈良時代","平安時代","鎌倉時代","室町時代","江戸時代"],"answer":[1],"exp":"医心方は平安時代中期の984年に丹波康頼が撰述した。","level":1},
{"cat":"総論","sub":"古典","type":"tf","q":"医心方は現存する日本最古の医学書である。","choices":["正しい","誤り"],"answer":[0],"exp":"丹波康頼が984年（平安時代）に編纂した全30巻の医書で、現存する日本最古の医学書。","level":1},
{"cat":"総論","sub":"古典","type":"tf","q":"医心方は中国で著された鍼灸の古典である。","choices":["正しい","誤り"],"answer":[1],"exp":"医心方は日本（平安時代）で丹波康頼が編纂した医書。鍼灸の中国古典は黄帝内経（霊枢）。","level":1},
{"cat":"総論","sub":"古典","type":"single","q":"次の古典とその主な内容の組合せで正しいものはどれか。","choices":["金匱要略－日本最古の医学書","黄帝内経－薬物の三品分類","医心方－慢性疾患の治療のみを記載した中国の書","神農本草経－鍼灸の理論","傷寒論－急性熱性疾患の薬物療法"],"answer":[4],"exp":"黄帝内経＝医学理論・鍼灸、神農本草経＝薬物の三品分類、傷寒論＝急性熱性疾患、金匱要略＝慢性疾患（雑病）、医心方＝日本最古の医書（丹波康頼）。","level":1},
{"cat":"総論","sub":"古典","type":"multi","q":"張仲景の傷寒雑病論に由来する書をすべて選べ。","choices":["傷寒論","金匱要略","黄帝内経","神農本草経","医心方"],"answer":[0,1],"exp":"傷寒雑病論は傷寒論（急性熱性疾患）と金匱要略（雑病）に分かれて伝わった。黄帝内経・神農本草経は別の古典、医心方は日本の書。","level":1},
{"cat":"総論","sub":"神農本草経","type":"single","q":"神農本草経に収載されている薬物の総数はどれか。","choices":["120種","240種","365種","500種","730種"],"answer":[2],"exp":"上品120種・中品120種・下品125種の計365種（1年の日数に対応）。730種は後に陶弘景が増補した『神農本草経集注』の数。","level":1},
{"cat":"総論","sub":"神農本草経","type":"single","q":"神農本草経の上品（上薬）の説明として正しいものはどれか。","choices":["外用のみに用いる","病気の治療薬で毒が多く、長期連用してはならない","鉱物性生薬のみからなる","養性の薬で、無毒にも有毒にもなる","生命を養い、長期連用しても害がない"],"answer":[4],"exp":"上品＝養命（生命を養う）、無毒で多量・長期に服用しても害がない。中品＝養性、無毒・有毒あり。下品＝治病、毒が多く長期連用不可。","level":1},
{"cat":"総論","sub":"神農本草経","type":"single","q":"神農本草経の下品（下薬）の説明として正しいものはどれか。","choices":["養性を目的とし、無毒にも有毒にもなる","生命を養い、長期連用しても害がない","病気の治療を目的とし、毒が多いので長期連用してはならない","体力を養い、無毒のもののみ","不老長寿の仙薬である"],"answer":[2],"exp":"下品（125種）は治病を主とし、毒が多いため長く服用してはならない。","level":1},
{"cat":"総論","sub":"神農本草経","type":"single","q":"神農本草経の中品（中薬）の説明として正しいものはどれか。","choices":["養性（体力を養う）を目的とし、無毒にも有毒にもなる","生命を養い長期連用しても害がない","すべて鉱物である","125種からなる","治療を目的とし毒が多い"],"answer":[0],"exp":"中品（120種）は養性を主とし、使い方によって無毒にも有毒にもなるので、適宜量を考えて用いる。","level":1},
{"cat":"総論","sub":"神農本草経","type":"multi","q":"神農本草経の上品についての記述として正しいものをすべて選べ。","choices":["生命を養う薬とされる","長期連用しても害がないとされる","120種が収載されている","毒が多く長期連用してはならない","病気の治療を主目的とする","君薬に当てられている"],"answer":[0,1,2,5],"exp":"上品は120種、養命・無毒で久服しても人を傷つけない。序録では上薬を君、中薬を臣、下薬を佐使としている。毒が多く治療目的なのは下品。","level":3},
{"cat":"総論","sub":"神農本草経","type":"tf","q":"神農本草経の下品は125種である。","choices":["正しい","誤り"],"answer":[0],"exp":"上品120種、中品120種、下品125種、計365種。","level":2},
{"cat":"総論","sub":"神農本草経","type":"tf","q":"神農本草経の下品は120種、上品は125種である。","choices":["正しい","誤り"],"answer":[1],"exp":"上品120種・中品120種・下品125種。125種なのは下品。","level":2},
{"cat":"総論","sub":"神農本草経","type":"tf","q":"神農本草経の中品は、使い方により無毒にも有毒にもなるとされる。","choices":["正しい","誤り"],"answer":[0],"exp":"中品は養性を主とし、無毒のものも有毒のものも含む。","level":1},
{"cat":"総論","sub":"神農本草経","type":"tf","q":"神農本草経では上薬を君、中薬を臣、下薬を佐使に当てている。","choices":["正しい","誤り"],"answer":[0],"exp":"神農本草経の序録に「上薬一百二十種為君…中薬一百二十種為臣…下薬一百二十五種為佐使」とある。処方構成の君臣佐使の考え方の源流。","level":3},
{"cat":"総論","sub":"神農本草経","type":"tf","q":"神農本草経の上品は、作用が強いため短期間のみ使用すべき薬とされる。","choices":["正しい","誤り"],"answer":[1],"exp":"上品は養命の薬で、長期連用しても害がない。短期使用が求められるのは毒の多い下品。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"日本で古方派が出現した時期はどれか。","choices":["平安時代","鎌倉時代","室町時代","江戸時代中期","明治時代"],"answer":[3],"exp":"古方派は江戸時代中期に出現し、傷寒雑病論（傷寒論・金匱要略）を重視して実証的な医学を唱えた。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"古方派が特に重視した古典はどれか。","choices":["黄帝内経","医心方","本草綱目","和剤局方","傷寒雑病論"],"answer":[4],"exp":"古方派は後世派の観念的な金元医学を批判し、張仲景の傷寒雑病論（傷寒論・金匱要略）への回帰を唱えた。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"「万病一毒説」を唱えた古方派の医家はだれか。","choices":["後藤艮山","吉益東洞","和田東郭","名古屋玄医","香川修庵"],"answer":[1],"exp":"吉益東洞は「万病は一毒による」とする万病一毒説を唱え、毒を攻撃する治療を重視した。著書に『類聚方』『薬徴』。後藤艮山は一気留滞説。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"multi","q":"古方派に属する医家をすべて選べ。","choices":["名古屋玄医","後藤艮山","香川修庵","吉益東洞","曲直瀬道三","田代三喜","浅田宗伯"],"answer":[0,1,2,3],"exp":"古方派：名古屋玄医（先駆者）、後藤艮山、香川修庵、山脇東洋、吉益東洞など。田代三喜・曲直瀬道三は後世派、浅田宗伯は折衷派。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"明に渡って金元医学（李朱医学）を学んで帰国し、後世派の基礎を築いたとされる医家はだれか。","choices":["華岡青洲","田代三喜","丹波康頼","吉益東洞","浅田宗伯"],"answer":[1],"exp":"田代三喜は明で李東垣・朱丹渓らの金元医学（李朱医学）を学び帰国。その弟子曲直瀬道三が後世派を大成した。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"後世派が栄えた時代として最も適切なものはどれか。","choices":["奈良時代","平安時代","室町〜安土桃山時代","江戸時代後期","明治時代"],"answer":[2],"exp":"後世派は室町時代〜安土桃山時代に田代三喜・曲直瀬道三によって広まった。古方派は江戸中期、折衷派は江戸後期。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"後世派の医学の基盤となったものはどれか。","choices":["古典の文献考証","傷寒雑病論への回帰","金元医学（李朱医学）","万病一毒説","オランダ医学"],"answer":[2],"exp":"後世派は中国の金・元時代の医学（李東垣・朱丹渓の李朱医学）を基盤とする。傷寒雑病論への回帰は古方派、万病一毒説は吉益東洞、文献考証は考証学派。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"京都に医学校「啓迪院」を開き、『啓迪集』を著した後世派の医家はだれか。","choices":["和田東郭","山脇東洋","香川修庵","曲直瀬道三","田代三喜"],"answer":[3],"exp":"曲直瀬道三は田代三喜に学び、後世派を大成した。啓迪院を開いて多くの弟子を育て、『啓迪集』を著した。","level":3},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"江戸時代後期に、古方派と後世派の長所を取り入れた学派はどれか。","choices":["折衷派","古方派","蘭方","李朱医学","後世派"],"answer":[0],"exp":"折衷派は古方と後世方の良いところを採り入れた学派で、和田東郭・浅田宗伯らが知られる。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"multi","q":"折衷派の医家として挙げられる人物をすべて選べ。","choices":["和田東郭","浅田宗伯","吉益東洞","田代三喜","名古屋玄医"],"answer":[0,1],"exp":"折衷派：和田東郭、浅田宗伯など（江戸後期〜明治初期）。吉益東洞・名古屋玄医は古方派、田代三喜は後世派。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"通仙散（麻沸散）による全身麻酔を用いて乳がん手術を行った医家はだれか。","choices":["杉田玄白","吉益東洞","山脇東洋","華岡青洲","曲直瀬道三"],"answer":[3],"exp":"華岡青洲は曼陀羅華（チョウセンアサガオ）などを配合した通仙散を用いて全身麻酔下の乳がん摘出手術に成功した。漢方と蘭方を折衷した外科医。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"紫雲膏は華岡青洲が創方した軟膏である。","choices":["正しい","誤り"],"answer":[0],"exp":"紫雲膏は華岡青洲が中国の潤肌膏をもとに創方したとされる。紫根・当帰をゴマ油・蜜蝋・豚脂で製した軟膏。","level":3},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"日本で初めて官許の人体解剖を行い『臓志』を著した古方派の医家はだれか。","choices":["和田啓十郎","吉益東洞","山脇東洋","後藤艮山","華岡青洲"],"answer":[2],"exp":"山脇東洋（古方派、後藤艮山の門人）は人体解剖を行い『臓志』を著した。","level":3},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"後藤艮山は「一気留滞説」を唱えた。","choices":["正しい","誤り"],"answer":[0],"exp":"後藤艮山は病の原因を一元気の留滞にあるとする一気留滞説を唱えた古方派の医家。","level":3},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"吉益東洞の子、吉益南涯は気血水説を唱えた。","choices":["正しい","誤り"],"answer":[0],"exp":"吉益南涯は万病一毒説を発展させ、毒が気・血・水に乗じて病を起こすとする気血水説を唱えた。","level":3},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"名古屋玄医は古方派の先駆者とされる。","choices":["正しい","誤り"],"answer":[0],"exp":"名古屋玄医は傷寒論の重視を唱えた古方派の先駆者。後藤艮山・香川修庵・吉益東洞らが続く。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"考証学派は、古典医書を文献学的に研究・校訂した学派である。","choices":["正しい","誤り"],"answer":[0],"exp":"江戸後期の考証学派（多紀氏ら）は古医書の文献考証・校勘に業績を残した。","level":3},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"吉益東洞は後世派の代表的医家である。","choices":["正しい","誤り"],"answer":[1],"exp":"吉益東洞は古方派の代表的医家（万病一毒説）。後世派は田代三喜・曲直瀬道三。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"「漢方」という名称の由来として正しいものはどれか。","choices":["韓国の伝統医学の呼称","中国の漢の時代に名付けられた","江戸時代に伝来したオランダ医学（蘭方）と区別するための呼称","平安時代に丹波康頼が命名した","明治政府が正式に定めた名称"],"answer":[2],"exp":"江戸時代にオランダ医学（蘭方）が伝わり、それと区別するため従来の中国伝来の医学を「漢方」と呼んだ。中国での伝統医学は中医学。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"「漢方」は中国で用いられている伝統医学の正式名称である。","choices":["正しい","誤り"],"answer":[1],"exp":"漢方は日本独自の呼称（蘭方に対する呼称）で、日本で独自に発展した伝統医学を指す。中国の伝統医学は中医学。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"江戸時代にオランダを通じて伝わった西洋医学を何と呼んだか。","choices":["和方","蘭方","漢方","古方","後世方"],"answer":[1],"exp":"オランダ医学を蘭方と呼び、これに対して従来の医学を漢方と呼ぶようになった。杉田玄白らの『解体新書』は蘭方の代表的業績。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"明治政府の漢方に対する対応として正しいものはどれか。","choices":["漢方薬の使用を法律で全面禁止した","西洋医学（ドイツ医学）を採用し、漢方を保護しなかった","漢方を国の正式な医学として保護した","漢方医専用の免許制度を新設した","漢方と西洋医学を同等に教育する医学校を設立した"],"answer":[1],"exp":"明治政府は西洋医学を採用し、医制（1874年）・医師免許制度により西洋医学を修めた者のみを医師としたため、漢方は保護されず衰退した。漢方薬の使用自体が禁止されたわけではない。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"明治政府が西洋医学に基づく医療制度の基本として「医制」を公布した年はどれか。","choices":["1868年","1874年","1895年","1967年","1976年"],"answer":[1],"exp":"1874年（明治7年）に医制が公布され、西洋医学を基本とする医事制度が定められた。1967年・1976年は漢方エキス製剤の薬価収載。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"明治期の医師免許制度により、医師になるには西洋医学を修める必要があった。","choices":["正しい","誤り"],"answer":[0],"exp":"医術開業試験・医師免許規則は西洋医学に基づく内容で、漢方のみを学んだ者は医師になれなくなった。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"明治末期に『医界之鉄椎』を著し、漢方の復興を訴えた人物はだれか。","choices":["和田啓十郎","華岡青洲","浅田宗伯","湯本求真","吉益東洞"],"answer":[0],"exp":"西洋医学を学んだ医師・和田啓十郎が『医界之鉄椎』で漢方医学の価値を訴え、昭和の漢方復興の契機となった。湯本求真はこれに感銘を受け『皇漢医学』を著した。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"『皇漢医学』を著した人物はだれか。","choices":["香川修庵","湯本求真","丹波康頼","曲直瀬道三","和田啓十郎"],"answer":[1],"exp":"湯本求真は和田啓十郎の『医界之鉄椎』に影響を受けて漢方を学び、昭和初期に『皇漢医学』を著した。","level":2},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"医療用漢方エキス製剤が初めて薬価収載（4処方）された年はどれか。","choices":["1874年","1950年","1967年","1976年","2012年"],"answer":[2],"exp":"1967年に4処方の医療用漢方エキス製剤が初めて薬価基準に収載され、1976年に大幅に収載されて保険診療で広く使われるようになった。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"医療用漢方エキス製剤が大幅に薬価収載された年はどれか。","choices":["1874年","1967年","1976年","1995年","2012年"],"answer":[2],"exp":"1967年に初めて4処方が収載、1976年に大幅に収載された。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"医療用漢方エキス製剤は1976年に初めて薬価収載された。","choices":["正しい","誤り"],"answer":[1],"exp":"初めて収載されたのは1967年（4処方）。1976年は大幅収載。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"multi","q":"日本の漢方の歴史について正しいものをすべて選べ。","choices":["江戸時代中期に古方派が出現し、傷寒雑病論を重視した","明治政府は西洋医学を採用し、漢方を保護しなかった","1967年に医療用漢方エキス製剤4処方が初めて薬価収載された","1976年に医療用漢方エキス製剤が大幅に薬価収載された","後世派は江戸時代後期に出現した","医心方は江戸時代に編纂された"],"answer":[0,1,2,3],"exp":"後世派は室町〜安土桃山時代、医心方は平安時代（984年）。他はすべて正しい。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"tf","q":"明治政府は漢方医学を保護し、漢方医の養成を推進した。","choices":["正しい","誤り"],"answer":[1],"exp":"明治政府は西洋医学を採用し、漢方を保護しなかった。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"次の学派・医学を時代の古い順に並べたものとして正しいものはどれか。","choices":["古方派→折衷派→後世派","後世派→古方派→折衷派","後世派→折衷派→古方派","折衷派→古方派→後世派","古方派→後世派→折衷派"],"answer":[1],"exp":"後世派（室町〜安土桃山）→古方派（江戸中期）→折衷派（江戸後期）。","level":2},
{"cat":"総論","sub":"伝統医学比較","type":"single","q":"中国の伝統医学の呼称として最も適切なものはどれか。","choices":["蘭方","中医学","漢方","ユナニ医学","韓医学"],"answer":[1],"exp":"中国の伝統医学は中医学（中医薬学）。日本で独自に発展したものが漢方、韓国の伝統医学が韓医学。","level":1},
{"cat":"総論","sub":"伝統医学比較","type":"single","q":"韓医学で李済馬が提唱した、体質を4つに分けて治療する医学はどれか。","choices":["気血水説","李朱医学","万病一毒説","弁証論治","四象医学"],"answer":[4],"exp":"四象医学は李済馬が提唱した韓医学独自の体質医学（太陽人・少陽人・太陰人・少陰人）。","level":3},
{"cat":"総論","sub":"伝統医学比較","type":"tf","q":"日本には漢方医専用の医師免許があり、医師免許とは別に取得する必要がある。","choices":["正しい","誤り"],"answer":[1],"exp":"日本には漢方専門の免許はなく、医師（西洋医学の医師免許）が漢方薬を処方する。韓国には韓医師、中国には中医師の資格がある。","level":1},
{"cat":"総論","sub":"伝統医学比較","type":"tf","q":"韓国では、西洋医学の医師とは別に韓医師という資格がある。","choices":["正しい","誤り"],"answer":[0],"exp":"韓国では韓医師、中国では中医師という独自の資格がある。日本は医師が西洋医学と漢方の両方を扱う。","level":2},
{"cat":"総論","sub":"伝統医学比較","type":"tf","q":"『東医宝鑑』は朝鮮の許浚が著した医書である。","choices":["正しい","誤り"],"answer":[0],"exp":"東医宝鑑は朝鮮王朝時代に許浚が編纂した医書で、韓医学の代表的古典。","level":3},
{"cat":"総論","sub":"伝統医学比較","type":"tf","q":"日本の漢方は、中国の中医学に比べて1日あたりの生薬量が少ない傾向がある。","choices":["正しい","誤り"],"answer":[0],"exp":"日本の漢方処方は一般に中医学より1日量が少ない。","level":2},
{"cat":"総論","sub":"伝統医学比較","type":"tf","q":"腹診は日本の漢方で特に発達した診察法である。","choices":["正しい","誤り"],"answer":[0],"exp":"腹診は江戸時代の日本で発達し、日本漢方の特徴の一つとされる。","level":2},
{"cat":"総論","sub":"伝統医学比較","type":"multi","q":"日本の漢方の特徴として正しいものをすべて選べ。","choices":["中国伝来の医学をもとに日本で独自に発展した","通常は複数の生薬を組み合わせて用いる","鉱物性生薬も用いる","証に随って処方を決める（随証治療）","植物性生薬のみを用いる","病名のみから処方を一律に決める"],"answer":[0,1,2,3],"exp":"漢方は日本で独自に発展し、植物・動物・鉱物由来の生薬を複数組み合わせ、証に基づいて処方する。","level":1},
{"cat":"総論","sub":"伝統医学比較","type":"tf","q":"漢方は中国から伝わった医学が、日本の風土や日本人の体質に合わせて独自に発展したものである。","choices":["正しい","誤り"],"answer":[0],"exp":"漢方は5〜6世紀頃以降に中国から伝わり、日本で独自に発展した伝統医学。","level":1},
{"cat":"総論","sub":"生薬","type":"single","q":"生薬の説明として最も適切なものはどれか。","choices":["植物の有効成分を純粋に単離した化合物","遺伝子組換えで生産したタンパク質","化学合成した有効成分を製剤化したもの","微生物が産生する抗生物質","植物・動物・鉱物などの天然物の薬用部分を、乾燥など簡単な加工をして用いるもの"],"answer":[4],"exp":"生薬は天然物（植物・動物・鉱物）の薬用部分をそのまま、または乾燥・切断などの簡単な加工（修治）をして用いるもの。","level":1},
{"cat":"総論","sub":"生薬","type":"multi","q":"鉱物性生薬をすべて選べ。","choices":["石膏","芒硝","滑石","甘草","牛黄","牡蛎"],"answer":[0,1,2],"exp":"石膏（含水硫酸カルシウム）、芒硝（硫酸ナトリウム）、滑石は鉱物性生薬。甘草は植物性、牛黄（ウシの胆石）・牡蛎（カキの貝殻）は動物性生薬。","level":2},
{"cat":"総論","sub":"生薬","type":"single","q":"次のうち動物性生薬はどれか。","choices":["石膏","芍薬","甘草","桂皮","牛黄"],"answer":[4],"exp":"牛黄はウシの胆嚢中に生じた結石で動物性生薬。甘草・桂皮・芍薬は植物性、石膏は鉱物性。","level":2},
{"cat":"総論","sub":"生薬","type":"tf","q":"漢方薬には植物性生薬のみが用いられ、鉱物は用いられない。","choices":["正しい","誤り"],"answer":[1],"exp":"石膏・芒硝・滑石などの鉱物性生薬、牛黄・牡蛎などの動物性生薬も用いられる。","level":1},
{"cat":"総論","sub":"生薬","type":"tf","q":"漢方薬は通常、複数の生薬を組み合わせて構成される。","choices":["正しい","誤り"],"answer":[0],"exp":"漢方薬は原則として複数の生薬を一定の割合で組み合わせた処方（方剤）として用いる。","level":1},
{"cat":"総論","sub":"生薬","type":"tf","q":"甘草湯は甘草1種類のみからなる処方である。","choices":["正しい","誤り"],"answer":[0],"exp":"漢方薬は通常複数の生薬からなるが、甘草湯のように1種類の生薬からなる処方も例外的に存在する。","level":3},
{"cat":"総論","sub":"生薬","type":"tf","q":"石膏の主成分は含水硫酸カルシウムである。","choices":["正しい","誤り"],"answer":[0],"exp":"石膏はCaSO4・2H2Oを主成分とする鉱物性生薬で、白虎湯・麻杏甘石湯などに配合される。","level":3},
{"cat":"総論","sub":"生薬","type":"single","q":"民間薬と漢方薬の違いとして正しいものはどれか。","choices":["民間薬は古典に基づき複数生薬を組み合わせて処方する","漢方薬は1種類の生薬を経験的に用いるものである","民間薬は主に単一の生薬を経験的に用い、漢方薬は理論に基づき複数の生薬を組み合わせる","両者に違いはない","民間薬は医療用医薬品として保険適用される"],"answer":[2],"exp":"ドクダミ・ゲンノショウコ・センブリなどの民間薬は単一生薬を経験的に用いるもので、用量・適応が厳密ではない。漢方薬は古典・理論に基づき複数生薬を組み合わせ、証に従って用いる。","level":2},
{"cat":"総論","sub":"生薬","type":"tf","q":"ゲンノショウコやドクダミは、一般に民間薬として用いられる。","choices":["正しい","誤り"],"answer":[0],"exp":"これらは単味で経験的に用いられる代表的な民間薬。","level":2},
{"cat":"総論","sub":"生薬","type":"tf","q":"漢方薬は天然物由来なので副作用はない。","choices":["正しい","誤り"],"answer":[1],"exp":"漢方薬にも副作用はある（例：甘草による偽アルドステロン症、麻黄による動悸・血圧上昇など）。","level":1},
{"cat":"総論","sub":"生薬","type":"tf","q":"生薬の品質規格は日本薬局方などで定められている。","choices":["正しい","誤り"],"answer":[0],"exp":"多くの生薬は日本薬局方（局方）に収載され、性状・確認試験・純度試験などの規格が定められている。局方外のものは日本薬局方外生薬規格などで規定される。","level":2},
{"cat":"総論","sub":"剤形","type":"single","q":"煎剤（湯剤）の説明として正しいものはどれか。","choices":["生薬を水で煎じて煮出し、かすを除いた液剤","生薬を油脂などで練り合わせた外用剤","生薬を粉末にして混和したもの","煎じ液を濃縮・乾燥して顆粒などにしたもの","生薬の粉末を蜂蜜などで丸く固めたもの"],"answer":[0],"exp":"煎剤（湯）は刻んだ生薬を水で煎じて有効成分を抽出し、かすを除いた液。処方名に「湯」が付く（例：葛根湯）。粉末＝散剤、蜂蜜で丸める＝丸剤、濃縮乾燥＝エキス剤、外用の練り合わせ＝軟膏剤。","level":1},

{"cat":"総論","sub":"生薬","type":"single","q":"漢方薬について正しいものはどれか。","choices":["漢方薬は通常、単一の生薬のみからなる","漢方薬は病名のみに基づいて選択される","漢方薬には副作用がない","漢方薬には鉱物性生薬も用いられる","漢方は中国でのみ発展した医学である"],"answer":[3],"exp":"漢方薬は通常複数の生薬を配合し、植物性に加え動物性・鉱物性生薬（石膏など）も用いる。漢方は日本で独自に発展し、証に基づいて処方を選ぶ。副作用もある。","level":1},
{"cat":"総論","sub":"古典","type":"single","q":"神農本草経に記載された薬物の分類として正しいものはどれか。","choices":["素問・霊枢の2分類","君・臣・佐・使の4分類","太陽・陽明・少陽の3分類","上品・中品・下品の3分類","寒・熱・温・涼の4分類"],"answer":[3],"exp":"神農本草経は365種の薬物を上品（120種）・中品（120種）・下品（125種）に分類した。太陽・陽明・少陽などは傷寒論の病期、素問・霊枢は黄帝内経の構成。","level":1},
{"cat":"総論","sub":"日本漢方史","type":"single","q":"古方派が批判の対象とした、金元医学に基づく学派はどれか。","choices":["後世派","蘭方","中医学","折衷派","考証学派"],"answer":[0],"exp":"古方派は、金元医学（李朱医学）に基づく後世派の観念的な理論を批判し、傷寒雑病論への回帰を唱えた。","level":2},
{"cat":"総論","sub":"剤形","type":"single","q":"次のうち、処方名から本来の剤形が丸剤であるとわかるものはどれか。","choices":["紫雲膏","葛根湯","桂枝茯苓丸","五苓散","当帰芍薬散"],"answer":[2],"exp":"「丸」が付く桂枝茯苓丸が丸剤。葛根湯＝煎剤、五苓散・当帰芍薬散＝散剤、紫雲膏＝軟膏剤。","level":1},
{"cat":"総論","sub":"漢方製剤","type":"single","q":"漢方製剤について誤っているものはどれか。","choices":["一般用と医療用で処方数が異なる","メーカーにより生薬の配合量が異なることがある","指標成分の定量などにより品質が確保されている","医療用漢方製剤の主流は煎剤である","医療用漢方製剤は148処方である"],"answer":[3],"exp":"医療用漢方製剤の主流はエキス剤。他は正しい（一般用約294処方、医療用148処方）。","level":1},
{"cat":"基礎理論","sub":"治療原則","type":"single","q":"漢方治療の基本原則として最も適切なものはどれか。","choices":["病名に基づいて画一的に漢方薬を選択する","患者の状態（証）を総合的に判断して漢方薬を選択する","検査値の異常のみに基づいて漢方薬を選択する","患者の年齢のみで漢方薬を選択する","症状が最も強い部位のみに注目して漢方薬を選択する"],"answer":[1],"exp":"漢方治療は「随証治療」が原則で、患者の体質・症状・病態（証）を総合的に判断して処方を決める。病名のみ・検査値のみ・年齢のみ・局所のみで選ぶのは漢方の原則ではない。","level":1},
{"cat":"基礎理論","sub":"治療原則","type":"single","q":"漢方において、患者の体質や病態を総合的に判断して得られる「処方決定のための指標」を何というか。","choices":["証","病名","症候群","主訴","体質"],"answer":[0],"exp":"「証」は患者の状態を気血水・陰陽・虚実・寒熱・表裏などの観点から総合的に捉えた診断であり、処方選択の指標となる（方証相対）。","level":1},
{"cat":"基礎理論","sub":"治療原則","type":"single","q":"証に従って治療を行うことを何というか。","choices":["対症療法","随証治療","原因療法","予防療法","補充療法"],"answer":[1],"exp":"随証治療：証に随って（従って）治療すること。漢方治療の基本原則である。","level":1},
{"cat":"基礎理論","sub":"治療原則","type":"tf","q":"同じ病名であっても、患者の証が異なれば異なる漢方薬が用いられることを「同病異治」という。","choices":["正しい","誤り"],"answer":[0],"exp":"同病異治：同じ病気でも証が違えば別の処方を用いる。逆に異なる病気でも証が同じなら同じ処方を用いることを「異病同治」という。","level":2},
{"cat":"基礎理論","sub":"治療原則","type":"tf","q":"異なる病名であっても、証が同じであれば同じ漢方薬が用いられることを「同病異治」という。","choices":["正しい","誤り"],"answer":[1],"exp":"これは「異病同治」の説明。同病異治は同じ病気でも証が違えば別の処方を用いること。","level":2},
{"cat":"基礎理論","sub":"治療原則","type":"tf","q":"漢方医学では、虚証には補う治療（補法）、実証には余分なものを取り除く治療（瀉法）を行うのが原則である。","choices":["正しい","誤り"],"answer":[0],"exp":"「虚すれば補い、実すれば瀉す」が原則。虚証には補剤（例：補中益気湯、十全大補湯）、実証には瀉剤（例：大承気湯など）を用いる。","level":1},
{"cat":"基礎理論","sub":"治療原則","type":"multi","q":"汗吐下（かんとげ）の三法に含まれる治療法をすべて選べ。","choices":["発汗","催吐","瀉下","温補","和解","利水"],"answer":[0,1,2],"exp":"汗吐下の三法は、病邪を体外に出す古典的な攻撃的治療法で「汗法（発汗）」「吐法（催吐）」「下法（瀉下）」を指す。温補・和解・利水は含まれない。","level":2},
{"cat":"基礎理論","sub":"治療原則","type":"tf","q":"寒証には体を温める温熱性の薬を、熱証には体を冷ます寒涼性の薬を用いるのが原則である。","choices":["正しい","誤り"],"answer":[0],"exp":"寒には熱（温）を、熱には寒（涼）を用いる（「寒する者はこれを熱し、熱する者はこれを寒す」）。","level":1},
{"cat":"基礎理論","sub":"治療原則","type":"single","q":"体力を補い、虚証の患者に用いる漢方薬を何と呼ぶか。","choices":["瀉剤","補剤","下剤","吐剤","発表剤"],"answer":[1],"exp":"補剤は不足しているもの（気・血など）を補う処方で虚証に用いる。代表：補中益気湯、十全大補湯、人参養栄湯など。瀉剤は実証の邪を除く。","level":1},
{"cat":"基礎理論","sub":"治療原則","type":"tf","q":"表証と裏証が同時に存在する場合、原則としてまず表証を治療し、その後に裏証を治療する（先表後裏）。","choices":["正しい","誤り"],"answer":[0],"exp":"『傷寒論』の原則は「先表後裏」。ただし裏証が急を要する（例：裏寒で下痢が激しい）場合は先に裏を救う。","level":3},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"漢方における「気」の説明として最も適切なものはどれか。","choices":["生命活動を維持するためのエネルギー","血液とその働き","血液以外の体液","外界から侵入する病邪","体内に停滞した老廃物"],"answer":[0],"exp":"気は目に見えない生命エネルギー（生命活動を営む根源的エネルギー）。血は血液とその働き（栄養・滋潤）、水（津液）は血以外の体液を指す。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"漢方における「血（けつ）」の説明として最も適切なものはどれか。","choices":["生命活動を維持するエネルギー","血液とその働き（全身の栄養・滋潤）","血液以外の体液（リンパ液、汗、尿など）","精神活動のみを指す概念","消化吸収の働きのみを指す概念"],"answer":[1],"exp":"血は赤色の体液である血液とその働き（全身を栄養し潤す）を指す。気が血を運ぶ（気は血の帥）。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"漢方における「水（すい）」（津液）の説明として最も適切なものはどれか。","choices":["生命活動のエネルギー","赤色の体液である血液","血液以外の体液","飲食物そのもの","外邪の一種"],"answer":[2],"exp":"水（津液）は血以外の無色の体液（リンパ液、組織液、消化液、汗、尿など）を指す。その偏在・停滞を水毒（水滞）という。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"全身倦怠感、易疲労感、食欲不振、気力の低下がみられる。考えられる病態はどれか。","choices":["気虚","気逆","瘀血","水毒","血虚"],"answer":[0],"exp":"気虚は気の量的不足で、倦怠感・易疲労・食欲不振・気力低下・声に力がない・日中の眠気などを呈する。代表処方：四君子湯・六君子湯・補中益気湯。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"抑うつ気分、喉のつかえ感（咽中炙臠）、腹部膨満感がみられる。考えられる病態はどれか。","choices":["気虚","気鬱（気滞）","気逆","血虚","水毒"],"answer":[1],"exp":"気鬱（気滞）は気の巡りが滞った状態で、抑うつ・咽喉頭異常感（梅核気・咽中炙臠）・腹部膨満感・胸のつかえなどを呈する。代表処方：半夏厚朴湯・香蘇散。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"のぼせ、動悸、発作性の頭痛、冷えのぼせがみられる。考えられる病態はどれか。","choices":["気虚","気鬱","気逆","血虚","瘀血"],"answer":[2],"exp":"気逆は気が下から上へ逆行する状態で、のぼせ・動悸・発作性頭痛・冷えのぼせ（上熱下寒）・驚きやすい・顔面紅潮などを呈する。代表処方：苓桂朮甘湯、桂枝湯類（桂皮を含む処方）。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"皮膚の乾燥、髪が抜けやすい、爪がもろい、顔色不良、こむらがえりがみられる。考えられる病態はどれか。","choices":["瘀血","血虚","水毒","気逆","気鬱"],"answer":[1],"exp":"血虚は血の量的不足・機能低下で、皮膚乾燥・脱毛・爪がもろい・顔色不良・こむらがえり・目のかすみ・集中力低下などを呈する。代表処方：四物湯。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"目の下のくま、月経痛・月経異常、舌の暗紫色、細絡がみられる。考えられる病態はどれか。","choices":["血虚","瘀血","気虚","水毒","気鬱"],"answer":[1],"exp":"瘀血は血の流れが滞った状態で、目の下のくま・月経痛/月経異常・舌の暗紫色・細絡（毛細血管拡張）・口唇の暗赤化・小腹急結・臍傍圧痛などを呈する。代表処方：桂枝茯苓丸・桃核承気湯・当帰芍薬散。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"めまい、浮腫、頭痛、尿量の異常、胃内停水がみられる。考えられる病態はどれか。","choices":["気逆","血虚","瘀血","水毒（水滞）","気虚"],"answer":[3],"exp":"水毒（水滞）は水の偏在・停滞で、めまい・浮腫・頭痛（頭重）・尿量異常（減少/増加）・胃内停水（振水音）・水様性下痢・舌の歯痕などを呈する。代表処方：五苓散・苓桂朮甘湯。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"multi","q":"瘀血の症状・所見として適切なものをすべて選べ。","choices":["目の下のくま","月経痛","舌の暗紫色","細絡","胃内停水","咽中炙臠","小腹急結"],"answer":[0,1,2,3,6],"exp":"瘀血の所見：目の下のくま、月経痛・月経異常、舌の暗紫色、細絡、小腹急結、臍傍圧痛など。胃内停水は水毒、咽中炙臠（喉のつかえ）は気鬱の所見。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"multi","q":"血虚の症状として適切なものをすべて選べ。","choices":["皮膚の乾燥","髪が抜けやすい","爪がもろい","こむらがえり","目の下のくま","浮腫"],"answer":[0,1,2,3],"exp":"血虚：皮膚乾燥・脱毛・爪がもろい・こむらがえり・顔色不良など。目の下のくまは瘀血、浮腫は水毒の症状。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"multi","q":"水毒（水滞）の症状・所見として適切なものをすべて選べ。","choices":["めまい","浮腫","尿量の異常","胃内停水（振水音）","細絡","爪がもろい"],"answer":[0,1,2,3],"exp":"水毒：めまい・浮腫・頭痛・尿量異常・胃内停水（振水音）・水様性下痢など。細絡は瘀血、爪がもろいのは血虚。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"multi","q":"気虚の症状として適切なものをすべて選べ。","choices":["全身倦怠感","易疲労感","食欲不振","のぼせ","月経痛","気力の低下"],"answer":[0,1,2,5],"exp":"気虚：全身倦怠・易疲労・食欲不振・気力低下など。のぼせは気逆、月経痛は瘀血。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"multi","q":"気逆の症状として適切なものをすべて選べ。","choices":["のぼせ","動悸","発作性の頭痛","冷えのぼせ","皮膚の乾燥","腹部膨満感"],"answer":[0,1,2,3],"exp":"気逆：のぼせ・動悸・発作性頭痛・冷えのぼせなど。皮膚乾燥は血虚、腹部膨満感は気鬱（気滞）。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"multi","q":"気鬱（気滞）の症状として適切なものをすべて選べ。","choices":["抑うつ気分","喉のつかえ感","腹部膨満感","こむらがえり","目の下のくま","めまい"],"answer":[0,1,2],"exp":"気鬱：抑うつ・喉のつかえ（梅核気・咽中炙臠）・腹部膨満感・胸のつかえなど。こむらがえりは血虚、目の下のくまは瘀血、めまいは水毒の代表症状。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"咽喉部に炙った肉片が付着しているような異物感（咽中炙臠・梅核気）を訴える患者に用いる代表的な漢方薬はどれか。","choices":["半夏厚朴湯","桂枝茯苓丸","四物湯","五苓散","補中益気湯"],"answer":[0],"exp":"咽中炙臠（梅核気）は気鬱の代表的症状で、半夏厚朴湯の適応。桂枝茯苓丸＝瘀血、四物湯＝血虚、五苓散＝水毒、補中益気湯＝気虚。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"気虚に用いる代表的な漢方薬はどれか。","choices":["補中益気湯","桃核承気湯","半夏厚朴湯","五苓散","四物湯"],"answer":[0],"exp":"気虚には人参・黄耆などを含む補気剤（四君子湯・六君子湯・補中益気湯）を用いる。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"血虚に用いる代表的な漢方薬（補血剤の基本処方）はどれか。","choices":["四君子湯","四物湯","五苓散","香蘇散","桂枝茯苓丸"],"answer":[1],"exp":"四物湯（当帰・芍薬・川芎・地黄）は補血の基本処方。四君子湯は補気の基本処方。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"瘀血に用いる代表的な漢方薬はどれか。","choices":["六君子湯","半夏厚朴湯","桂枝茯苓丸","五苓散","四君子湯"],"answer":[2],"exp":"瘀血には駆瘀血剤（桂枝茯苓丸・桃核承気湯・当帰芍薬散など）を用いる。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"水毒に用いる代表的な漢方薬（利水剤）はどれか。","choices":["五苓散","四物湯","桃核承気湯","香蘇散","補中益気湯"],"answer":[0],"exp":"五苓散（沢瀉・猪苓・茯苓・蒼朮/白朮・桂皮）は水毒の代表処方。口渇・尿量減少・浮腫・めまいなどに用いる。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"multi","q":"気虚に用いられる代表的な漢方薬をすべて選べ。","choices":["四君子湯","六君子湯","補中益気湯","桃核承気湯","半夏厚朴湯","四物湯"],"answer":[0,1,2],"exp":"補気剤：四君子湯・六君子湯・補中益気湯（いずれも人参を含む）。桃核承気湯は瘀血、半夏厚朴湯は気鬱、四物湯は血虚。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"multi","q":"瘀血に用いられる代表的な漢方薬をすべて選べ。","choices":["桂枝茯苓丸","桃核承気湯","当帰芍薬散","香蘇散","四君子湯","五苓散"],"answer":[0,1,2],"exp":"駆瘀血剤：桂枝茯苓丸（実証〜中間証）・桃核承気湯（実証）・当帰芍薬散（虚証、血虚・水毒も伴う）。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"multi","q":"気鬱（気滞）に用いられる代表的な漢方薬をすべて選べ。","choices":["半夏厚朴湯","香蘇散","四物湯","五苓散","桂枝茯苓丸"],"answer":[0,1],"exp":"気剤（理気剤）：半夏厚朴湯・香蘇散。厚朴・紫蘇葉・香附子などの気を巡らす生薬を含む。","level":2},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"気逆に用いられる代表的な漢方薬として最も適切なものはどれか。","choices":["苓桂朮甘湯","四物湯","四君子湯","桃核承気湯","補中益気湯"],"answer":[0],"exp":"苓桂朮甘湯は気逆（のぼせ・動悸・めまい）と水毒を伴う病態に用いる。桂皮は気の上衝を治す代表生薬で、桂枝湯類も気逆に用いられる。","level":2},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"下腹部痛を伴う虚証の女性で、冷え症、貧血傾向、浮腫、めまいがある。瘀血・血虚・水毒が併存すると考えられる場合の代表処方はどれか。","choices":["当帰芍薬散","桃核承気湯","大承気湯","麻黄湯","白虎湯"],"answer":[0],"exp":"当帰芍薬散は当帰・芍薬・川芎（血の薬）と茯苓・蒼朮・沢瀉（水の薬）を含み、虚証の瘀血・血虚・水毒に用いる。桃核承気湯は実証の瘀血、大承気湯・白虎湯は陽明病、麻黄湯は太陽病の実証。","level":2},
{"cat":"基礎理論","sub":"気血水","type":"tf","q":"気・血・水は互いに関連しあっており、気の異常が血や水の異常を引き起こすことがある。","choices":["正しい","誤り"],"answer":[0],"exp":"気血水は相互に関連する（例：気は血を巡らせるため、気滞から瘀血が生じうる）。そのため複数の病態が併存することが多い。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"tf","q":"血以外の体液を「血」と呼び、血液を「水」と呼ぶ。","choices":["正しい","誤り"],"answer":[1],"exp":"逆である。血液とその働きが「血」、血以外の体液が「水（津液）」。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"tf","q":"胃内停水（振水音）は水毒の所見である。","choices":["正しい","誤り"],"answer":[0],"exp":"心窩部を軽く叩くとポチャポチャと音がする振水音は、胃内に水が停滞している所見で水毒を示す（六君子湯・人参湯・苓桂朮甘湯などの使用目標）。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"tf","q":"細絡（皮膚の毛細血管の拡張）は血虚の代表的な所見である。","choices":["正しい","誤り"],"answer":[1],"exp":"細絡は瘀血の所見。血虚は皮膚乾燥・脱毛・爪がもろい・顔色不良などを呈する。","level":1},
{"cat":"基礎理論","sub":"気血水","type":"tf","q":"こむらがえり（腓腹筋のけいれん）は血虚の症状の一つとされる。","choices":["正しい","誤り"],"answer":[0],"exp":"血虚では筋が栄養されずこむらがえりを起こしやすいとされる。急性のこむらがえりには芍薬甘草湯が用いられる。","level":2},
{"cat":"基礎理論","sub":"気血水","type":"tf","q":"気虚の代表処方である四君子湯には人参が含まれる。","choices":["正しい","誤り"],"answer":[0],"exp":"四君子湯＝人参・白朮（蒼朮）・茯苓・甘草（＋生姜・大棗）。六君子湯は四君子湯＋陳皮・半夏。","level":2},
{"cat":"基礎理論","sub":"気血水","type":"tf","q":"四物湯の構成生薬は、当帰・芍薬・川芎・地黄である。","choices":["正しい","誤り"],"answer":[0],"exp":"四物湯は当帰・芍薬・川芎・地黄（熟地黄）の4味からなる補血の基本処方。","level":2},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"四君子湯と四物湯を合わせ、さらに黄耆と桂皮を加えた処方で、気血両虚に用いられるのはどれか。","choices":["十全大補湯","補中益気湯","六君子湯","加味逍遙散","八味地黄丸"],"answer":[0],"exp":"十全大補湯＝四君子湯＋四物湯＋黄耆・桂皮。気虚と血虚を併せた気血両虚に用いる代表的補剤。","level":3},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"六君子湯は四君子湯に何を加えた処方か。","choices":["陳皮・半夏","当帰・川芎","柴胡・黄芩","麻黄・杏仁","大黄・芒硝"],"answer":[0],"exp":"六君子湯＝四君子湯（人参・白朮・茯苓・甘草）＋陳皮・半夏（＋生姜・大棗）。胃腸虚弱で胃内停水・食欲不振のあるものに用いる。","level":3},
{"cat":"基礎理論","sub":"気血水","type":"single","q":"舌の辺縁に歯の痕がつく（歯痕舌・歯圧痕）所見が示唆する病態として最も適切なものはどれか。","choices":["水毒（または気虚）","瘀血","陽明病の実熱","血熱","気逆"],"answer":[0],"exp":"歯痕は舌が腫大（胖大）して歯に押し当てられた痕であり、水毒（水滞）や気虚を示唆する。","level":2},
{"cat":"基礎理論","sub":"気血水","type":"tf","q":"顔面が紅潮し、上半身はのぼせるのに下半身は冷える「冷えのぼせ」は、気逆の症状である。","choices":["正しい","誤り"],"answer":[0],"exp":"冷えのぼせ（上熱下寒）は気が上に突き上がる気逆の典型症状。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"single","q":"日本漢方における「虚証」の説明として最も適切なものはどれか。","choices":["正気（体力・抵抗力）が不足した状態","邪気が盛んで正気も充実した状態","体内に熱がこもった状態","病邪が体表にある状態","気が上衝した状態"],"answer":[0],"exp":"虚証は正気（体力・抵抗力・生体機能）が不足した状態。実証は邪気が盛んで正気も充実しており、邪正闘争が激しい状態。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"single","q":"日本漢方における「実証」の説明として最も適切なものはどれか。","choices":["正気が不足した状態","邪気が盛んで、正気も充実している状態","冷えが主体の状態","病邪が体表にある状態","血が不足した状態"],"answer":[1],"exp":"実証は邪気が盛ん（かつ正気も充実）で、病邪と正気が激しく闘う状態。瀉法で邪を取り除く。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"multi","q":"一般に虚証の患者にみられやすい特徴をすべて選べ。","choices":["体格がやせ型で筋肉が軟弱","胃腸が弱く、食欲が少ない","腹力が軟弱","脈に力がない（虚脈）","声が大きく力強い","便秘しがちで腹力が充実"],"answer":[0,1,2,3],"exp":"虚証：やせ型・筋肉軟弱・胃腸虚弱・腹力軟弱・脈力弱・声が小さいなど。声が力強い、腹力充実は実証の特徴。","level":2},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"single","q":"陰証の特徴として最も適切なものはどれか。","choices":["顔面紅潮・熱感・口渇","寒がり・冷え・顔色蒼白・活動性低下","脈が浮いて速い","発熱して汗が多い","興奮しやすく活動的"],"answer":[1],"exp":"陰証は寒性・非活動性・沈静的で、冷え・寒がり・顔色蒼白・倦怠などを示す。陽証は熱性・活動性・発揚的で、熱感・顔面紅潮・口渇などを示す。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"multi","q":"陽証にみられやすい特徴をすべて選べ。","choices":["熱感・暑がり","顔面紅潮","活動的・発揚的","四肢の冷え","顔色蒼白","脈が数（速い）"],"answer":[0,1,2,5],"exp":"陽証：熱性・活動的・顔面紅潮・口渇・脈数など。四肢の冷え・顔色蒼白は陰証の特徴。","level":2},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"tf","q":"陰陽は病態の性質を表す概念で、陽証は熱性・活動性、陰証は寒性・非活動性の傾向を示す。","choices":["正しい","誤り"],"answer":[0],"exp":"陰陽は病態を二分する最も基本的な概念。陽証＝熱性・発揚性、陰証＝寒性・沈降性。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"single","q":"表証の症状として適切でないものはどれか。","choices":["悪寒","発熱","頭痛","項背部のこわばり","便秘・腹満"],"answer":[4],"exp":"表証（病邪が体表にある）：悪寒・発熱・頭痛・項背部のこわばり・脈浮など。便秘・腹満は裏証（陽明病など）の症状。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"multi","q":"表証の症状・所見をすべて選べ。","choices":["悪寒","発熱","頭痛","項背部のこわばり","脈浮","往来寒熱","潮熱"],"answer":[0,1,2,3,4],"exp":"表証：悪寒・発熱・頭痛・項背部のこわばり・脈浮。往来寒熱は半表半裏（少陽病）、潮熱は裏熱（陽明病）の熱型。","level":2},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"single","q":"表証のときにみられる脈の特徴はどれか。","choices":["浮","沈","遅","微細","結代"],"answer":[0],"exp":"病邪が表にあるときは脈が浮く（浮脈）。裏にあるときは沈脈。遅脈は寒、数脈は熱を示す。微細は少陰病の脈。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"single","q":"悪寒と発熱が交互に現れる熱型で、半表半裏証（少陽病）に特徴的なものはどれか。","choices":["往来寒熱","潮熱","悪寒発熱","微熱","手足厥冷"],"answer":[0],"exp":"往来寒熱は少陽病（半表半裏）の熱型。悪寒発熱（悪寒と発熱が同時）は太陽病、潮熱（潮が満ちるように一定時刻に高まる熱）は陽明病の熱型。","level":2},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"multi","q":"漢方の病態把握に用いる基本的な概念（八綱など）として正しいものをすべて選べ。","choices":["陰陽","虚実","寒熱","表裏","酸塩基","電解質"],"answer":[0,1,2,3],"exp":"陰陽・虚実・寒熱・表裏は病態を把握する基本概念（八綱）。酸塩基・電解質は西洋医学の概念。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"tf","q":"日本漢方では、虚証と実証の中間を「虚実中間証（中間証）」と呼ぶ。","choices":["正しい","誤り"],"answer":[0],"exp":"日本漢方では体力の程度を実証・虚実中間証・虚証のように段階的に捉え、OTC漢方の効能表示にも「体力中等度」などとして反映されている。","level":2},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"tf","q":"冷え・寒がり・温かい飲食を好むといった症状は熱証を示す。","choices":["正しい","誤り"],"answer":[1],"exp":"これらは寒証の症状。熱証は暑がり・顔面紅潮・口渇・冷たい飲み物を好むなどの症状を示す。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"single","q":"裏証の説明として最も適切なものはどれか。","choices":["病邪が体表（皮膚・筋肉など）にある状態","病邪が体の深部（消化管など内臓）にある状態","表と裏の中間にある状態","正気が不足した状態","気が上衝した状態"],"answer":[1],"exp":"裏証は病邪が体の深部（主に消化管）にある状態で、腹満・便秘・下痢などを示す。表証は体表、半表半裏は表と裏の中間（胸脇部など）。","level":1},
{"cat":"基礎理論","sub":"虚実・陰陽","type":"tf","q":"「上熱下寒」のように、寒と熱が同一患者に混在することがある。","choices":["正しい","誤り"],"answer":[0],"exp":"寒熱は混在しうる（寒熱錯雑）。上熱下寒（冷えのぼせ）はその典型。","level":2},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"太陽病の治療原則として最も適切なものはどれか。","choices":["発汗","瀉下","和解","温補","催吐"],"answer":[0],"exp":"太陽病は病邪が表にある段階で、発汗（汗法）により邪を発散させる。少陽病＝和解（柴胡剤）、陽明病＝清熱・瀉下、三陰病＝温補。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"少陽病の治療原則として最も適切なものはどれか。","choices":["発汗","瀉下","和解","温補","催吐"],"answer":[2],"exp":"少陽病は半表半裏の病態で、発汗も瀉下も適さず「和解」を行う。代表は柴胡剤（小柴胡湯など）。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"陽明病の治療原則として最も適切なものはどれか。","choices":["発汗","清熱・瀉下","和解","温補","利水"],"answer":[1],"exp":"陽明病は裏の実熱で、白虎湯類で清熱し、承気湯類で瀉下する。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"太陰病・少陰病・厥陰病（三陰病）に共通する治療原則として最も適切なものはどれか。","choices":["発汗","瀉下","和解","温補","催吐"],"answer":[3],"exp":"三陰病は寒・虚が主体の段階であり、温めて補う（温補）のが原則。附子・乾姜などの温熱薬を含む処方を用いる。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"傷寒（急性熱性疾患）の経過を6つの病期に分けたもので、最初の病期はどれか。","choices":["太陽病","少陽病","陽明病","太陰病","厥陰病"],"answer":[0],"exp":"六病位は『傷寒論』に基づく病期分類。病邪はまず体表を侵し太陽病となる。三陽病（太陽・少陽・陽明）→三陰病（太陰・少陰・厥陰）と進行する。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"六病位のうち、最も病態が進行し重篤とされる病期はどれか。","choices":["太陽病","少陽病","陽明病","少陰病","厥陰病"],"answer":[4],"exp":"厥陰病は六病位の最終段階で、最も重篤な病期とされる。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"multi","q":"三陽病に該当するものをすべて選べ。","choices":["太陽病","少陽病","陽明病","太陰病","少陰病","厥陰病"],"answer":[0,1,2],"exp":"三陽病：太陽病・少陽病・陽明病（熱・実が主体）。三陰病：太陰病・少陰病・厥陰病（寒・虚が主体）。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"multi","q":"三陰病に該当するものをすべて選べ。","choices":["太陽病","少陽病","陽明病","太陰病","少陰病","厥陰病"],"answer":[3,4,5],"exp":"三陰病：太陰病・少陰病・厥陰病。いずれも温補が治療原則。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"日本漢方で一般に説明される六病位の進行順序として正しいものはどれか。","choices":["太陽病→少陽病→陽明病→太陰病→少陰病→厥陰病","太陽病→陽明病→厥陰病→少陽病→太陰病→少陰病","少陽病→太陽病→陽明病→少陰病→太陰病→厥陰病","太陰病→少陰病→厥陰病→太陽病→少陽病→陽明病","陽明病→少陽病→太陽病→厥陰病→少陰病→太陰病"],"answer":[0],"exp":"日本漢方では一般に、表（太陽）→半表半裏（少陽）→裏（陽明）と病邪が深部に進み、その後三陰病（太陰→少陰→厥陰）へ移行すると説明される。なお『傷寒論』の記載順は太陽・陽明・少陽の順である。","level":2},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"太陽病の病位はどこか。","choices":["表","半表半裏","裏","表と裏の両方","特定されない"],"answer":[0],"exp":"太陽病＝表、少陽病＝半表半裏、陽明病＝裏（裏熱実）。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"少陽病の病位はどこか。","choices":["表","半表半裏","裏","皮膚","四肢末端"],"answer":[1],"exp":"少陽病は表と裏の中間＝半表半裏（胸脇部・横隔膜周辺）に病邪があるとされる。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"脈浮、頭痛、項背部のこわばり、悪寒がみられる病期はどれか。","choices":["太陽病","少陽病","陽明病","太陰病","少陰病"],"answer":[0],"exp":"『傷寒論』太陽病の提綱：「太陽の病たる、脈浮、頭項強痛して悪寒す」。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"口が苦い、喉が乾く、目がくらむ、往来寒熱、胸脇苦満がみられる病期はどれか。","choices":["太陽病","少陽病","陽明病","太陰病","厥陰病"],"answer":[1],"exp":"少陽病の提綱は「口苦く、咽乾き、目眩く」。往来寒熱・胸脇苦満・食欲不振・悪心なども特徴で、小柴胡湯が代表処方。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"高熱（潮熱）、口渇、多汗、便秘、腹満がみられる病期はどれか。","choices":["太陽病","少陽病","陽明病","太陰病","少陰病"],"answer":[2],"exp":"陽明病は裏の実熱で、潮熱・口渇・発汗・便秘・腹満・譫語などを呈する。提綱は「胃家実」。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"腹部膨満、嘔吐、食欲不振、下痢（自利）、時に腹痛がみられ、寒・虚の状態にある病期はどれか。","choices":["太陽病","少陽病","陽明病","太陰病","厥陰病"],"answer":[3],"exp":"太陰病は裏の虚寒で、腹満・嘔吐・食欲不振・自利（下痢）・時腹痛を呈する。代表処方：人参湯、桂枝加芍薬湯。","level":2},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"脈が微細で、ただ寝ていたい（但欲寐）という状態を特徴とする病期はどれか。","choices":["太陽病","少陽病","陽明病","少陰病","太陰病"],"answer":[3],"exp":"少陰病の提綱：「少陰の病たる、脈微細、ただ寐んと欲す」。全身の機能が衰え、強い倦怠・冷えを示す。代表処方：麻黄附子細辛湯、真武湯。","level":2},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"少陽病の代表処方はどれか。","choices":["小柴胡湯","麻黄湯","白虎湯","人参湯","真武湯"],"answer":[0],"exp":"小柴胡湯は柴胡剤の代表で少陽病（和解）に用いる。麻黄湯＝太陽病、白虎湯＝陽明病、人参湯＝太陰病、真武湯＝少陰病。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"multi","q":"太陽病に用いられる代表的な処方をすべて選べ。","choices":["桂枝湯","葛根湯","麻黄湯","小柴胡湯","大承気湯","真武湯"],"answer":[0,1,2],"exp":"太陽病（発汗）：桂枝湯（虚証・自汗あり）、葛根湯（項背部のこわばり・無汗）、麻黄湯（実証・無汗）。小柴胡湯＝少陽病、大承気湯＝陽明病、真武湯＝少陰病。","level":1},
{"cat":"基礎理論","sub":"六病位","type":"multi","q":"陽明病に用いられる代表的な処方をすべて選べ。","choices":["白虎湯（白虎加人参湯）","大承気湯","調胃承気湯","桂枝湯","人参湯","麻黄附子細辛湯"],"answer":[0,1,2],"exp":"陽明病：清熱の白虎湯類（石膏・知母）、瀉下の承気湯類（大黄・芒硝）。桂枝湯は太陽病、人参湯は太陰病、麻黄附子細辛湯は少陰病。","level":2},
{"cat":"基礎理論","sub":"六病位","type":"multi","q":"太陰病に用いられる代表的な処方をすべて選べ。","choices":["人参湯","桂枝加芍薬湯","麻黄湯","白虎湯","小柴胡湯"],"answer":[0,1],"exp":"太陰病：人参湯（理中丸）、桂枝加芍薬湯（腹満・腹痛）。","level":2},
{"cat":"基礎理論","sub":"六病位","type":"multi","q":"少陰病に用いられる代表的な処方をすべて選べ。","choices":["麻黄附子細辛湯","真武湯","葛根湯","大承気湯","小柴胡湯"],"answer":[0,1],"exp":"少陰病：麻黄附子細辛湯（表寒を伴う少陰病）、真武湯（裏寒・水毒）。いずれも附子を含み温補する。","level":2},

{"cat":"基礎理論","sub":"六病位","type":"single","q":"太陽病で、汗が出ず（無汗）、悪寒・発熱・関節痛があり、体力充実した人に用いる処方はどれか。","choices":["麻黄湯","桂枝湯","人参湯","真武湯","小建中湯"],"answer":[0],"exp":"麻黄湯は太陽病の実証（表実：無汗、脈浮緊）に用いる。インフルエンザ初期の悪寒・発熱・関節痛など。","level":2},
{"cat":"基礎理論","sub":"六病位","type":"single","q":"太陽病で、無汗で特に項背部のこわばりが強い場合に用いる処方はどれか。","choices":["葛根湯","桂枝湯","小柴胡湯","白虎湯","人参湯"],"answer":[0],"exp":"葛根湯は「項背強ばること几几（きき）、汗なく悪風する」ものに用いる。","level":2},

{"cat":"基礎理論","sub":"五行","type":"tf","q":"五行の相剋関係において、火は水を剋する。","choices":["正しい","誤り"],"answer":[1],"exp":"水剋火（水が火を消す）が正しい。火が剋するのは金（火剋金）。","level":2},
{"cat":"基礎理論","sub":"五行","type":"single","q":"五味のうち「辛」味の主な作用として最も適切なものはどれか。","choices":["発散（気血を巡らせる）","収斂（引き締める）","緩和（緊張をゆるめる）","軟堅（硬いものを軟らかくする）","燥湿・瀉下"],"answer":[0],"exp":"五味の作用：辛＝発散・行気、酸＝収斂、甘＝緩和・補益、苦＝燥湿・瀉下（清熱）、鹹＝軟堅・瀉下。","level":2},
{"cat":"基礎理論","sub":"五行","type":"single","q":"五味のうち「酸」味の主な作用として最も適切なものはどれか。","choices":["発散","収斂","緩和","軟堅","利水"],"answer":[1],"exp":"酸味は収斂（汗・尿・便などが漏れ出るのを引き締める）作用をもつ。代表生薬：五味子、山茱萸など。","level":2},
{"cat":"基礎理論","sub":"五行","type":"single","q":"五味のうち「甘」味の主な作用として最も適切なものはどれか。","choices":["発散","収斂","緩和・補益","軟堅","燥湿"],"answer":[2],"exp":"甘味は緩和（急迫症状をゆるめる）・補益・調和作用をもつ。代表生薬：甘草、大棗。","level":2},
{"cat":"基礎理論","sub":"五行","type":"single","q":"五味のうち「鹹」味をもち、軟堅・瀉下作用を示す生薬はどれか。","choices":["芒硝","甘草","黄連","五味子","桂皮"],"answer":[0],"exp":"芒硝（硫酸ナトリウム）は鹹・寒で、軟堅・瀉下作用をもつ。甘草＝甘、黄連＝苦、五味子＝酸、桂皮＝辛。","level":3},
{"cat":"基礎理論","sub":"生薬の性味","type":"single","q":"熱性（大熱）の代表的な生薬で、新陳代謝を高め体を強く温める作用をもつものはどれか。","choices":["附子","石膏","大黄","黄連","甘草"],"answer":[0],"exp":"附子は熱（大熱）で、強力な温裏・散寒・鎮痛作用をもち、三陰病の処方（真武湯・麻黄附子細辛湯など）に用いる。石膏・大黄・黄連は寒、甘草は平。","level":1},
{"cat":"基礎理論","sub":"生薬の性味","type":"single","q":"寒性の生薬はどれか。","choices":["石膏","附子","乾姜","桂皮","当帰"],"answer":[0],"exp":"石膏は寒（大寒）で清熱作用をもつ。附子・乾姜は熱、桂皮・当帰は温。","level":1},
{"cat":"基礎理論","sub":"生薬の性味","type":"single","q":"五性が「平」とされ、多くの処方に配合されて諸薬を調和する生薬はどれか。","choices":["甘草","附子","石膏","黄連","乾姜"],"answer":[0],"exp":"甘草は甘・平で、諸薬の調和・緩和作用をもち、医療用漢方製剤の約7割に配合される。","level":1},
{"cat":"基礎理論","sub":"生薬の性味","type":"multi","q":"寒性（寒・涼）の生薬をすべて選べ。","choices":["石膏","大黄","黄連","附子","乾姜","桂皮"],"answer":[0,1,2],"exp":"石膏・大黄・黄連は寒性。附子・乾姜は熱性、桂皮は温性。","level":2},
{"cat":"基礎理論","sub":"生薬の性味","type":"multi","q":"温熱性（温・熱）の生薬をすべて選べ。","choices":["附子","乾姜","桂皮","石膏","黄連","大黄"],"answer":[0,1,2],"exp":"附子・乾姜は熱性、桂皮は温性。石膏・黄連・大黄は寒性。","level":2},
{"cat":"基礎理論","sub":"生薬の性味","type":"single","q":"苦味・寒性で、清熱作用をもつ代表的な生薬はどれか。","choices":["黄連","甘草","大棗","桂皮","五味子"],"answer":[0],"exp":"黄連は苦・寒で清熱燥湿作用をもつ（黄連解毒湯・半夏瀉心湯などに配合）。甘草・大棗は甘、桂皮は辛・温、五味子は酸・温。","level":2},
{"cat":"基礎理論","sub":"生薬の性味","type":"single","q":"五味のうち「酸」味を代表する生薬はどれか。","choices":["五味子","黄連","甘草","芒硝","細辛"],"answer":[0],"exp":"五味子は五味をすべて備えるといわれるが酸味が主で、収斂作用をもつ。","level":3},
{"cat":"基礎理論","sub":"生薬の性味","type":"tf","q":"生薬の「五性」は生薬の寒熱の性質を表し、熱証には寒涼性の生薬を用いる。","choices":["正しい","誤り"],"answer":[0],"exp":"五性＝寒・涼・平・温・熱。熱証には寒涼薬（石膏・黄連・大黄など）、寒証には温熱薬（附子・乾姜・桂皮など）。","level":1},
{"cat":"基礎理論","sub":"生薬の性味","type":"tf","q":"乾姜（ショウキョウを蒸して乾燥したもの）は寒性の生薬である。","choices":["正しい","誤り"],"answer":[1],"exp":"乾姜は辛・熱（大熱）で、裏を温める作用が強い。人参湯・大建中湯などに配合される。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"漢方の四診に含まれないものはどれか。","choices":["望診","聞診","問診","切診","打診"],"answer":[4],"exp":"四診＝望診（視覚）・聞診（聴覚・嗅覚）・問診（問いかけ）・切診（触診：脈診・腹診）。打診は西洋医学の診察法。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"舌診はどの診察法に含まれるか。","choices":["望診","聞診","問診","切診","触診"],"answer":[0],"exp":"舌診は視覚による観察なので望診に含まれる。顔色・体格・皮膚の状態なども望診。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"脈診と腹診はどの診察法に含まれるか。","choices":["望診","聞診","問診","切診","視診"],"answer":[3],"exp":"切診は患者の体に直接触れて行う診察で、脈診と腹診が中心。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"声の強弱、咳の性状、口臭・体臭などを観察する診察法はどれか。","choices":["望診","聞診","問診","切診","腹診"],"answer":[1],"exp":"聞診は聴覚（声・呼吸音・咳・腸鳴など）と嗅覚（口臭・体臭・排泄物の臭い）による診察。","level":1},
{"cat":"基礎理論","sub":"四診","type":"multi","q":"切診に含まれる診察をすべて選べ。","choices":["脈診","腹診","舌診","顔色の観察","においの確認"],"answer":[0,1],"exp":"切診＝脈診・腹診（体に触れる診察）。舌診・顔色の観察は望診、においの確認は聞診。","level":1},
{"cat":"基礎理論","sub":"四診","type":"multi","q":"望診に含まれる診察をすべて選べ。","choices":["舌診","顔色の観察","体格の観察","脈診","声の強弱の観察"],"answer":[0,1,2],"exp":"望診＝視覚による観察（舌・顔色・体格・皮膚・爪・姿勢など）。脈診は切診、声は聞診。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"日本漢方で特に重視され、発展した診察法はどれか。","choices":["腹診","舌診","脈診","聞診","問診"],"answer":[0],"exp":"腹診は江戸時代の日本で独自に発達し、日本漢方の特徴とされる（中医学では脈診・舌診が重視される）。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"舌診で観察する「舌苔」の説明として正しいものはどれか。","choices":["舌の表面に付着した苔状のもの","舌そのものの色や形","舌下の静脈","舌の動き","舌の味覚"],"answer":[0],"exp":"舌診では舌質（舌そのものの色・形・大きさ）と舌苔（舌表面の苔状物の色・厚さ・湿潤度）を観察する。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"舌質が暗紫色を呈し、舌下静脈の怒張がみられる。示唆される病態はどれか。","choices":["瘀血","気虚","水毒","気鬱","表証"],"answer":[0],"exp":"暗紫色の舌・舌下静脈の怒張は瘀血の所見。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"舌苔が黄色を呈する場合、一般に示唆されるものはどれか。","choices":["熱（裏熱）","寒","血虚","表証","気虚"],"answer":[0],"exp":"黄苔は熱（特に裏熱）を示唆する。白苔は寒や表証、病初期を示唆することが多い。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"舌質が淡白（色が薄い）である場合、一般に示唆される病態はどれか。","choices":["血虚・気虚（寒）","瘀血","実熱","陽明病","気逆"],"answer":[0],"exp":"淡白舌は血虚・気虚・寒を示唆する。紅舌は熱、暗紫色は瘀血。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"脈が「数（さく）」であるとき示唆されるものはどれか。","choices":["熱","寒","表","裏","虚"],"answer":[0],"exp":"脈の速さ：数（速い）＝熱、遅（遅い）＝寒。脈の深さ：浮＝表、沈＝裏。脈の強さ：実（有力）＝実証、虚（無力）＝虚証。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"脈が「沈」であるとき示唆されるものはどれか。","choices":["裏","表","熱","実","半表半裏"],"answer":[0],"exp":"沈脈（強く押さえて触れる）は病が裏にあることを示す。浮脈（軽く触れて触れる）は表。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"脈が「遅」であるとき示唆されるものはどれか。","choices":["寒","熱","表","実","気逆"],"answer":[0],"exp":"遅脈は寒、数脈は熱を示す。","level":1},
{"cat":"基礎理論","sub":"四診","type":"multi","q":"脈診における組み合わせとして正しいものをすべて選べ。","choices":["浮－表","沈－裏","数－熱","遅－寒","浮－裏","数－寒"],"answer":[0,1,2,3],"exp":"浮＝表、沈＝裏、数＝熱、遅＝寒。","level":1},
{"cat":"基礎理論","sub":"四診","type":"tf","q":"脈に力がある（実脈）場合は実証、力がない（虚脈）場合は虚証を示唆する。","choices":["正しい","誤り"],"answer":[0],"exp":"脈の強弱は虚実の判断材料となる。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"腹診で、季肋部（肋骨弓下）に充満感・抵抗・圧痛がみられる所見を何というか。","choices":["胸脇苦満","心下痞鞕","腹皮拘急","小腹不仁","小腹急結"],"answer":[0],"exp":"胸脇苦満は少陽病（半表半裏）の代表的な腹証で、柴胡剤（小柴胡湯・大柴胡湯・柴胡桂枝湯など）の使用目標。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"胸脇苦満がみられるとき、使用が考慮される処方群はどれか。","choices":["柴胡剤","麻黄剤","承気湯類","附子剤","四物湯類"],"answer":[0],"exp":"胸脇苦満は柴胡剤の使用目標。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"腹診で、みぞおち（心窩部）につかえ感があり、押さえると抵抗がある所見を何というか。","choices":["心下痞鞕","胸脇苦満","小腹急結","臍上悸","腹皮拘急"],"answer":[0],"exp":"心下痞鞕（しんかひこう）は心窩部のつかえと抵抗。人参を含む処方（人参湯・半夏瀉心湯など）の使用目標とされる。自覚的つかえ感のみで抵抗がないものは「心下痞」。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"腹診で腹直筋が緊張している所見を何というか。","choices":["腹皮拘急","胸脇苦満","心下痞鞕","小腹不仁","胃内停水"],"answer":[0],"exp":"腹皮拘急は腹直筋の緊張（攣急）で、芍薬を含む処方（小建中湯・芍薬甘草湯・桂枝加芍薬湯など）の使用目標。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"腹診で、臍下（下腹部）の力が弱く、軟弱・知覚鈍麻がみられる所見を何というか。主に腎虚を示し八味地黄丸の使用目標とされる。","choices":["小腹不仁","小腹急結","腹皮拘急","胸脇苦満","心下痞鞕"],"answer":[0],"exp":"小腹不仁（臍下不仁）は下腹部の脱力・軟弱で腎虚を示し、八味地黄丸・牛車腎気丸などの使用目標。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"腹診で、左下腹部（左腸骨窩）に擦過するように触れると強い圧痛を訴える所見を何というか。","choices":["小腹急結","小腹不仁","胸脇苦満","腹皮拘急","臍上悸"],"answer":[0],"exp":"小腹急結は瘀血の腹証で、桃核承気湯の使用目標とされる。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"小腹急結がみられる実証の瘀血に用いられる代表処方はどれか。","choices":["桃核承気湯","八味地黄丸","小柴胡湯","六君子湯","半夏厚朴湯"],"answer":[0],"exp":"桃核承気湯は小腹急結を目標に、実証の瘀血（便秘・のぼせを伴う）に用いる。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"心窩部を軽く叩くとポチャポチャという音がする所見を何というか。","choices":["胃内停水（振水音）","心下痞鞕","臍上悸","腹皮拘急","胸脇苦満"],"answer":[0],"exp":"胃内停水（振水音）は水毒の所見。","level":1},
{"cat":"基礎理論","sub":"四診","type":"single","q":"腹診で臍の傍らに圧痛がみられる所見（臍傍圧痛）が示唆する病態はどれか。","choices":["瘀血","気虚","水毒","表証","気鬱"],"answer":[0],"exp":"臍傍圧痛は瘀血の腹証で、桂枝茯苓丸などの駆瘀血剤の使用目標。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"腹部大動脈の拍動を臍上で触知する所見（臍上悸）が示唆する病態として最も適切なものはどれか。","choices":["気逆（あるいは水毒）","瘀血","血虚","陽明病の実熱","表証"],"answer":[0],"exp":"心下悸・臍上悸・臍下悸などの腹部動悸は、気逆（気の上衝）や水毒を示唆し、苓桂朮甘湯や竜骨・牡蛎を含む処方（柴胡加竜骨牡蛎湯・桂枝加竜骨牡蛎湯）などの使用目標となる。","level":3},
{"cat":"基礎理論","sub":"四診","type":"multi","q":"瘀血を示唆する腹証をすべて選べ。","choices":["小腹急結","臍傍圧痛","胸脇苦満","胃内停水","腹皮拘急"],"answer":[0,1],"exp":"瘀血の腹証：小腹急結・臍傍圧痛。胸脇苦満は少陽病（柴胡剤）、胃内停水は水毒、腹皮拘急は腹直筋緊張（芍薬剤）。","level":2},
{"cat":"基礎理論","sub":"四診","type":"single","q":"腹証とそれに対応する処方群・生薬の組み合わせとして誤っているものはどれか。","choices":["胸脇苦満－柴胡剤","心下痞鞕－人参・瀉心湯類","小腹不仁－八味地黄丸","小腹急結－桃核承気湯","腹皮拘急－麻黄湯"],"answer":[4],"exp":"腹皮拘急（腹直筋の緊張）は芍薬を含む処方（小建中湯・芍薬甘草湯など）の目標。麻黄湯は太陽病の実証（無汗・脈浮緊）に用いる。","level":3},
{"cat":"基礎理論","sub":"四診","type":"tf","q":"腹力が充実していることは実証、腹力が軟弱であることは虚証を示唆する。","choices":["正しい","誤り"],"answer":[0],"exp":"腹力（腹壁の緊張度）は虚実判定の重要な指標。","level":1},
{"cat":"基礎理論","sub":"四診","type":"tf","q":"問診では、自覚症状のほか、寒がり・暑がり、食欲、便通、睡眠、月経などについて尋ねる。","choices":["正しい","誤り"],"answer":[0],"exp":"問診で寒熱・飲食・二便（大便・小便）・睡眠・月経・汗などを確認し、証の判定に用いる。","level":1},
{"cat":"基礎理論","sub":"四診","type":"tf","q":"聞診には、患者の口臭や体臭など、においを嗅ぐことも含まれる。","choices":["正しい","誤り"],"answer":[0],"exp":"聞診は「聞く（聴覚）」と「嗅ぐ（嗅覚）」の両方を含む。","level":2},

{"cat":"麻黄剤(予想)","sub":"症例","type":"single","q":"74歳女性。冷え症で体力が低下している。冬になるとかぜをひきやすく、発熱は軽いのに寒気と全身倦怠感が強い。のどにチクチクした痛みもある。最も適した処方はどれか。","choices":["麻黄湯","麻黄附子細辛湯","越婢加朮湯","葛根湯","麻杏甘石湯"],"answer":[1],"exp":"熱感が乏しく悪寒・倦怠・冷えが強い＝少陰病の感冒＝麻黄附子細辛湯。麻黄湯は体力充実した太陽病実証向けで、高齢虚弱者には不向き。","level":2},
{"cat":"麻黄剤(予想)","sub":"症例","type":"single","q":"26歳女性。産後2週間。片側乳房が発赤腫脹し、悪寒・発熱・頭痛があるが汗は出ていない。発症初期。葛根湯の効能にも含まれる疾患として、最も適した処方はどれか。","choices":["葛根湯","麻杏薏甘湯","小青竜湯","麻黄附子細辛湯","麻杏甘石湯"],"answer":[0],"exp":"葛根湯の効能には炎症性疾患（結膜炎・角膜炎・中耳炎・扁桃腺炎・乳腺炎・リンパ腺炎）の初期も含まれる。","level":3},
{"cat":"麻黄剤(予想)","sub":"症例","type":"single","q":"体力中等度以上の35歳男性。かぜの初期で、悪寒・発熱・頭痛があり汗は出ていない。項背部のこわばりは特になく、全身の節々の痛みと腰痛が強い。葛根湯と迷うが、より適した処方はどれか。","choices":["葛根湯","麻黄湯","桂枝湯","麻黄附子細辛湯","小青竜湯"],"answer":[1],"exp":"同じ無汗の太陽病実証でも、項背強→葛根湯、身体痛・腰痛・関節痛（骨節疼痛）が目立つ→麻黄湯。","level":2},
{"cat":"麻黄剤(予想)","sub":"症例","type":"single","q":"体力虚弱な40歳女性。かぜをひき、悪風・発熱・頭痛があるが、じわっと自然に汗が出ている。脈は浮弱。最も適した処方はどれか。","choices":["麻黄湯","葛根湯","桂枝湯","麻黄附子細辛湯","小青竜湯"],"answer":[2],"exp":"自汗（自然発汗あり）・脈浮弱の太陽病虚証＝桂枝湯。麻黄湯・葛根湯は無汗・脈浮緊の実証。","level":1},
{"cat":"麻黄剤(予想)","sub":"症例","type":"single","q":"体力充実した30歳男性。かぜの初期で、悪寒・発熱・頭痛・関節痛があり、汗は出ていない。脈は浮緊。最も適した処方はどれか。","choices":["桂枝湯","麻黄湯","小建中湯","桂枝加朮附湯","麻黄附子細辛湯"],"answer":[1],"exp":"無汗・脈浮緊・関節痛＝麻黄湯。桂枝湯は自汗・脈浮弱の虚証。","level":1},

{"cat":"麻黄剤(予想)","sub":"症例","type":"single","q":"38歳男性。アレルギー性鼻炎ではなく、鼻閉が主訴で鼻汁はあまり出ない。頭が重く、副鼻腔炎の既往がある。最も適した処方はどれか。","choices":["小青竜湯","葛根湯加川芎辛夷","麻杏甘石湯","麻黄湯","越婢加朮湯"],"answer":[1],"exp":"水様性鼻汁中心→小青竜湯、鼻閉・副鼻腔炎中心→葛根湯加川芎辛夷、と使い分ける。","level":2},

{"cat":"麻黄剤(予想)","sub":"症例","type":"single","q":"68歳男性。肺気腫の既往はない。かぜのあと、うすい泡沫状の痰が多く出て咳が続き、鼻水も多い。冷えはあるが倦怠感はそれほどでもない。最も適した処方はどれか。","choices":["麻杏甘石湯","小青竜湯","越婢加朮湯","麻杏薏甘湯","葛根湯加川芎辛夷"],"answer":[1],"exp":"水様（泡沫状）の痰・鼻水＝小青竜湯。乾姜・細辛・五味子・半夏が水毒を温めてさばく。","level":2},
{"cat":"麻黄剤(予想)","sub":"症例","type":"single","q":"体力のある40歳男性。かぜの初期で悪寒・発熱・無汗・項背部のこわばりに加えて、鼻づまりもひどい。基本処方に辛夷と川芎を加えた処方を選ぶとすればどれか。","choices":["麻黄湯","葛根湯加川芎辛夷","小青竜湯","麻杏甘石湯","麻黄附子細辛湯"],"answer":[1],"exp":"葛根湯加川芎辛夷＝葛根湯＋川芎・辛夷。鼻閉の強いケースで用いる（日本で作られた本朝経験方）。","level":2},

{"cat":"麻黄剤(予想)","sub":"症例","type":"single","q":"82歳女性。心房細動と高血圧で治療中。かぜをひき悪寒・発熱・関節痛・無汗。麻黄湯の証にみえるが、まず注意すべき点として最も適切なのはどれか。","choices":["麻黄のエフェドリンにより動悸・頻脈・血圧上昇が起こりうる","甘草による低血糖が起こりうる","附子中毒が起こりうる","大黄による下痢が起こりうる","柴胡による間質性肺炎が起こりうる"],"answer":[0],"exp":"麻黄湯は麻黄5g（ツムラ）。高齢者・循環器疾患・高血圧の患者では交感神経刺激作用（動悸・頻脈・血圧上昇）に注意。麻黄湯には附子・大黄・柴胡は含まれない。","level":2},

{"cat":"柴胡剤(予想)","sub":"症例","type":"single","q":"30歳男性。体力中等度。仕事のストレスで胃が痛み、腹直筋が両側で突っ張っている。季肋部にも抵抗があり、緊張すると手足が冷たくなる。最も適した処方はどれか。","choices":["補中益気湯","加味逍遙散","四逆散","柴胡桂枝乾姜湯","抑肝散"],"answer":[2],"exp":"四逆散（柴胡・芍薬・枳実・甘草）：胸脇苦満＋腹直筋の緊張、ストレス、手足の冷え（四逆）。効能：胆嚢炎、胃炎、胃酸過多、神経質など。","level":2},

{"cat":"柴胡剤(予想)","sub":"症例","type":"single","q":"1歳男児。夜中に何度も起きて激しく泣き、かんしゃくが強く、すぐにひきつけるように怒る（疳の虫）。最も適した処方はどれか。","choices":["大柴胡湯","抑肝散","柴胡加竜骨牡蛎湯","補中益気湯","四逆散"],"answer":[1],"exp":"抑肝散の効能：神経症、不眠症、小児夜なき、小児疳症。原典『保嬰撮要』は小児の処方。","level":1},
{"cat":"柴胡剤(予想)","sub":"症例","type":"single","q":"49歳女性。更年期。急に顔がほてって汗が出る（ホットフラッシュ）、イライラ、肩こり、不眠など多彩な訴えがあり、訴えが日によって変わる。疲れやすく冷えもある。最も適した処方はどれか。","choices":["大柴胡湯","小柴胡湯","加味逍遙散","柴胡加竜骨牡蛎湯","四逆散"],"answer":[2],"exp":"加味逍遙散：虚弱で疲れやすく精神不安・いらだちのある女性の更年期障害・月経不順・冷え症など。不定愁訴が特徴。山梔子・牡丹皮がのぼせ（熱）を冷ます。","level":1},

{"cat":"柴胡剤(予想)","sub":"症例","type":"single","q":"70歳女性。毎年夏になると食欲がなくなり、やせて、だるさが強い（夏やせ）。胃腸が弱い。最も適した処方はどれか。","choices":["大柴胡湯","柴胡加竜骨牡蛎湯","補中益気湯","四逆散","抑肝散"],"answer":[2],"exp":"補中益気湯の効能：夏やせ、病後の体力増強、結核症、食欲不振、胃下垂、感冒、痔、脱肛、子宮下垂、陰萎、半身不随、多汗症。","level":1},

  const sample = (a, n) => shuffle(a).slice(0, n);

    if (x !== y) return x < y ? -1 : 1;

  const sortedHerbs = (f) => herbsOf(f).sort(gojuon);

  function norm(s) {
    return String(s).trim().replace(/[\s　、,。．.]/g, "")
